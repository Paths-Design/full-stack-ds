acceptance:
  - id: A1
    given: 'the NavList contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'the root lowers with its list content region and composed item class, the uncarried orientation axis and a11y-label facts are adjudicated, and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the NavList control and composed item class, the twenty-three-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'consumer items are composed into the nav list'
    then: 'the items render under the list region with their classes and no orientation/a11y-label API is emitted'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'NavList, its list/item regions and refused/pending axes are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the NavList behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove NavList from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'navlist-container'
