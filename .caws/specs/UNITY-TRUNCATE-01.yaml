    then: 'packages/ds-unity contains the Truncate control and the shared ExpansionControl runtime, the forty-nine-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'expandable/labels/expanded/default-expanded/controlled are exercised and the toggle is activated'
    then: 'the runtime hides/shows the toggle from the expandable prop, paints the state label, toggles the channel with commit/request semantics, keeps the content slot consumer-owned and renders no line-clamp API'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'Truncate, its reuse of the expansion runtime, the guarded toggle and the unclaimed line-clamp/measurement/localised-message facts are stated'
