id: A11Y-AUDIT-DEPTH-01
title: 'A11y audit: per-key, roving-reachability, state-attribute, and native-family realization checks'
mode: feature
lifecycle_state: active
created_at: '2026-10-18T05:17:53.538Z'
updated_at: '2026-10-18T07:49:16.504Z'
