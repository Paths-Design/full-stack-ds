acceptance:
  - id: A1
    given: 'the Pinterest page with a pin overflow menu or detail board chooser open'
    when: 'any Button or Text inside .pin-menu is measured'
    then: 'computed border-width is 0px and computed font-size is 14px (page scope reaches portaled popover content)'
  - id: A2
    given: 'the Spotify page at a 390px viewport'
    when: 'each .quick-pick .button is measured'
    then: 'scrollWidth <= clientWidth for every quick-pick label (no clipped glyphs)'
  - id: A3
    given: 'any Pin detail view'
    when: 'the related More-like-this rail renders'
    then: 'every pin in the rail uses a distinct artwork src (no duplicate data-URIs)'
  - id: A4
    given: 'the Spotify page at desktop width'
    when: 'the library panel renders'
    then: 'the Home button left edge aligns with the Soundroom heading left edge within 2px'
  - id: A5
    given: 'the Pin detail view'
    when: 'the comments list is empty'
    then: 'the gap between the comments region and the comment form is <= 24px'
  - id: A6
    given: 'the Pinterest feed at a <=700px viewport'
    when: 'save overlays render'
    then: 'each save button is at most 44px tall (reduced footprint over artwork)'
  - id: A7
    given: 'the committed retoken-pages Playwright suite'
    when: 'it runs at 1440px and 390px for both pages'
    then: 'all existing facts and interactions pass unchanged'
observability:
