invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; an a11y keyboard claim stays lowered only where a channel or projected action root realises it'
acceptance:
  - id: A1
    given: 'the Table contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'the responsive wrapper and native table region lower with their metadata refusals, the keyboard/sort facts are classified honestly by behavior fact, and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the Table control and table region, the twenty-five-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'consumer rows are composed into the table region'
    then: 'the rows render inside the wrapper and no responsive/aria-label API is emitted'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'Table, its composed row/cell non-claim and the keyboard honesty boundary are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the Table behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Table from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'table-container'
    type: behavior
    path: 'packages/ds-contracts/components/Table/Table.contract.json'
