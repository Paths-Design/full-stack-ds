id: UNITY-PAGINATION-01
title: 'Admit Pagination to the Unity target as a runtime-built page strip'
mode: feature
lifecycle_state: draft
created_at: '2026-10-31T15:31:08.213Z'
updated_at: '2026-10-31T15:31:08.213Z'
created_by_session: 'session-5800e41f-e414-466a-a520-b46288f6bf5f'
blast_radius:
  modules:
    - 'Unity page-strip lowering: numeric index channel over runtime-built native page buttons from the declared page labels'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/frameworks/unity'
    - 'packages/ds-codegen/src/cli.test.ts'
    - 'packages/ds-unity/Runtime'
    - 'packages/ds-unity/Tests'
    - 'packages/ds-unity/Editor'
    - 'packages/ds-unity/README.md'
    - 'fsds.targets.json'
    - 'docs/architecture/unity-target.md'
    - 'docs/current-implementation-snapshot.md'
    - 'scripts/unity-tests.mjs'
  out: []
invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; current-position visual styling is not claimed, and the runtime builds only the declared item structure and labels'
acceptance:
  - id: A1
    given: 'the Pagination contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'the generated page strip exposes the index/default-index/pages/callback API, the presentation/progress carriers, runtime-built item classes, and adjudicated iteration/sequence/message/type/current-state rules with no allowlisted catch-all reliance'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the Pagination control and PageStripControl runtime, the forty-three-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'pages are set, an item is activated, disabled and controlled modes apply, and carriers change'
    then: 'the runtime builds and paints the item buttons, uncontrolled activation commits the index, disabled blocks it, controlled raises a request without committing, and no aria/current-state API is emitted'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'Pagination, its runtime-built page strip, index/carrier API and the unclaimed current-state/aria/message facts are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the Pagination behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Pagination from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'pagination-page-strip'
    type: behavior
    path: 'packages/ds-contracts/components/Pagination/Pagination.contract.json'
