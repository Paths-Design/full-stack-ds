    given: 'autoplay with an unfocused rotation button'
    when: 'a user clicks Stop through real pointer focus and click events'
    then: 'rotation remains stopped in every web framework and explicit Start remains available'
  - id: A2
    given: 'actual generated Card or other framework-owned children in each web target'
    when: 'next previous wrapping and interruption occur'
    then: 'rendered content boxes move directionally with size-aware token timing including transparent custom-element hosts and reduced motion skips spatial movement'
  - id: A3
    given: 'a transitioning outgoing slide'
    when: 'it is removed or transferred to a different owner'
    then: 'cancellation restores its consumer styles and semantics and no old animation or controller later hides or mutates it'
  - id: A4
    given: 'movement is in progress'
    when: 'label and child validity or timer settings change'
    then: 'transition and interaction pause reasons remain composed and the incoming slide receives its full reading budget after settlement'
  - id: A5
    given: 'the registered execution targets React Native SwiftUI Jetpack Compose Unity and Godot'
    when: 'Carousel is consumed on each platform'
    then: 'manual and timed navigation progress indicators motion interruption reduced motion and platform-appropriate pause and accessibility behavior have actual implementation and runtime evidence rather than inert exported controls; exclusions require explicit user agreement and do not count as parity'
