invariants:
  - 'Each lane consumes ONLY public exports of its generated package (import DsSwiftUI via SwiftPM path dep; com.fullstackds.components.* via Gradle composite-build substitution; full_stack_ds_gpui via Cargo path dep) — no reaching into generated internals, source trees, or copied package code.'
  - 'No contract, schema, IR, emitter, or generated-tree change under packages/* — this slice falsifies existing package boundaries; every gap it finds is recorded as a finding, never worked around.'
  - 'Every region a lane realizes without its package''s public exports is composed from plain platform UI and marked NOT FSDS in source, with a per-lane partial-realization ledger in the lane README (settings/motion-lab lane convention).'
  - 'Each lane ports the operations-dashboard data seam per the golden template invariants: static fixture copies owned by the lane, an adapter as the only fixture-shape reader, and a typed promise/async-equivalent API with deterministic latency and an explicit failure flag — no wall-clock randomness.'
  - 'App-spec semantics are not weakened for any lane: the ten interaction requirements stay the bar; a lane that cannot realize one records the divergence as a finding.'
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the operations-dashboard spec and the generated ds-swiftui package; when a SwiftPM macOS app consumes it via a local path dependency; then the lane compiles exit 0 via swift build, composes the dashboard regions (summary band, filter rail, queue, detail pane, dialog/sheet/toast overlays) through DsSwiftUI public exports wherever emitted, marks every unrealized region NOT FSDS, carries a lane README claim/non-claim ledger, and passes its seam tests'
  - id: A2
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the operations-dashboard spec and the generated ds-jetpack-compose package; when a desktop JVM Compose app consumes it via Gradle composite-build substitution; then the lane compiles exit 0 via ./gradlew compileKotlin under the same boundary discipline, with NOT FSDS markers, a README ledger, and passing seam tests'
  - id: A3
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given the operations-dashboard spec and the bounded ds-gpui package (7-component allowlist); when a standalone GPUI consumer crate consumes it via a Cargo path dependency pinned to the same renderer rev; then the lane compiles exit 0 via cargo build, realizes every allowlisted surface (Stat, Badge, Checkbox, Text, Divider, Switch/ToggleSwitch) from package exports, marks every other region NOT FSDS hand-authored GPUI, carries a README ledger, and passes its seam tests'
  - id: A4
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given three lanes implementing the same framework-neutral spec; when their consumer semantics are compared against the React lane and each other; then filter/selection/detail/overlay semantics match the spec''s ten interaction requirements per platform idiom, and every divergence or package gap is recorded in spec.md''s findings log and the lane READMEs — with examples/README and the dashboard README updated to record the three lanes and their bounded claims'
observability:
  - 'lane compile commands exit codes recorded in the slice evidence'
rollback:
  - 'delete the three lane folders and revert the three doc files; no generated tree or package state is touched'
non_functional: {}
contracts:
  - name: 'operations-dashboard-spec'
    type: behavior
    path: 'examples/operations-dashboard/spec.md'
