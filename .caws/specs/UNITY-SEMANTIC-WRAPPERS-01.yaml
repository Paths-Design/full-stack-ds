invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; a passive root ignores only DOM metadata bindings (a11y role/aria, data-*, form association) while every such leaf is explicitly adjudicated by the boundary'
acceptance:
  - id: A1
    given: 'the Label and Breadcrumbs contracts'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'each passive root lowers with its consumer content region, the form-association props/bindings are pending P4 and the breadcrumb separator refused, and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains Label and Breadcrumbs controls, the nineteen-name component catalog and their USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'consumer content is composed into each wrapper'
    then: 'the content renders through the documented content host and no association/separator API is emitted'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'Label and Breadcrumbs, their content regions and refused DOM-metadata non-claims are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the wrapper behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Label and Breadcrumbs from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'label-wrapper'
    type: behavior
    path: 'packages/ds-contracts/components/Label/Label.contract.json'
  - name: 'breadcrumbs-wrapper'
    type: behavior
    path: 'packages/ds-contracts/components/Breadcrumbs/Breadcrumbs.contract.json'
