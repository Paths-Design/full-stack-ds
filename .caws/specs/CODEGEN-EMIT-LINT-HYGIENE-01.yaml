id: CODEGEN-EMIT-LINT-HYGIENE-01
title: 'Emitter lint hygiene: conditional imports, dead-guard fix, test-import correctness, lint admission for generated output'
mode: feature
lifecycle_state: active
worktree: emit-lint-hygiene
created_at: '2026-10-18T05:45:45.561Z'
updated_at: '2026-10-18T18:41:46.196Z'
created_by_session: 'session-56f657a0-b59d-4872-93a8-7d5eb2fe452f'
blast_radius:
  modules:
    - 'packages/ds-codegen/src/frameworks (react, react-native, vue, svelte, angular, lit emitters + emitter unit tests)'
    - 'packages/ds-codegen/src/validation (framework validation plans gain lint checks)'
    - 'generated src trees of the six rail-admitted packages (regenerated bytes)'
    - 'eslint.config.js (react rule scoping, ignore narrowing, suppression removal)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/frameworks/**'
    - 'packages/ds-codegen/src/validation/**'
    - 'packages/ds-react/src/**'
    - 'packages/ds-vue/src/**'
    - 'packages/ds-svelte/src/**'
    - 'packages/ds-angular/src/**'
    - 'packages/ds-lit/src/**'
    - 'packages/ds-react-native/src/**'
    - 'eslint.config.js'
    - 'docs/specifications/admission-rail.md'
    - docs/current-implementation-snapshot.md
    - vitest.config.ts
  out: []
invariants:
  - 'No hand-edits to generated component files: every byte change comes from emitter changes plus regeneration; @custom regions are preserved untouched'
  - 'Runtime behavior is unchanged: import-set narrowing and _-prefixed destructure renames are behavior-preserving; the dead-guard removal is semantically identical because the contract default already absorbs undefined'
  - 'Emitters keep the layer ladder: import sets derive from IR/emitted-body facts via shared per-target assembly, never hardcoded per-component lore'
  - 'The lint gate ratchets: generated packages and __tests__ are un-ignored only after emitters produce clean output; the ds-react suppression block is removed, not widened; no eslint-disable comments are added to generated files'
  - '.vue/.svelte SFC linting remains out of the root config''s reach (no parser configured) and is declared as a known gap, not silently ignored'
acceptance:
  - id: A1
    given: 'regenerated output for all six rail-admitted targets'
    when: 'pnpm run lint (root, --max-warnings=0) runs'
    then: 'it reports zero findings over the generated packages including __tests__, with .vue/.svelte SFC linting declared as a known gap requiring per-target toolchains'
  - id: A2
    given: 'the Lit ARIA Booleanish binding for a prop with a contract default (Dialog/Sheet/ShowMore)'
    when: 'the emitter lowers it'
    then: 'the emitted ifDefined contains no statically-dead === undefined guard and no double evaluation, and attribute presence semantics are unchanged (package tests green)'
  - id: A3
    given: 'the Angular/Lit component emitters and Vue/Svelte hook emitters'
    when: 'the emitted body does not reference an import specifier'
    then: 'the specifier is omitted from the emitted import (regenerated bytes carry no unused imports)'
  - id: A4
    given: 'the five framework test emitters'
    when: 'an emitted test body never uses an imported API or uses a binding only in type position'
    then: 'imports match usage (import type for type-only component references; no unused vi/jest/T/container/part imports; Lit tests use the typed Element & { updateComplete?: ... } cast, not as any)'
  - id: A5
    given: 'ds-react component sources'
    when: 'a destructured prop is unreferenced in the body (intercepted from the rest spread)'
    then: 'it is emitted with a _-prefixed rename that preserves interception semantics, only referenced type imports are emitted, and the ds-react eslint suppression block is deleted'
  - id: A6
    given: 'the root eslint config'
    when: 'non-react generated packages are linted'
    then: 'react/react-hooks rules do not apply to them (no false-positive rules-of-hooks on the mirrored use* APIs) and Lit no-this-alias is disabled for packages/ds-lit/** behind a declared policy-boundary comment'
  - id: A7
    given: 'the admission rail'
    when: 'pnpm run governed:rail runs'
    then: 'each of the six framework validation plans executes a lint check over its generated src at --max-warnings=0 and passes, with SFC-lint gaps declared in knownGaps'
non_functional: {}
contracts:
  - name: 'admission-rail'
    type: api
    path: 'docs/specifications/admission-rail.md'
