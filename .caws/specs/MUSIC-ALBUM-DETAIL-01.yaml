id: MUSIC-ALBUM-DETAIL-01
title: 'Music library album detail pages'
mode: feature
lifecycle_state: active
worktree: music-album-detail
created_at: '2026-10-20T00:54:45.382Z'
updated_at: '2026-10-20T01:30:51.946Z'
created_by_session: '01a156cb-3d22-7082-8bfb-a913ec2f142d'
blast_radius:
  modules:
    - 'Retoken music consumer fixture'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'e2e/fixtures/retoken-pages'
    - 'e2e/retoken-pages.spec.ts'
    - scripts/audit-retoken-tokens.mjs
  out: []
invariants:
  - 'Generated DS component source remains unchanged; page appearance uses admitted controls.'
  - 'Album navigation and playback preview maintain independent state.'
acceptance:
  - id: A1
    given: 'music discovery'
    when: 'an album cover or title is activated'
    then: 'a URL-addressable detail page shows matching artwork, maker and tracks, with browser back and Home returning to discovery.'
  - id: A2
    given: 'an album detail page'
    when: 'play, pause, track selection, save and transport controls are used'
    then: 'the visible preview state updates consistently without claiming audio playback.'
  - id: A3
    given: 'desktop and mobile viewports'
    when: 'the album detail page is rendered'
    then: 'the hero and track list remain usable without horizontal document overflow and existing retoken page checks pass.'
  - id: A4
    given: 'The music discovery fixture with original studio content'
    when: 'Search suggestions, profile popover, library collapse and card or button hover are exercised'
    then: >-
      Popular artists and radio are composed from existing DS components; controls
      respond to keyboard and pointer, and motion uses shared timing tokens with
      reduced-motion suppression.
non_functional: {}
contracts:
  - name: 'album-navigation'
    type: behavior
    path: 'e2e/retoken-pages.spec.ts'
