invariants:
  - 'Framework-neutral channel interaction facts remain authoritative and generated files are regenerated rather than hand edited'
  - 'Normal startup fixture visibility is preserved and complete capture overrides are deterministic and order independent'
  - 'Hook protection remains intact and historical verification claims are not promoted by age alone'
acceptance:
  - id: A1
    given: 'contract-derived channel plans'
    when: 'four web test emitters run over fixtures and the corpus'
    then: 'every emitted named callback behavior test stimulates and asserts its callback, unsupported smoke placeholders are omitted, and committed React regeneration matches'
  - id: A2
    given: 'pause-menu fixture defaults and map capture definitions'
    when: 'GPUI Unity and Godot apply repeated captures and visibility toggles'
    then: 'every icon follows the complete capture override and visible counts reflect current state through focused regression tests'
  - id: A3
    given: 'map and map-popover capture definitions'
    when: 'parity probes are derived and a wrong icon switch is supplied'
    then: 'every switch is checked in both states and a wrong Rover state fails the recurring root test'
  - id: A4
    given: 'tracked documentation and operational instructions'
    when: 'existing doc checks run'
    then: 'confirmed portability and metadata defects are repaired and fixture-tested metadata checks reject invalid YAML missing required fields and misplaced durable documents without weakening hook guards'
  - id: A5
    given: 'the integrated committed candidate'
    when: 'governed generation root tests and framework suites run'
    then: 'required checks pass and generated output is reproducible with remaining proof boundaries stated'
  - id: A6
    given: 'shared pause-menu popover and text alignment requirements'
    when: >-
      all three engines use the shared inner layout and copy through native
      regression tests and fresh macOS captures
    then: >-
      popover fields and action rectangles agree across engines, selected-icon
      titles are data derived, and the strengthened checker validates fresh captures
      with text alignment and visual limits explicitly bounded
observability:
  - 'Recurring generator, root parity and documentation checks retain concrete failures for unsupported claims and wrong capture states'
rollback:
  - 'Revert the owned repair commits through normal governed Git history if the behavioral requirements are contradicted'
non_functional: {}
contracts:
  - name: 'callback-test-emission'
    type: contract-test
    path: 'packages/ds-codegen/src/test-plan.ts'
  - name: 'pause-capture-state'
    type: behavior
    path: 'examples/game-pause-menu/fixtures/parity-layout.json'
  - name: 'documentation-metadata'
    type: schema
    path: 'docs/document_governance.md'
