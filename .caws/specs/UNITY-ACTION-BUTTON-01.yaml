acceptance:
  - id: A1
    given: 'the Button contract and a renamed fact-equivalent fixture'
    when: 'the Unity emitter generates, the support-boundary audit runs and the generation gate is evaluated'
    then: 'the action root lowers to a native UI Toolkit Button with generated click, disabled and title API, the loading, aria and form-serialization families resolve to explicit refused rules, and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package after the orion parent slice is merged'
    when: 'generate --target=all is run and the committed package is compared'
    then: 'packages/ds-unity contains the generated Button control, component catalog entry and USS carriers byte-stably, and the tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'generated Button activation, submit, disabled suppression, child composition and UXML round-trip are exercised'
    then: 'exactly one click event fires per activation, disabled activation is suppressed, composed children render, and the results are recorded from the real Editor'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'the admitted action behavior and explicit non-claims (no loading affordance, no assistive-technology semantics, no HTML form serialization) are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the generated Button behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Button from the unity allowlist and regenerate the Unity target'
