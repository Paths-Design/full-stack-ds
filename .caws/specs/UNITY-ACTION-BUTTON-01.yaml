id: UNITY-ACTION-BUTTON-01
title: 'Admit the Button action control to the Unity UI Toolkit target and package'
mode: feature
lifecycle_state: active
created_at: '2026-10-31T07:44:08.463Z'
updated_at: '2026-10-31T08:34:50.453Z'
created_by_session: 'session-5800e41f-e414-466a-a520-b46288f6bf5f'
blast_radius:
  modules:
    - 'Unity UI Toolkit action lowering, generated Button control and runtime activation'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/frameworks/unity'
    - 'packages/ds-codegen/src/frameworks/native-emission-class.ts'
    - 'packages/ds-unity/Runtime/Components'
    - 'packages/ds-unity/Tests'
    - 'packages/ds-unity/Editor'
    - 'packages/ds-unity/Samples~'
    - 'packages/ds-unity/README.md'
    - 'fsds.targets.json'
    - 'docs/architecture/unity-target.md'
    - 'docs/current-implementation-snapshot.md'
    - 'scripts/unity-tests.mjs'
    - packages/ds-unity/Runtime/BooleanControl.cs
    - packages/ds-unity/Runtime/ItemGroup.cs
    - packages/ds-unity/Runtime/AnchoredSurface.cs
    - packages/ds-codegen/src/cli.test.ts
  out: []
  support:
    - packages/ds-unity/Runtime/Resources/FullStackDS
invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; native UI Toolkit Button references stay unambiguous after a FullStackDS.Button type exists'
acceptance:
  - id: A1
    given: 'the Button contract and a renamed fact-equivalent fixture'
    when: 'the Unity emitter generates, the support-boundary audit runs and the generation gate is evaluated'
    then: >-
      the action root lowers to a native UI Toolkit Button with a generated click
      callback and disabled API; the loading and ARIA-state families and the HTML
      form type resolve to explicit refused rules (the title prop remains refused by
      the existing semantic-options rule); the guarded loading decoration and
      loading-text wrapper are omitted; and no allowlisted leaf relies on a
      catch-all rule
  - id: A2
    given: 'a regenerated package on main before the orion parent slice merges'
    when: 'generate --target=all is run and the committed package is compared'
    then: >-
      packages/ds-unity contains the generated Button control, component catalog
      entry and USS carriers byte-stably across two generate:unity runs, and the
      generated tree is git-clean; the orion-branded sheet regeneration is a
      recorded follow-up in GAME-PAUSE-MENU-EXAMPLE-01
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'generated Button native activation and disabled suppression are exercised in a live panel'
    then: >-
      exactly one click event fires per activation, disabled activation is
      suppressed, composed children route into the control's content container, and
      the results are recorded from the real Editor; UXML import of the generated
      Button element is not separately witnessed
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'the admitted action behavior and explicit non-claims (no loading affordance, no assistive-technology semantics, no HTML form serialization) are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the generated Button behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Button from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'button-action'
    type: behavior
    path: 'packages/ds-contracts/components/Button/Button.contract.json'
