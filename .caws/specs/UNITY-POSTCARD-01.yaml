invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; only the declared string leaves of the object props are projected, and the object props themselves are refused rather than serialised'
acceptance:
  - id: A1
    given: 'the Postcard contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'the article scaffold renders header/content/footer inline with the body insertion container, paints author name/handle, timestamp and stats leaves through flattened generated attributes, refuses the object/id/embed props and the datetime/aria wiring, and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the Postcard control, the forty-two-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'the projected attributes are set and the body is composed into the content container'
    then: 'the four projected labels paint their values, the content container holds composed body elements, and no author/stats/embed/datetime API is emitted'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'Postcard, its flattened projected-text attributes, inline sections and the refused object/embed/datetime facts are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the Postcard behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Postcard from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'postcard-projected-text'
    type: behavior
    path: 'packages/ds-contracts/components/Postcard/Postcard.contract.json'
