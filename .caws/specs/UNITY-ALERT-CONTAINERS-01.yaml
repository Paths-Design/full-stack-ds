id: UNITY-ALERT-CONTAINERS-01
title: 'Admit Alert and AlertNotice to the Unity target as static alert containers with omitted guarded chrome'
mode: feature
lifecycle_state: active
worktree: unity-alerts
created_at: '2026-10-31T09:53:22.048Z'
updated_at: '2026-10-31T09:53:23.513Z'
created_by_session: 'session-5800e41f-e414-466a-a520-b46288f6bf5f'
blast_radius:
  modules:
    - 'Unity passive lowering: guarded passive action chrome omission and alert carrier axes'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/frameworks/unity'
    - 'packages/ds-codegen/src/cli.test.ts'
    - 'packages/ds-unity/Runtime/Components'
    - 'packages/ds-unity/Tests'
    - 'packages/ds-unity/README.md'
    - 'fsds.targets.json'
    - 'docs/architecture/unity-target.md'
    - 'docs/current-implementation-snapshot.md'
    - 'scripts/unity-tests.mjs'
  out: []
invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; a guarded native-button or componentRef chrome is omitted by fact (guard prop plus event binding) rather than by component or part name'
acceptance:
  - id: A1
    given: 'the Alert and AlertNotice contracts and renamed fact-equivalent fixtures'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'each passive root emits its carrier-backed intent/status and level axes, the guarded icon and dismiss chrome are omitted with explicit refused prop/anatomy rules, the dismissal style selectors are pending P4, and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains Alert and AlertNotice with their composed body/title parts, the seventeen-name component catalog and their USS carriers byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'consumer content is composed into each alert and its carrier axes are set'
    then: 'the content renders through the content container, the expected modifier classes are present, and no Icon/Dismissible/OnDismiss/DismissLabel API is emitted'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'Alert and AlertNotice, their carrier axes and the refused icon/dismissal non-claims are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the alert container behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Alert and AlertNotice from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'alert-container'
    type: behavior
    path: 'packages/ds-contracts/components/Alert/Alert.contract.json'
  - name: 'alert-notice-container'
    type: behavior
    path: 'packages/ds-contracts/components/AlertNotice/AlertNotice.contract.json'
