    status: pass
    evidence_ref: "At b266093f4 scripts/a11y-realization-audit/selfcheck.mjs passes with pins: a focus trap does not carry Escape; a dismissal does not carry Tab; a running focus trap carries Shift+Tab; a running dismissal whose onDismiss closes something carries Escape. The cross-credit line is gone from classify. Corpus effect in the audit run: Command Tab (five web families) moves from the removed cross-credit to native credit from its input; no other key changed for this rule."
