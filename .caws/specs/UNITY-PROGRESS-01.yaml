id: UNITY-PROGRESS-01
title: 'Admit Progress to the Unity target with a value-driven fill behavior'
mode: feature
lifecycle_state: draft
created_at: '2026-10-31T12:22:34.529Z'
updated_at: '2026-10-31T12:22:34.529Z'
created_by_session: 'session-5800e41f-e414-466a-a520-b46288f6bf5f'
blast_radius:
  modules:
    - 'Unity value/style lowering: numeric value drives a native fill length and a behavior-owned value label'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/frameworks/unity'
    - 'packages/ds-codegen/src/cli.test.ts'
    - 'packages/ds-unity/Runtime'
    - 'packages/ds-unity/Tests'
    - 'packages/ds-unity/Editor'
    - 'packages/ds-unity/README.md'
    - 'fsds.targets.json'
    - 'docs/architecture/unity-target.md'
    - 'docs/current-implementation-snapshot.md'
    - 'scripts/unity-tests.mjs'
  out: []
invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; a CSS-variable style binding lowers only for a declared numeric value prop on a decoration element and is asserted at generation time'
acceptance:
  - id: A1
    given: 'the Progress contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'a Progress behavior attaches the fill and optional value label, the numeric value projects to a clamped native percentage width, the presence-guarded value part is behavior-owned, and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the Progress control and ProgressControl runtime, the twenty-eight-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'the value is set above and below the range and the show-value flag toggles'
    then: 'the fill width clamps to 0-100 percent, the value label presence follows the flag, and no format-value API changes rendered text'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'Progress, its fill behavior, the projected value and the non-realised format/callback a11y facts are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the Progress behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Progress from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'progress-value'
    type: behavior
    path: 'packages/ds-contracts/components/Progress/Progress.contract.json'
