invariants:
  - 'Normalized loop, target part, variant and native style facts determine emitted behavior without component-name dispatch.'
  - 'Web packages and contracts remain unchanged; ignored inline/showAfterMs behavior remains an explicit contract gap.'
  - 'Reduced motion has an explicit native preference input and authored static value; no OS preference integration is claimed.'
acceptance:
  - id: A1
    given: 'Spinner and an identity-substituted contract with normalized loop and style facts'
    when: 'Unity and Godot generate'
    then: 'loop target, period, keyframes, size and thickness variants reach native source and unsupported facts fail closed'
  - id: A2
    given: 'generated Unity Spinner in a real panel'
    when: 'sizes, thicknesses, colors, time and reduced-motion preference change'
    then: 'geometry and rendered pixels follow carried facts and reduced motion holds the authored static value'
  - id: A3
    given: 'generated Godot Spinner'
    when: 'runtime scenarios and a fresh macOS export run'
    then: 'source-bound geometry and rendered pixels follow the loop and style facts'
  - id: A4
    given: 'the committed candidate'
    when: 'focused codegen and engine lanes and applicable checks run'
    then: 'evidence and documentation distinguish realized motion/style from delay, inline, accessibility and OS-preference gaps'
observability:
  - 'Engine probes retain source revision, package digest, geometry, loop angle and pixel witnesses.'
rollback:
  - 'Revert the slice merge and regenerate the original target allowlists.'
