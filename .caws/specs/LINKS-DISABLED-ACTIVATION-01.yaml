  - id: A2
    given: 'React Native Links and portable public callback types'
    when: 'activation cancellation and disabled state transition run'
    then: 'enabled activation opens the URL once disabled and cancelled activation never open it and disabled accessibility state and resolved text styling restore on reenabling with explicit native-runtime proof limits'
  - id: A3
    given: 'named pointer suppression and existing category suppression'
    when: 'CSS design selectors Figma metadata and audits are produced'
    then: 'pointer hover and visited are suppressed while focus remains visible named referents are checked and unrelated or partially guarded rules cannot hide actual leaks'
