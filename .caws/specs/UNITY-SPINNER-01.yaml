invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; the runtime executes only the declared loop facts with an explicit reduced-motion preference input, never OS preference integration, delay/inline behaviour or native pixel-arc rendering'
acceptance:
  - id: A1
    given: 'the Spinner contract with normalized loop and style facts'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: >-
      the generated control carries the declared full-turn rotation control with its
      declared period/easing and the explicit reduced-motion preference input, the
      variant/a11y/delay/inline families are adjudicated, and no allowlisted
      catch-all reliance remains
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the Spinner control and MotionLoopControl runtime, the fifty-four-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'rotation time and the explicit reduced-motion input are exercised'
    then: 'the visual element rotates on the declared loop period, holds the authored static value when reduced motion is requested, and emits no delay/inline/a11y/native-pixel API'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: >-
      Spinner, its motion-loop runtime, the explicit reduced-motion input and the
      unclaimed variant-carrier/OS-preference/delay/inline/pixel facts are stated
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the Spinner behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Spinner from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'spinner-loop'
