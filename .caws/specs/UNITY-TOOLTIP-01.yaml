invariants:
  - 'Existing admitted Unity components (Popover click surface included) retain their generated bytes and runtime behavior; the hover mode is selected by contract surface facts, not by component identity'
acceptance:
  - id: A1
    given: 'the Tooltip contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'the passive composite lowers with its trigger/content parts, the generated constructor attaches AnchoredSurface in hover/focus open mode with pointer-leave dismissal, the tooltip surface/state/a11y leaves are adjudicated, and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains Tooltip with TooltipTrigger/TooltipContent parts, the twenty-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'the trigger receives pointer-enter, pointer-leave, focus and escape events'
    then: 'the tooltip opens and closes through those events, a disabled trigger does not open it, and the content is non-interactive'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'Tooltip, its hover/focus open mode, non-interactive content and dismissed-surface boundaries are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the tooltip hover behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Tooltip from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'tooltip-surface'
    type: behavior
    path: 'packages/ds-contracts/components/Tooltip/Tooltip.contract.json'
