acceptance:
  - id: A1
    given: 'the Dialog contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'a Modal surface behavior attaches the content, backdrop and close trigger, the open channel and dismissal knobs are emitted, the guarded overlay/trigger are behavior-owned, and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the Dialog control and ModalSurface runtime, the thirty-one-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'the dialog opens, Escape/backdrop/close-button are invoked and controlled state is exercised'
    then: 'presence, focus trapping/return and dismissal policy follow the generated knobs and the a11y/DOM-id props stay absent'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'Dialog, its modal surface behavior, dismissal knobs and the non-realised ARIA/DOM-id/non-modal facts are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the Dialog behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Dialog from the unity allowlist and regenerate the Unity target'
