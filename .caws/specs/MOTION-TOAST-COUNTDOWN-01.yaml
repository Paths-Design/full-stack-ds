acceptance:
  - id: A1
    given: 'a contract with a countdown binding'
    when: 'IR is built and web targets emitted'
    then: 'the owned target binds to surface auto-dismiss and invalid or competing bindings are rejected without component-name branching'
  - id: A2
    given: 'a timed open surface'
    when: 'hover and focus overlap, visibility changes, duration resets or the surface closes'
    then: 'the one active-time budget preserves remaining time, dismisses once and disposes listeners and frames'
  - id: A3
    given: 'Toast in each web framework'
    when: 'its budget runs, pauses, resumes or is disabled and reduced motion changes'
    then: 'its bottom progress bar reflects that budget and disabled timers show no bar'
