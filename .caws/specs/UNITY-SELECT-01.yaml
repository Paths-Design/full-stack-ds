invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; single selection only is claimed, and authored aria/data styling plus the search/empty states are withheld'
acceptance:
  - id: A1
    given: 'the Select contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'the generated control exposes the value/default/open/default-open/placeholder/options API and both channel callbacks, projects the size carriers, omits the search/empty/iterated markup and adjudicates the two-channel/composite/guard/binding families with no allowlisted catch-all reliance'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the Select control and SelectControl runtime, the forty-six-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'options/value/placeholder/open/disabled/size are set and the trigger and an option are activated'
    then: 'the runtime builds the options, paints the trigger label, toggles the listbox open state, commits/requests both channels, disables controls and emits no aria/data/search/empty API'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'Select, its two-channel listbox runtime, option construction, label projection and the unclaimed multi-select/search/aria facts are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the Select behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Select from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'select-two-channel'
