invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; a content-property binding lowers only for a declared string prop on a text leaf and is asserted at generation time'
acceptance:
  - id: A1
    given: 'the Details contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'a Disclosure behavior attaches the summary trigger and content presence, the summary string projects to a generated text property, the disclosure channel API is emitted, and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the Details control and DisclosureControl runtime, the twenty-seven-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'the summary is clicked and the controlled/value-without-notify paths run'
    then: 'the content presence toggles, ChangeEvent fires on the root, and disabled/controlled semantics hold'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'Details, its disclosure behavior, the projected summary text and the non-realised a11y/icon facts are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the Details behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Details from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'details-disclosure'
    type: behavior
    path: 'packages/ds-contracts/components/Details/Details.contract.json'
