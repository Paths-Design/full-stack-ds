blast_radius:
  modules:
    - 'Unity passive lowering: DOM metadata attrs/bindings tolerance and content-transform omission'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/frameworks/unity'
    - 'packages/ds-codegen/src/cli.test.ts'
    - 'packages/ds-unity/Runtime/Components'
    - 'packages/ds-unity/Tests'
    - 'packages/ds-unity/Editor'
    - 'packages/ds-unity/README.md'
    - 'fsds.targets.json'
    - 'docs/architecture/unity-target.md'
    - 'docs/current-implementation-snapshot.md'
    - 'scripts/unity-tests.mjs'
  out: []
  support:
    - packages/ds-unity/Runtime/Resources/FullStackDS/Controls.unsupported.json
    - packages/ds-unity/Runtime/Resources/FullStackDS/Controls.uss
invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; a content transform is omitted by fact, never approximated'
acceptance:
  - id: A1
    given: 'the CodeBlock contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'the passive root lowers with its code region and consumer insertion point, the data/attr metadata is tolerated and classified, the highlight transform subtree and gutter/line/token parts are omitted with explicit rules, and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the CodeBlock control, the twenty-six-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'consumer line labels are composed into the code region'
    then: 'the lines render with their classes and no code/language/highlight/tokens/line-numbers API is emitted'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'CodeBlock, its code region and the omitted syntax-highlighting/gutter/line-number non-claims are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the CodeBlock behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove CodeBlock from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'codeblock-container'
    type: behavior
    path: 'packages/ds-contracts/components/CodeBlock/CodeBlock.contract.json'
