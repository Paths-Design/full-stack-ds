id: UNITY-OTP-01
title: 'Admit OTP to the Unity target as a runtime-built single-character field group'
mode: feature
lifecycle_state: active
created_at: '2026-10-31T15:44:25.182Z'
updated_at: '2026-10-31T15:57:51.803Z'
created_by_session: 'session-5800e41f-e414-466a-a520-b46288f6bf5f'
blast_radius:
  modules:
    - 'Unity OTP lowering: string value channel over a runtime-built group of one-character text fields'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/frameworks/unity'
    - 'packages/ds-codegen/src/cli.test.ts'
    - 'packages/ds-unity/Runtime'
    - 'packages/ds-unity/Tests'
    - 'packages/ds-unity/Editor'
    - 'packages/ds-unity/README.md'
    - 'fsds.targets.json'
    - 'docs/architecture/unity-target.md'
    - 'docs/current-implementation-snapshot.md'
    - 'scripts/unity-tests.mjs'
  out: []
  support:
    - packages/ds-unity/Runtime/Resources/FullStackDS/Controls.unsupported.json
    - packages/ds-unity/Runtime/Resources/FullStackDS/Controls.uss
invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; field-count, filtering and completion semantics are realised by the runtime, while a11y labels and describedby wiring are withheld'
acceptance:
  - id: A1
    given: 'the OTP contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'the generated control exposes the value/default-value/on-change/submit, length, disabled/read-only and mode API over the runtime-built field group, with adjudicated iteration/index/a11y rules and no allowlisted catch-all reliance'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the OTP control and OtpControl runtime, the forty-four-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'length/value/mode/disabled/read-only are set and fields are edited'
    then: 'the runtime builds one field per position, distributes and joins values, filters numeric mode, commits or requests the string channel, disables/read-only the fields and emits no aria/describedby API'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'OTP, its runtime-built field group, value/mode/length semantics and the unclaimed a11y facts are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the OTP behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove OTP from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'otp-field-group'
    type: behavior
    path: 'packages/ds-contracts/components/OTP/OTP.contract.json'
