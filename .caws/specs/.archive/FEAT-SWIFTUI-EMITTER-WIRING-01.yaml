invariants:
  - 'The swiftui emitter never branches on component identity — only on IR facts (collapse intents, normalized channels, defined types, token facts), per the binding-rule doctrine in docs/codegen-authority.md.'
  - 'swiftui is explicit-only in this slice: absent from fsds.targets.json, from FrameworkId/NativeLaneId, and carrying no railFrameworkId, so --target=all and governed:rail outputs must be byte-identical to pre-slice. Corpus-wide/default-rail admission is a later spec.'
  - 'The SwiftPM library target contains only generator-owned .swift files under Sources/DsSwiftUI/Components plus hand-maintained Package.swift/README at the package root; no test files and no non-Swift files inside the target directory (SwiftPM rejects unhandled files).'
  - 'The workspaceExists generalization accepts Package.swift as an alternative package marker without weakening existing gating: the six pnpm targets remain gated on package.json exactly as before.'
  - 'Unimplemented emitter surfaces (multi-part anatomy, anchored surfaces) fail loudly with explicit errors when invoked — never silently degrade to wrong output.'
acceptance:
  - id: A1
    given: 'the swiftui emitter and the new packages/ds-swiftui SwiftPM package on disk'
    when: 'pnpm run generate -- --target=swiftui Switch runs'
    then: 'it emits Sources/DsSwiftUI/Components/Switch/Switch.swift and exits 0'
  - id: A2
    given: 'the generated package tree'
    when: 'swift build runs with package path packages/ds-swiftui'
    then: 'the build exits 0 (compile-positive over the generated Swift source)'
  - id: A3
    given: 'a multi-part contract with no collapse intent (Button)'
    when: 'pnpm run generate -- --target=swiftui Button runs'
    then: 'the command fails with the explicit not-implemented anatomy error (fail-loud negative control)'
  - id: A4
    given: 'fsds.targets.json unchanged'
    when: 'pnpm run governed:rail runs'
    then: 'swiftui is not generated and all rail outputs are byte-identical to pre-slice (explicit-only registration, no railFrameworkId)'
  - id: A5
    given: 'the widened BuiltinTargetId and new builtin manifest'
    when: 'pnpm run typecheck and pnpm test run at the root'
    then: 'both pass including the manifest validation test iterating all builtin packs'
