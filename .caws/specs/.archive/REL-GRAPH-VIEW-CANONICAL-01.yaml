evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "THE DECISION, implemented as recorded: a canonical graph-view declaration whose result is a GRAPH, alongside the relation-valued derivations, and NOT a nodeRelation operand on the existing graph derivation. THE AUTHORING BOUNDARY IS REAL. graph-view-model.ts is the zod definition; analytical-fixtures/graph-view.schema.json is RENDERED FROM IT and drift-gated (analytical:check-schemas: OK, committed schemas equal the model emission); analytical-fixtures/graph-views.json is the authored source carrying the structure, the two populations and the two views; and loadGraphViews parses that file, validating it against the same definition the schema is rendered from, refusing a file that does not validate rather than defaulting. THE FALSE PASS IS PREVENTED: the test does not hand-build a declaration. It calls loadGraphViews() once and derives both bindings from the parsed file, so the decisive pair enters through the project own path and the OUTPUTS are what is observed. MEASURED: the two already-earned graphs are reproduced from the PARSED declarations over ONE unchanged source - GV_ALL_NODES selects [n1,n2,n3] with isolate n3 and GV_CONNECTED_SET selects [n1,n2], with edgeRelationIdentical true - and both preserve through both produced representations. The authored file had to be canonicalised during the work (relation names must match the structure schema lower_snake pattern), which is itself evidence the file passed through the real schema rather than bypassing it. NON-CLAIM: the graph-valued result is authored and consumed through the canonical path, but graph PROJECTION ENUMERATION, rendered behaviour and the analytical thesis remain distinct future questions. Verification: pnpm exec vitest run packages/ds-codegen/src/analytical (22 files / 948 tests), pnpm test (303 files / 4169 tests), typecheck, lint, docs:check-claims, governed:rail and test:frameworks green on merge 9111505f."
    recorded_at: "2026-09-18T08:22:18.370Z"
  - criterion_id: A2
    status: pass
    evidence_ref: "Both representations are produced from the graph-valued result obtained through the parsed declaration, and the producers stayed downstream: they take the denoted graph and never select a relation name or decide endpoint membership. Neither infers the universe from edges - the node-from-edges counterexample is still EXHIBITED in the module and still collapses the pair (distinguishesThePair false) - and neither reconstructs a binding from conventional field names, since the binding arrives parsed. The qualification controls still hold over the parsed view: a field that RESOLVES but is not the declared key is refused (all_nodes.label), an endpoint outside the SELECTED universe is refused rather than dropped (links.dst names n9), a missing population is CARRIED under invariant:population-declared, and the node-universe-is-the-edge-relation case is refused. The identity mutation still moves the PRODUCED output (n3 -> n3-impostor) with countAndEdgesUnchanged true, and recovery comparison still fails. The incidence decoder collision control also still passes with both ambiguous edges surviving."
    recorded_at: "2026-09-18T08:22:18.836Z"
  - criterion_id: A3
    status: pass
    evidence_ref: "THE NEW FAMILY IS ACCOUNTED FOR WITHOUT MOVING THE OLD ONES, and this was measured rather than asserted. graphViewBasis is a SEPARATE authority identity whose entry point is graph-projection.ts, owning graph-view-model.ts and graph-projection.ts, with analytical-fixtures/graph-view.schema.json as its artifact. Extending coordinateBasis was rejected because relation-model.ts is inside its closure, so adding a declaration family there would have moved coordinateBasisDigest and every verdict stamped with it, for a family that is not a census coordinate. MEASURED CONSEQUENCE: with the new identity in place, analytical:check-baseline reports conserved, freeze:check reports 160 coordinate erasures and 126 verdicts matching, footprints:check reports 212 specimens with 0 illegal quotient images, and closures:check reports 22 closures consistent - ALL with NO re-record, because no existing digest moved. authority.test.ts enforces the partition (every production module owned, a rule source, or listed as unidentified; every exclusion reachable; every owned module reachable from its own entry point) and passes. Adding a canonical declaration is explicitly NOT retrospective ratification of stage 2: the subtraction gate keeps its existing unresolved count and nothing here adjudicates a census coordinate. NON-CLAIM: preserving the existing unresolved count is not proof that the extension accounting is complete; what is established is that this family stands under its own identity with its schema drift-gated."
    recorded_at: "2026-09-18T08:22:19.284Z"