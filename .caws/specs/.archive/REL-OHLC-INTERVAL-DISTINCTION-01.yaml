invariants:
  - 'THE EVALUATOR IS NOT WIDENED. The probe is exercised by binding an operation this evaluator CAN perform over one of the relation''s own co-registered ratio measures. Changing what the bounded experiment executes would be a scope change.'
  - 'THE TEMPORAL AXIS KEEPS ITS SCALE. A period declared as an interval is not an instant and not a cyclic quantity, so the cyclic-only channel must stay refused for it. Reducing the axis to something the channel table happens to accept is the convenient-scalar failure the doctrine names.'
  - 'CO-REGISTRATION IS A DEGREE OF FREEDOM. Each of the ratio measures is bound in turn and each is lawful, so the shape is not collapsed to one representative measure.'
  - 'A CONTROL DISTINGUISHES INTERVAL-NESS FROM UNUSABILITY. The cyclic channel must become available when the temporal column IS cyclic, or the refusal would be evidence about the channel rather than about the scale.'
