invariants:
  - 'Consumption means a var() READ of the slot. A read inside another slot declaration in tokens.css is a real consumption: overriding the slot changes what that other slot resolves to, so the knob works. The premise the rail measures is "settable with effect", and this is an effect path.'
  - 'A slot still cannot consume itself. Its own declaration line (`--slot: ...`) is not a read, and must never count — that is the original reason tokens.css was excluded, and it survives intact.'
  - 'The widening must be justified by a case unrelated to any repair it unblocks. Chip chip.dismiss.size is read by four OTHER slots in tokens.css and is currently misreported inert; that false positive stands on its own.'
  - 'Falsification must run in both directions: a cross-slot read flips a slot to consumed, and a self-declaration-only slot stays dead.'
  - 'Remediation-free: no contract, codegen source, emitter or generated artifact changes.'
acceptance:
  - id: A1
    given: 'A slot read by a var() inside a DIFFERENT slot declaration in tokens.css (Chip chip.dismiss.size, read by four box-model slots).'
    when: 'The audit runs.'
    then: 'The slot is classified consumed and leaves the ledger.'
  - id: A2
    given: 'A slot that appears in tokens.css only as its own declaration.'
    when: 'The audit runs.'
    then: 'It remains dead — a slot still cannot consume itself.'
  - id: A3
    given: 'The corrected definition.'
    when: 'The audit runs over the corpus.'
    then: 'Exactly the corrected false positives leave the ledger; every other entry keeps its status and disposition.'
  - id: A4
    given: 'The completed slice.'
    when: 'The full gate battery runs.'
    then: 'All three rails, generate:check, governed:rail and the test suites are green and no generated bytes changed.'
