invariants:
  - >-
    A contract part styled by part key gets a rendered element carrying that
    part class. The anchored-surface path marked trigger/content with a data-*
    attribute only, so part-keyed styles compiled to a selector matching zero
    elements; the disclosure path (Accordion) already emits part classes, so this
    converges surfaces onto existing behaviour rather than inventing a mechanism.
  - >-
    The data-* markers are NOT removed. Generated surface tests assert them and
    Popover's styles reference them; they are the behavioural marker, the class
    is the styling hook, and both keep their jobs.
  - >-
    A consumer-supplied className must COMPOSE with the part class, never replace
    it. The part class is emitted first and the consumer value appended.
  - >-
    Surface chrome belongs to the content part, never the host. Popover's root is
    "a host that coordinates trigger and content" — a closed Popover must paint
    nothing.
  - >-
    Styles are authored by PART KEY, not by hand-written attribute selectors.
    Popover's raw "[data-popover-content]" keys were a workaround for this defect
    and are migrated, so the vocabulary is the only authoring surface.
acceptance:
  - id: A1
    given: 'Tooltip, whose content part declares 11 surface properties by part key'
    when: 'a tooltip is opened in Chromium'
    then: >-
      the content element matches .tooltip__content and computes the declared
      background-color, border, padding and max-width — measured, not inferred
      from the emitted CSS.
  - id: A2
    given: 'A closed Popover'
    when: 'its trigger is rendered'
    then: >-
      the host paints nothing: no background-color, border-color, box-shadow,
      padding or border-radius resolves on .popover, while the open content
      surface still carries all of them.
  - id: A3
    given: 'All five web targets'
    when: 'Tooltip and Popover are regenerated'
    then: >-
      each emits the part class on both trigger and content by its own idiom
      (className, :class, class:, HostBinding, classList) — verified per framework
      from its own generated source, not assumed from React.
  - id: A4
    given: 'A consumer passing className to Trigger or Content'
    when: 'the element renders'
    then: 'both the part class and the consumer class are present.'
  - id: A5
    given: 'The orphaned-part-class sweep over generated CSS vs generated source'
    when: 're-run after this slice'
    then: >-
      .tooltip__content and .tooltip__trigger are gone from the orphan set, and
      the remaining entries are exactly the 14 never-rendered-part overclaims,
      which this slice does not touch.
  - id: A6
    given: 'A mutation removing the part class from any one framework emitter'
    when: 'the surface part-class test runs'
    then: 'it fails for that framework — proving the pin can fail for the right reason.'
non_functional: {}
