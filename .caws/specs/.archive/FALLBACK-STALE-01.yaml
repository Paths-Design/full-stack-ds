invariants:
  - 'A contract fallback literal equals the light-mode terminal value of its resolvesTo chain in the resolved token graph.'
  - 'Truth is derived from the graph, never adjudicated by literal frequency: a majority literal that disagrees with the graph is wrong, not authoritative.'
  - 'Component-layer resolvesTo targets (e.g. accordion.border.color) are resolved by following the owning contract token slot into the semantic/core graph before comparison.'
  - 'The gate degrades to a single instructional issue when the token graph is unbuilt, never to a silent pass.'
  - 'Fallback correctness is a light-mode-only claim; a single static literal cannot encode both theme modes.'
acceptance:
  - id: A1
    given: 'A contract fallback literal that disagrees with the light-mode terminal value of its resolvesTo chain.'
    when: '`pnpm run generate:check` runs.'
    then: '[FALLBACK_STALE] reports the site, the authored literal, and the graph-derived correct literal.'
  - id: A2
    given: 'A resolvesTo target in the component layer (not present in the global graph) that chains through its owning contract token slot.'
    when: 'The gate resolves truth for that reading.'
    then: 'The chain is followed to the terminal graph value rather than reported as unresolvable.'
  - id: A3
    given: 'The corpus after the derived repair.'
    when: '`pnpm run generate:check`, `pnpm run governed:rail`, and the test suites run.'
    then: 'Zero [FALLBACK_STALE] findings remain outside a documented unresolvable residue, the rail passes, and regenerated bytes are committed.'
  - id: A4
    given: 'The [FALLBACK_DIVERGENT] advisory, which detects disagreement but not incorrectness.'
    when: '[FALLBACK_STALE] lands.'
    then: 'The divergence advisory is removed as subsumed, not retained alongside.'
