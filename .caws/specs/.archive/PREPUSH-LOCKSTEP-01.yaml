    evidence_ref: "Harness S1: install fires on fresh clone (no node_modules) despite no lockfile change in diff. Scenario S3: stubbed Node 20 -> '[pre-push] FATAL: Node >= 22 required (CI pins Node 22); found 20', exit 1 before any gate work. Every hook step line carries a [+Ns] elapsed prefix (see S1/S4 outputs)."
