id: PREPUSH-LOCKSTEP-01
title: 'Pre-push lockstep: wire realization audits, close drift-diff hole, mirror CI audit placement'
risk_tier: 2
mode: chore
lifecycle_state: archived
resolution: completed
closure_notes: 'Pre-push hook back in lockstep with ci.yml: behavior/a11y realization audits wired with exact input surfaces, drift diff compares pushed tip commit, audit group placed after rail mirroring CI, plus install/Node guards and step timing'
created_at: '2026-08-15T18:24:03.242Z'
updated_at: '2026-11-05T23:05:29.705Z'
blast_radius:
  modules:
    - '.githooks/pre-push: wires audit:behavior-realization + audit:a11y-realization, moves the realization-audit group after rail + drift diff, diffs against the pushed tip commit, adds install/Node guards and per-step elapsed timing'
    - 'scripts/prepush-scope.mjs: adds RUN_BEHAVIOR_AUDIT and RUN_A11Y_AUDIT flags with exact input-surface patterns'
    - 'scripts/prepush-scope.test.mjs: pins the new flags on both sides of each input diff and extends the --full pin'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - '.githooks/'
    - 'scripts/prepush-scope.mjs'
    - 'scripts/prepush-scope.test.mjs'
  out: []
invariants:
  - 'The scoped gate never skips a step-group whose inputs are present in the push diff — now including the behavior and a11y realization audits on their exact input surfaces (contracts, codegen, the classified generated trees, and the audits own scripts and ledgers).'
  - 'When the push range is indeterminate (no origin/main base, or PREPUSH_FULL=1 is set) the hook runs the FULL sequence — fail-open to completeness, never fail-open to skipping.'
  - 'CI (.github/workflows/ci.yml) is unchanged and remains the authoritative superset; the hook mirrors the gate job relative placement by running classification audits after the rail + drift diff.'
  - 'The generated-tree drift diff compares the pushed tip commit against the working tree — never index-vs-worktree — so staged-but-uncommitted regenerated bytes cannot pass the hook.'
acceptance:
  - id: A1
    given: 'ci.yml runs audit:behavior-realization and audit:a11y-realization in the gate job while .githooks/pre-push does not'
    when: 'scripts/prepush-scope.mjs classifies changes to any input of those audits and the hook runs'
    then: 'RUN_BEHAVIOR_AUDIT and RUN_A11Y_AUDIT fire on each audit exact input surface (pinned by new tests in scripts/prepush-scope.test.mjs, including negative pins: tokens-only fires neither flag, react-native fires only the a11y flag) and the hook executes both audit scripts'
  - id: A2
    given: 'regenerated generated output is staged but not committed'
    when: 'the hook post-rail drift diff runs'
    then: 'the push fails because the diff compares the pushed tip commit against the working tree, closing the hole where index-vs-worktree let staged-uncommitted bytes pass the hook but fail CI'
  - id: A3
    given: 'a scoped or FULL push with RUN_RAIL=true'
    when: 'the hook runs'
    then: 'the realization-audit group (iconography, behavior, a11y, styling ledgers, token resolvability) runs only after governed:rail and the drift diff, mirroring ci.yml placement, and when RUN_RAIL=false the flagged audits still run against the existing tree'
  - id: A4
    given: 'a fresh clone without node_modules, or a Node older than 22'
    when: 'the hook runs'
    then: 'the hook installs dependencies regardless of diff shape, fails fast with a clear Node-version message below the floor, and every step line carries an elapsed-seconds prefix'
non_functional: {}
contracts:
  - name: 'prepush-scope'
    type: behavior
    path: 'scripts/prepush-scope.test.mjs'
evidence:
