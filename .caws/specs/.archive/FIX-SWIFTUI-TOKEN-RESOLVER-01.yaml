    given: 'a fallback-only token definition (the majority of generated slots)'
    when: 'resolveFsdsComponentTokens and resolveFsdsLayeredTokens resolve it'
    then: 'the slot resolves to the fallback value instead of nil — the nested-optional ?? chain is staged in a local before the [String: FsdsTokenValue?] subscript assignment'
  - id: A2
    given: 'a new SwiftPM test target with resolver regression tests'
    when: 'swift test --package-path packages/ds-swiftui runs'
    then: 'fallback-only, literal, theme-override, and layered-override cases all pass (they fail against the unfixed resolver)'
  - id: A3
