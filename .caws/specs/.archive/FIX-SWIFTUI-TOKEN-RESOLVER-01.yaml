    when: 'components regenerate'
    then: 'Button and Stack apply labels/identifiers through conditional runtime helpers (fsdsAccessibilityLabel/fsdsAccessibilityIdentifier) that attach nothing when nil; prior outputs byte-updated via regeneration and all 15 compile'
