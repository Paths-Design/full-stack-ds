invariants:
  - 'Never assign a ?? chain directly into an optional-Value dictionary subscript — the chain type-infers at double-optional depth and nil literals wrap to .some(nil), short-circuiting later arms. Staging into a local is the enforced pattern; the regression test pins it.'
  - 'The generated-component API and FsdsTheme public surface otherwise unchanged; resolved outputs stay [String: FsdsTokenValue?] this slice (the [String: FsdsTokenValue] reshape is a follow-up design decision).'
  - 'A11y fixes must preserve intrinsic labels: modifiers attach only when a value exists, never with an empty string.'
acceptance:
