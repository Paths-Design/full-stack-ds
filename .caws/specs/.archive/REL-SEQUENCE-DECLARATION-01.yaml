    evidence_ref: "Made the declaration carry whether a name list's order is semantic, and made the walk refuse to guess. THE FACT: every array-of-Name in relation-model.ts (8 sites: nonAdditiveAlong, toGrain, levels, keep, grain, peers' inner list, along, grainWitness' value) now carries x-fsds-sequence set|ordered, a custom keyword z.toJSONSchema propagates and every validator here ignores (all Ajv instances are strict:false). sequenceFacts is collected in the SAME walk that emits the facets, so the fact a coordinate was emitted under and the fact final-quotient reads when it recognizes that coordinate's removal cannot drift. THE RULE: listFacets throws on a name list that states neither value, so a new list arrives failing rather than silently gaining an order facet nothing can adjudicate -- C1g pins that with a non-vacuity count (8 declarations, 2 ordered, 6 set). THE CONSEQUENCE: the five set-valued order facets (keep, along, nonAdditiveAlong, peers[], grainWitness) left the kernel with representation-artifact verdicts; the unadjudicated count fell 77 -> 72 and the closure dependency set 23 -> 21 (gate: 72 of 118, 22 provisional, 21 unsettled). levels and toGrain keep their facet and are semantically real: permuting levels moves the judgment, and toGrain order carries a holding witness from an authored pair because no committed fixture has a two-element target grain. THE THIRD FORM: final-quotient's FactorizationForm gains declared-set-order -- its own comment requires a new census rule to be added there on purpose -- with recognition reading the SAME declaration the walk read (so nest.levels#order, which IS ordered, is refused as that form), its own check branch (non-vacuity is that the list OCCURS; the second count is how often it occurs with more than one member, the only shape a permutation could have moved), and carriers keep#arity + keep#incidence. All 34 artifacts held, up from 29. THE SUPERSESSION: the freeze records what this record supersedes -- census=5, verdict=5 -- each with an authored effect in SUPERSESSION_EFFECT, and the other two authorities were harmonised first because a supersession absorbs only the erasure authority's movement. NON-CLAIMS: the corpus could not decide along, nonAdditiveAlong or grainWitness (no committed instance long enough to permute) -- their verdicts rest on the LAWS, which never read a position in those collections (membership and set-equality only), and the corpus-bounded measurement is reported as untested rather than as inert; the verdicts judge the ENCODING, not the collections -- every name is still carried, and each removed leaf keeps its #arity and #incidence coordinates; relation.grain is a name list declared as a union, so the walk emits the leaf and none of the three facets, and its order is inert over 32 instances -- an asymmetry the declaration does not yet reach; and the removal of assertion.aggregate.along#order and field.additivity.semi-additive.nonAdditiveAlong#order cost the C3d masking demonstration its keep-order row and the non-confluence pin its keep example, both of which were REBUILT on surviving coordinates (assertion.aggregate.relation#incidence and toGrain#arity+order) rather than dropped. Verified by the analytical suite (19 files, 825 tests), the full root suite (301 files, 4046 tests), all eight analytical gates, docs:check-claims and docs:check-links."
