invariants:
  - 'The named-slot class admits only: dom-bearing passive container root, no surface, no collapse intent, and EVERY dom leaf is a named slot — semantic wrappers (label/help elements) are allowed above slots, component-instance leaves (TextField''s Input) are not.'
  - 'Channel/association props the web composer owns (value/defaultValue/onChange/validate/required/disabled/readOnly/name/id/validating) are OMITTED from the Swift API and documented — never accepted-and-ignored; the consumer''s control owns state on this target.'
  - 'All styling derives from ir.tokenScopes through FsdsTheme via the shared suffix vocabulary; Button/Card emitted bytes unchanged by the vocabulary extension.'
acceptance:
  - id: A1
    given: 'Field (div root, dom tree whose leaves are all named slots: label/control/help/error/validatingIndicator, no surface)'
    when: 'generate -- --target=swiftui Field runs'
    then: 'the named-slot class emits a compiling Field with one ViewBuilder region per slot and swift build exits 0 with prior outputs byte-stable'
  - id: A2
    given: 'the all-leaves-are-slots gate'
    when: 'TextField (Input instance leaf), Dialog (surface block), and Input (no slots, input-shaped control) are generated'
    then: 'all three still throw the explicit no-emission-class error (gate proven narrow)'
  - id: A3
    given: 'ir.tokenScopes for Field'
    when: 'rendered'
    then: 'chrome is presence-driven through FsdsTheme with the vocabulary extended for Field''s short slot forms (color.bg/color.fg/color.border/bare radius) and the status axis layers variant scopes (invalid re-points the border)'
  - id: A4
    given: 'the settings swift lane Profile section'
    when: 'rebuilt'
    then: 'the two form rows compose Field label/control regions around SwiftUI TextField and the lane compiles; the value-channel/control-association omission is documented as a non-claim (control owns state on this target)'
  - id: A5
    given: 'the full worktree gate'
    when: 'governed:rail, pnpm test, test:frameworks run'
    then: 'all pass with drift confined to packages/ds-swiftui and the swiftui emitter'
