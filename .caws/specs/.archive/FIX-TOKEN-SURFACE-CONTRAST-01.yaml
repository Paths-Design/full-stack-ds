evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "pnpm run tokens:check-contrast now reports '484 pair(s) evaluated across 11 instantiation(s) (base + 10 brand(s)) x 2 theme(s)'; previously it evaluated 44 pairs against the base tree only. New module build/w3c/brand-overlay.ts reconstructs the per-brand/per-theme tree. Falsified live: enabling the brand dimension turned the gate RED on two pre-existing defects (corporate 3.99:1 light and dark, monochrome 1.42:1 light) and GREEN after fixing them. 15 unit tests; verified non-vacuous by mutation (stubbing overlayBrand to return the base tree unchanged is killed by 4 of them)."
    recorded_at: "2026-09-03T00:20:36.716Z"
    commit_sha: "73b1f3ac"
  - criterion_id: A2
    status: pass
    evidence_ref: "corporate foreground.onColor re-bound neutral.50 -> color.mode.white: 3.99:1 -> 4.84:1 against background.accent (blue.500), in BOTH themes. monochrome re-bound color.mode.dark -> color.mode.light in light: 1.42:1 -> 13.01:1 against background.accent (neutral.800). Both contradicted their own $description before the fix. Confirmed three independent ways: an audit computing sRGB luminance from palette source, in-browser measurement against the document root, and the brand-aware gate - all three agreed on 3.99 and 1.42. tokens:check-contrast now green across all 11 instantiations x 2 themes."
    recorded_at: "2026-09-03T00:20:44.925Z"
    commit_sha: "73b1f3ac"
  - criterion_id: A3
    status: pass
    evidence_ref: "PARTIAL AGAINST THE LITERAL CLAUSE - read the exception. Measured in-browser at the document root in light theme: background.secondary/.subtle/.hover and interaction.background.hover all resolve to #f7f7f7; border.subtle #d0d0d0, border.light #b8b8b8. The content-surface tier is disjoint from and strictly lighter than every border, and background.secondary is lighter than border.subtle (clause 2 fully holds). EXCEPTION to clause 1: background.tertiary and background.disabled remain at #d0d0d0, which border.subtle also uses. That is deliberate - they are border-weight surfaces by role, and the reference system behaves the same way (eBay Evo binds background-tertiary and border-subtle both to neutral-300 #e5e5e5). Full disjointness would need a ramp step that does not exist. Before: six roles collapsed on #d0d0d0 (secondary, subtle, disabled, placeholder, readOnly, border.subtle) and three on #b8b8b8."
    recorded_at: "2026-09-03T00:20:55.534Z"
    commit_sha: "73b1f3ac"
  - criterion_id: A4
    status: pass
    evidence_ref: "card.color.background.hover re-bound from semantic.color.background.secondary to semantic.color.background.hover (it was pointing at the wrong role), and background.hover itself moved neutral.200 -> neutral.50. Hover surface is now #f7f7f7 against the card's own border at #d0d0d0/#b8b8b8, so the hover tint is lighter than the border rather than a mid-grey darker than it. Previously the hover swapped the card to #d0d0d0. Emitted CSS carries the refreshed fallback: Card.css .card--interactive:hover background-color var(--fsds-card-color-background-hover, #f7f7f7)."
    recorded_at: "2026-09-03T00:21:09.877Z"
    commit_sha: "73b1f3ac"
  - criterion_id: A5
    status: pass
    evidence_ref: "All gates green in the worktree before merge: tokens:check-contrast 484 pairs / 11 instantiations OK; tokens:check-brand-refs exit 0; tokens:check-usage:gate exit 0 (unused 396 -> 395, neutral.50 went from dead to consumed; baseline re-recorded); generate:check exit 0 after 55 cascaded fallbacks were refreshed to a fixpoint from the gate's own output; governed:rail exit 0 with overall pass; test:frameworks 698/514+2skip/654/150. Root vitest on the canonical checkout post-merge: 242 files / 2960 tests pass, 1 pre-existing failure in src/consumption/css-hygiene.test.ts that belongs to a peer's analytical lane (afx-* dead selectors, added by 771af7dd) and is unrelated to this spec - my merge 73b1f3ac changed zero files under src/."
