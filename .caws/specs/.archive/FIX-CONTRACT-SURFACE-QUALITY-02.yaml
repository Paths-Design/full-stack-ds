resolution: completed
closure_notes: 'Card status rail moved to its six status variants; Popover re-bound to a neutral border over an elevated surface; Divider neutralizes the hr UA edges and no longer collapses; Table selected row re-pointed to accentSubtle, default-brand contrast 3.83 to 12.02.'
