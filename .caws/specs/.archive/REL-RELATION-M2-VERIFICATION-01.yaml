invariants:
  - 'A soundness helper checks the proposition its inputs name. A task passed separately from the program must AGREE with the program''s declared task, or the helper certifies a different question from the one the program declares.'
  - 'A control that claims to exhibit N results exhibits N results. A restricted inventory asserted only as non-empty and smaller than the full one establishes neither the count nor the membership.'
  - 'Independence is stated, not implied. The reference derives its expected SET without calling the enumerator; it shares the capacity table and the claim function, and a shared premise is an axiom on both sides rather than evidence for either.'
  - 'A failing check means NOT CERTIFIED. It does not mean analytically illegal; the structured support, admission and obligation results remain the things that say which of the three a request is.'
acceptance:
  - id: A1
    given: 'A program whose declared task differs from the task a caller asks the helper about, and a program whose declared task is that task.'
    when: 'The helper is called on both.'
    then: 'given a program declaring one task and a soundness query about another; when the relation soundness helper is called; then it does not certify the program, and a program whose declared task is the queried one is unaffected'
  - id: A2
    given: 'A relation inventory whose coordinate spaces and channels host exactly one lawful program.'
    when: 'The enumerator is run and its membership compared by name.'
    then: 'given a relation inventory that hosts exactly one lawful program; when the enumerator runs; then exactly that member is retained and the membership is asserted by name rather than as non-empty and smaller'
  - id: A3
    given: 'The independently derived lawful set, read against its own source.'
    when: 'The shared and derived premises are inspected and asserted.'
    then: 'given the independently derived lawful set and the enumerator; when the comparison is read; then the premises the reference SHARES with the implementation and the premises it DERIVES are both stated, and the shared ones are asserted to be shared rather than presented as independent'
  - id: A4
    given: 'A generator with one known lawful candidate suppressed.'
    when: 'The reference comparison is run against it.'
    then: 'given a generator that suppresses one known lawful candidate; when the comparison runs; then it reports that candidate as a missing member, with the expectation not taken from the mutated generator'
  - id: A5
    given: 'A candidate that violates one premise the reference states independently of the enumerator.'
    when: 'The checker is asked about the candidate.'
    then: 'given a candidate that violates one independently stated premise; when the checker is asked about it; then it is identified as an invalid extra rather than merely as not retained'
  - id: A6
    given: 'Inventories hosting none, exactly one, and several lawful programs.'
    when: 'Each is enumerated.'
    then: 'given zero, one and multiple lawful results; when each inventory is enumerated; then each outcome is asserted by exact membership'
  - id: A7
    given: 'An unsupported task, a relation whose operation is unproven, and an operation the rules contradict, each requested through the enumerator.'
    when: 'Each result is inspected for its own disposition.'
    then: 'given an unsupported, an unproven and a contradicted relation-path request; when each goes through the real entry point; then the three remain distinguishable and none is reported as another'
  - id: A8
    given: 'The scoped reference comparison and its passing result.'
    when: 'The recorded non-claims are read.'
    then: 'given a passing stock magnitude-comparison comparison; when the result is stated; then what it does not establish is recorded rather than left to the helper signature'
