    status: pass
    evidence_ref: "corpus-case.schema.json and corpus.jsonl replace the illegal-form pair (git rm). 29/29 tests; typecheck (root+codegen) and eslint clean; docs:check-claims OK. Probe verbatim: 'cases: 59  illegal: 54  unproven: 5  diagnostics (corpus): 47  diagnostics (doctrine): 47  findings: 0'. Seven diagnostics are shared by independent cases (ORDINAL_MEAN, SUM_SEMIADDITIVE, NORMALIZE_NONADDITIVE, GRAIN_FANOUT, UNIT_INCOMMENSURABLE_SHARED_SCALE, LOG_SCALE_ZERO_CLAIM, PROVENANCE_LAYOUT_GEOMETRY_CLAIM). Bijection falsifier reached for real: deduplicating the live corpus to one case per diagnostic yields CORPUS_CASE_DIAGNOSTIC_BIJECTION with detail 'exactly one case', and the live corpus does not. Case-id pattern, verdict/diagnostic/obligation if-then rules, stage bounds 1..6, and additionalProperties are each pinned by a mutation that yields CORPUS_SCHEMA_INVALID. Full root suite in the worktree: 13 failures in ds-figma-plugin FigmaPluginApp.test.ts (7), ds-tokens runner-mains.test.ts (5) and cli-spawn.test.ts (1); all three files pass 17/17 on unmodified canonical main and none is in the slice diff; classified as the worktree symlinked-node_modules environment (third occurrence this lane; CI on the previous push was green)."
    recorded_at: "2026-09-02T19:47:48.368Z"
    command: "pnpm exec vitest run packages/ds-codegen/src/analytical && pnpm exec tsx tmp/corpus-probe.ts"
  - criterion_id: A2
    status: pass
    evidence_ref: "casesAdjudicableAt(cases, 1) returns 19 cases, every one with stage 1, over 15 distinct diagnostics, including 3 unproven cases whose obligations resolve in vocabulary.json: CASE_ROLLUP_WITH_UNKNOWN_GRAIN->grain:declared, CASE_CURRENCY_SUM_MIX_UNKNOWN->unit:commensurable, CASE_SUPPRESSION_PRESENCE_UNKNOWN->null:missing-mechanism. Probe per stage: <=1 19/15/3, <=2 28/22/4, <=3 58/46/5, <=5 59/47/5 (cases/diagnostics/unproven). Pinned: no stage-1 case references a combinator term; the selector is cumulative (stage 3 strictly larger than stage 2; stage 6 equals the whole corpus); an obligation outside the vocabulary yields CORPUS_TERM_UNKNOWN naming the obligation ('obligation \"grain:vibes\"'). Evidence classes: 8 instance-evidence cases exist for both verdicts (4 illegal, 4 unproven)."
    recorded_at: "2026-09-02T19:47:49.064Z"
    command: pnpm exec tsx tmp/corpus-probe.ts
  - criterion_id: A3
    status: pass
    evidence_ref: "Satisfied by a STRICTER mechanism than the criterion's 'mentioned, hyphen/space tolerant' wording: the doctrine now carries a machine-readable 'Vocabulary appendix' table (one row per namespace plus an engines row) which corpus-integrity parses, and vocabulary.json must EQUAL it in both directions. Live: 0 CORPUS_VOCABULARY_DOC_DRIFT over 145 terms in 21 namespaces plus 8 engines. Falsifier reached for real: adding scale:vibes-added-without-doctrine to vocabulary.json printed {code:CORPUS_VOCABULARY_DOC_DRIFT, detail:'term \"scale:vibes-added-without-doctrine\" is in vocabulary.json but not in the doctrine appendix'}; removing scale:cyclic from vocabulary.json yields the reverse-direction finding; an added namespace yields the finding; the parser is pinned to stop at the next heading and to treat the engines row as the engine list. The fuzzy prose-mention edge was rejected because mention is not definition; the exact edge is what the review asked for ('one surface derived or a real equality edge')."
    recorded_at: "2026-09-02T19:47:49.529Z"
    command: "pnpm exec vitest run packages/ds-codegen/src/analytical -t 'doctrine-appendix'"
  - criterion_id: A4
    status: pass
    evidence_ref: "Reading-based criterion, verified by reading plus the doc gates (docs:check-claims OK; frontmatter hook silent on Write). Status paragraph names what exists (analytical-pack/**, analytical/**, the parsed catalogue and appendix) and the ratification condition (status flips to active when stage 1 adjudicates every stage-1 case three-valued with necessity witnesses); governs: splits existing from proposed paths. L1 'Relational structure and grain' states the position with the isolated-node argument. L3.5 adds 'A declared task cannot disavow what the encoding asserts' and REL_TASK_UNDERSTATED_ENCODING_CLAIM (case CASE_TRUNCATED_LENGTH_DECLARED_AS_LOOKUP). Stage-1 row scopes adjudication to stage-1 cases, three-valued with evidence classes, heterogeneous fixture, necessity witness per axis, pre-schema recon over four probes plus a graph with an isolated node, and a stop condition on undercount/overcount. Invariants 14-16, falsification conditions 9-10, D2 demoted to a probe, three completeness bars, and the non-claims now include analytical meaning versus denotation and the narrowed vocabulary claim. Known bookkeeping defect recorded, not cleaned: the closed spec REL-ILLEGAL-CORPUS-01 A1 text names packages/ds-contracts/analytical-pack as the vitest path while the tests live under packages/ds-codegen/src/analytical; its evidence is frozen and lifecycle YAML is hand-edit-forbidden."
