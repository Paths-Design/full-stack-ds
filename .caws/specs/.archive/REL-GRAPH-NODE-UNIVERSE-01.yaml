evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "A POSITIVE RESULT, measured through the retained ledger packages/ds-contracts/analytical-fixtures/graph-experiment.json, which the test byte-compares against a fresh computation. THE PAIR: structure A declares nodes [n1,n2,n3] with edges [(n1,n2)] and isolates [n3]; structure B declares nodes [n1,n2] with the SAME edges - edgeRelationIdentical is true, so the discriminator is the declared node population alone. THE QUESTION, ANSWERED: the node universe is DECLARED and validated rather than inferred. `declareGraphBinding` resolves every name against the structure (a missing relation, a missing key field and a missing endpoint field each throw) and refuses to let the node universe be the edge relation, so no consumer infers the binding from fields that happen to be named id, src and dst. The node population is read from the nodes relation INDEPENDENTLY of the edges, which is why `n3` - a node with no edge at all - survives into the result. RECOVERY THROUGH BOTH REPRESENTATIONS: a relational readback (two populations kept apart) and an incidence-oriented output (every node listed with its incident edges, an isolated node present WITH AN EMPTY INCIDENT LIST rather than absent) both recover nodes [n1,n2,n3], edges [(n1,n2)] and isolates [n3]; bothPreserve is true. Each decoder takes exactly one argument and receives only its own output. THE COUNTEREXAMPLE IS EXHIBITED, NOT ASSERTED: a representation deriving its node list from edge endpoints yields [n1,n2] for BOTH structures, so distinguishesThePair is false - the collapse a node-from-edges representation suffers is executed in the module and recorded rather than argued in prose. THE AUTHORITY GAP IS RECORDED IN THE ARTIFACT: authorityGap.declaresANodeRelation is false, since the relation model graph operand names {from: relation, edgeFrom: field, edgeTo: field, value: field} and no node relation; the binding is an explicit validated PREMISE and the zod model, schema emission and the stage-2 ledgers are untouched. Verification: pnpm exec vitest run packages/ds-codegen/src/analytical (22 files / 944 tests; graph-projection.test.ts 18), pnpm test (303 files / 4165 tests), typecheck, lint, docs:check-claims, governed:rail and test:frameworks green in the worktree. NON-CLAIMS: one fixture, its isolate-removal neighbour, two representations and one mutation; no layout, marks, interaction, accessibility, general combinators, algebra redesign, arbitrary graph realization, or the complete projection thesis. Stage-2 ratification is untouched and the stock example remains a regression witness."
    recorded_at: "2026-09-18T04:35:33.932Z"
  - criterion_id: A2
    status: pass
    evidence_ref: "Identical edge relation across the pair, asserted as edgeRelationIdentical true, with different declared node populations (3 against 2). Both produced representations recover the exact node identities and the incidence for BOTH structures and so distinguish them. The node-from-edges representation is executed on both sides and returns [n1,n2] each time, so distinguishesThePair is false: it cannot see the difference at all. This is the pair the acceptance names, with the boundary that would lose it demonstrated rather than described."
    recorded_at: "2026-09-18T04:35:34.733Z"
  - criterion_id: A3
    status: pass
    evidence_ref: "The isolated node is renamed to n3-impostor in the PRODUCED incidence output while the node count and the edge set are held fixed: countAndEdgesUnchanged is true, so a consumer comparing counts would pass the mutation. Recovery compares IDENTITIES, returns nodes [n1,n2,n3-impostor] against the expected [n1,n2,n3], and reports the mutation detected. The unmutated graph is accepted through the same comparison (relational.ok and incidence.ok both true), so the control is a discriminator rather than a blanket refusal."
    recorded_at: "2026-09-18T04:35:35.233Z"