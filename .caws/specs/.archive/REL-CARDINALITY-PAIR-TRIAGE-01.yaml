    evidence_ref: "Tested all six relation.derivedBy.join.cardinality member pairs with an authored {base, patch} pair whose two sides differ at exactly the cardinality tag, then landed the one whose sides are both corpus-licensed and recorded why the other five are refused. LANDED (1): one-to-many~many-to-many. The a-side is the corpus case CASE_REVENUE_DOUBLE_COUNTED_AFTER_JOIN (FX_ORDER_REVENUE_SUMMED_AFTER_LINE_JOIN, illegal REL_GRAIN_FANOUT); the b-side is the same declaration at many-to-many, whose required outcome adds the corpus's grain:declared obligation because a join that multiplies on both sides determines no result grain -- the triad whose absent side is FX_ORDERS_ROLLUP_UNKNOWN_GRAIN. checkWitness ACCEPTS the single-coordinate witness, checkIsolation discharges on both sides (the merge folds the two members into one class, the join has no resolvable cardinality, determinedGrain returns undefined, the grain comparison is skipped, and no boundary finding is introduced), and the subtraction falls 69 -> 68 of 118 with witnessed verdicts 15. REFUSED (5), for two measured reasons, and they stay unresolved. one-to-one~many-to-one is refused because SAME_OUTCOME: the authority determines the same result grain for both members, so no corpus cause separates them on any committed join fixture -- a result, not a pending question. The other four (one-to-one~one-to-many, one-to-one~many-to-many, one-to-many~many-to-one, many-to-one~many-to-many) are refused because the only distinguishing outcome on one side is REL_DERIVATION_RESULT_NOT_DERIVABLE, a boundary well-formedness refusal the doctrine states carries no corpus case; such a pair does not follow from an already-existing Stage-2 cause, and ZERO of the sixty prior witnesses has ever carried a DERIVATION_DIAG code as a required outcome, which is the precedent this follows rather than invents. THE POLICY QUESTION THIS OPENS: whether a pair whose distinction IS a well-formedness refusal should count as evidence -- it is the first refusal here that turns on the KIND of required outcome rather than on the erasure or the corpus, and it is recorded in the doctrine rather than settled by landing. NON-CLAIMS: the landed witness establishes that the tag decides whether the result grain is DETERMINED at all; it does not establish that one-to-many and many-to-many differ in what they multiply, and it says nothing about the five siblings; the sibling refusals are recorded on the durable surface (doctrine bullet + snapshot forward plan) because an UNRESOLVED verdict carries no reason field by design and adding one would be a schema deviation; and no closure moved -- the gate still reports 22 provisional and 21 unsettled dependencies, since the newly primitive coordinate is still unsettled by obligation 8's definition. Verified by the analytical suite (19 files, 834 tests), the full root suite (301 files, 4055 tests), all eight analytical gates, docs:check-claims and docs:check-links."
