  - 'The scope of the claim stays the INSTANCE the evidence covers: the reader may not claim uniqueness over unseen rows or an unobserved larger dataset.'
  - 'The five controls committed by REL-WITNESS-COLUMN-RESOLUTION-01 are retained unchanged, and the original sentinel repair is not reverted.'
