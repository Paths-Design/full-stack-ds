invariants:
  - >-
    A component's layout axis is a fact its own contract declares, never one it
    inherits from a primitive default it did not ask for. Alert and AlertNotice
    were the only two components in the corpus relying on the axis leak that
    FIX-STACK-NATIVE-AXIS-LEAK-01 removed; this slice makes their reliance
    explicit rather than restoring the leak.
  - >-
    This slice RESTORES the pre-leak-fix rendering exactly. It is not a redesign.
    Alert's flat anatomy (root > icon, title, body, dismiss) cannot express the
    conventional alert layout — icon beside a COLUMN of title+body, dismiss at the
    end — because it has no content-wrapper part. That gap is recorded as a
    finding, not silently fixed here, because adding an anatomy part changes the
    public DOM contract of six targets.
acceptance:
  - id: A1
    given: 'Alert and AlertNotice roots, which are Stack layout="native" hosts'
    when: 'their generated CSS is applied in a browser'
    then: >-
      computed flex-direction is column, and it originates from the component's
      own rule rather than from any .stack--* selector.
  - id: A2
    given: 'The corpus-wide sweep of every layout="native" host with 2+ in-flow children'
    when: 're-run after this slice'
    then: >-
      the set whose axis differs from its pre-FIX-STACK-NATIVE-AXIS-LEAK-01 value
      is exactly {Button}, the one intended change; Alert and AlertNotice are back
      to column and no other component moved.
  - id: A3
    given: 'The regenerated corpus'
    when: 'governed:rail, generate:check, root tests and all five framework suites run'
    then: 'all pass with generated bytes committed in the same commit as the contract change.'
non_functional: {}
contracts:
