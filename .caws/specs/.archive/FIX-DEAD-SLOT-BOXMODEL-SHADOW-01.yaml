invariants:
  - 'A shadowed slot is genuinely not a defect: renderBoxModelConsumers() emits the primitive consumer on every root and author styles.root rules spread AFTER it, so the author rule wins the property and the primitive var never reaches the CSS. That is the layering working as designed, not drift.'
  - 'Reclassification must be falsifiable in the direction that would expose goalpost-moving: removing the author override must return the slot to consumed, never leave it shadowed.'
  - 'Shadowing is claimed only for box-model primitives that renderBoxModelConsumers() actually emits, enumerated explicitly rather than inferred from the slot name, so an ir.ts rename surfaces as a classifier miss rather than silently relabelling slots.'
  - 'The ledger shrinks by exactly the reclassified entries; no other entry changes disposition, and the total dead count drops by that same number.'
  - 'Remediation-free: no contract, codegen source, emitter or generated artifact changes. tokens.css keeps declaring the full vocabulary — per the base-inheritance principle, a declaration without a reader in one component is intentional fallback surface, not dead weight.'
acceptance:
  - id: A1
    given: 'A box-model primitive slot whose consumer property is overridden by a rule in styles.root.'
    when: 'The dead-slot audit runs.'
    then: 'The slot is classified shadowed and excluded from the dead count.'
  - id: A2
    given: 'The same slot with the author override removed.'
    when: 'The classifier runs.'
    then: 'The slot returns to consumed, NOT shadowed — proving the reclassification tracks the real mechanism rather than relabelling a defect.'
  - id: A3
    given: 'The seeded ledger.'
    when: 'The audit runs after reclassification.'
    then: 'The ledger shrinks by exactly the 17 shadowed entries with no stale and no unledgered, and no other entry changes disposition.'
  - id: A4
