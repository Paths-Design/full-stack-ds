    evidence_ref: "OUTPUT ABSENCE, OBSERVED. selectAndLower runs the same selection-and-lowering orchestration the experiment uses and returns what it PRODUCED. Measured under the empty channel inventory: considered=0, realized=[], unrealized=[] - an empty output collection from an executed path, not a count asserted beside separately produced reports, and no manually authored verdict field. The same orchestration under the full inventory returns considered=12, realized=[readback, metric], unrealized=10 with a reason each, so the empty result is ABSENCE and not a path that never produces anything. SUPPORT ENFORCED. `lower` previously branched on readback capability alone, so every zero-baseline program reached the generic metric producer; measured now: 2 realized, 10 unrealized, 12 considered, realized.length equal to LOWERING_SUPPORT.length, realized plus unrealized equal to considered, and every unrealized reason matching \"no lowering is declared\". The runner selects its witness pair FROM the support declaration rather than taking the first readback and first non-readback program, so the restriction is a property of the code and not of the example selection. The narrowed support had to include the dimension channel: at (coordinate, measure) granularity two cartesian|*|area programs matched, which is exactly the silent widening being corrected. Verification: pnpm exec vitest run packages/ds-codegen/src/analytical (21 files / 926 tests), pnpm test (303 files / 4147 tests), typecheck, lint, docs:check-claims, governed:rail and test:frameworks green on merge. NON-CLAIM: this corrects two evidence/enforcement boundaries only; admission, partition membership, single evaluation and the preservation pair are untouched and their own evidence stands."
