invariants:
  - 'A PART THAT CANNOT BE ANSWERED IS NOT A PART THAT WAS ANSWERED WRONGLY. The part reader consults the support decision BEFORE any candidate or rule, so an unimplemented task reaches the composite as UNSUPPORTED and never as unproven or refused.'
  - 'The composite report does not erase origins. Every part carries its own disposition in the judgement, so a composite holding parts in several different states reports all of them and the composite verdict is a conclusion drawn from them rather than a summary that replaces them.'
  - 'A part fault keeps its own cause and its own location. A composite refuses FROM THE PART with the cause the part carried, and a nested composite re-attributes the refusal to the part at each level without rewriting the cause.'
  - 'Recovery does not weaken the pre-commit. The parked expectations are carried over unedited, and a disagreement is adjudicated in the ledger rather than resolved by changing the expectation.'
acceptance:
  - id: A1
    given: 'A composite one of whose parts declares a task the relation path does not implement.'
    when: 'The composite is judged and the part''s disposition read.'
    then: 'given a composite whose part declares a task the relation path does not implement; when the composite is judged; then that part''s disposition is UNSUPPORTED and is identifiable as such rather than reported as unproven or refused'
  - id: A2
    given: 'A composite one of whose parts is built on an operation the rules leave unproven.'
    when: 'The composite is judged.'
    then: 'given a composite whose part''s operation is unproven; when the composite is judged; then the part retains its obligation through the composite'
  - id: A3
    given: 'A composite one of whose parts is built on an operation the rules contradict.'
    when: 'The composite is judged.'
    then: 'given a composite whose part''s operation the analytical rules contradict; when the composite is judged; then the composite is refused from the part and carries the part''s own named cause'
  - id: A4
    given: 'A composite whose parts are unsupported, unproven and contradicted at once.'
    when: 'The composite is judged and every part''s disposition read.'
    then: 'given a composite whose parts are in several different dispositions; when it is judged; then every part''s disposition is reported so that no origin is erased by the aggregate verdict'
  - id: A5
    given: 'A composite whose part is itself a composite that a combinator rule refuses.'
    when: 'The outer composite is judged.'
    then: 'given a nested composite; when it is judged; then the inner disposition reaches the outer with its cause, and the outer attributes the refusal to its part rather than to a rule of its own'
