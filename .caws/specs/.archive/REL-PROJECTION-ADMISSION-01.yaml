invariants:
  - 'SEMANTIC ADMISSION USES THE EXISTING ANALYTICAL AUTHORITY, never a second implementation of the laws. The operation is judged by the same engine that judges the corpus, and its structural resolution is not allowed to substitute for that judgment. A structural check that passes while the analytical rules refuse the operation is exactly the defect this closes.'
  - 'A preservation result is not an admission result. A round trip can hold perfectly for an operation that should never have been admitted, so the two are tested separately and neither stands in for the other.'
  - 'Program choice must DETERMINE the produced representation. The lowering entry point consumes a retained program; with no candidate there is no output, and removing the capability a representation needs prevents that representation from being produced.'
  - 'A declared composition partition must be a column of the RESULT. A partition naming a source column the operation summed away, or a name that exists nowhere, is an invalid binding and is refused at the same boundary as the operation, not treated as an unknown partition and not given an unrelated analytical diagnostic.'
  - 'Out of scope and not to be widened into: OHLC and graph recombination, the eight unimplemented tasks, general combinators, rendering, cross-target behaviour, stage-2 accounting, and residue enumeration. Only the existing readback and one explicit metric assignment are lowered; the remaining programs stay enumerated and unrealized, and that limit is stated.'
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given an analytical operation is supplied with the structure it names; when its semantic standing is established before its result is treated as admitted; then the operation is judged by the existing analytical authority, an operation the declared facts forbid is REFUSED even though the arithmetic evaluator can compute it, a premise that is merely missing is carried, and structural resolution never substitutes for the judgment'
  - id: A2
    given: 'An operation has been admitted and a candidate retained.'
    when: 'The admitted result is lowered through a specific retained program.'
    then: >-
      The program's measure channel DETERMINES the representation produced: a
      readback program yields readback entries, a metric program yields extents
      under a declared scale, an empty inventory yields no candidate and therefore
      no output, and clearing the baseline a metric program needs makes lowering
      unrealized.
  - id: A3
    given: 'A composition declares the dimension it partitions over.'
    when: >-
      That dimension is not a column of the result the operation produced, or is a
      name that exists nowhere.
    then: >-
      The declaration is refused at the same boundary as the operation, and the
      rejection is EXECUTED by a test rather than asserted from a stored flag.
  - id: A4
    given: 'The preservation report and the record claim a single evaluation and decoder independence.'
    when: 'The implemented calls and the decoder signatures are read.'
    then: >-
      The report evaluates the admitted operation once and lowers that result, and
      the arity assertion is stated as a signature fact rather than a proof of the
      information boundary, with the isolated execution as the support for decoder
      independence.
