    evidence_ref: "REPRODUCED BEFORE REPAIR: `sum(stock.on_hand) over [date] -> grain [product]` was admitted by the structural checks, enumerated 42 candidates, and preserved perfectly - the direction the declaration forbids via nonAdditiveAlong [date]. admitOperation now judges the exact assertion with the SAME engine that judges the corpus: that operation is REFUSED naming REL_ADDITIVITY_SUM_SEMIADDITIVE, while the fixture own across-product sum remains admitted (canonical judgment admissible, 0 diagnostics, 0 obligations) and still reaches both representations. A merely missing premise stays carried: grain unknown returns kind unproven with obligation grain:declared before any candidate exists. Structural resolution never substitutes for the judgment - the structural checks run first and the judgment decides. TWO OF THE SLICE OWN PERTURBATIONS ARE NOW REFUSED AT ADMISSION, which is the stronger result rather than a loss: perturbing the measure to ordinal makes the sum itself illegal (REL_MEANINGFULNESS_INTERVAL_SUM), so the precommit ratio->ordinal control is SUPERSEDED by admission rather than weakened, and a ratio-measure composition probe is refused under REL_RATIO_MEASURE_AVERAGED before any composition exists; both are recorded as controls with requirementMet and their correction text rather than crashing. Verification: pnpm exec vitest run packages/ds-codegen/src/analytical (21 files / 924 tests), pnpm test (303 files / 4145 tests), typecheck, lint, docs:check-claims, governed:rail and test:frameworks green on merge 4872e6c7. NON-CLAIM: the enumerator still has no second, independently established operation identity to compare a caller-supplied operation against; semantic admission answers whether the declared facts forbid an analysis, not whether that analysis is the one that was selected."
    recorded_at: "2026-09-18T03:42:02.333Z"
  - criterion_id: A2
    status: pass
    evidence_ref: "THE CONNECTION THAT WAS MISSING. produce can build both representations from any result, so on its own it demonstrated an encoding helper: with an EMPTY channel inventory enumeration retained 0 candidates and the standalone report still produced both outputs, which is how local success could leave the motivating outcome unmet. lower now consumes an actual RETAINED PROGRAM and its measure channel decides: the readback program cartesian|position|text yields representation readback with recovered day1=30 and day2=105, and the metric program cartesian|position|area yields representation metric with extents 60 and 210 decoding to 30 and 105 under the declared scale of two units per value. The two programs differ and yield different representations, so program choice controls the encoding. THE DECISIVE CONTROLS, both measured into the ledger: loweringControls.emptyInventoryRetained is 0 (no candidate, therefore no output), and clearing the baseline a metric program needs makes lowering unrealized with the reason that a metric representation needs a declared zero baseline. Mutation controls still run on the PRODUCED output: the readback program key-binding mutation is detected while the total stays 135, and the metric program extent mutation is detected. NON-CLAIM: only the readback family and one explicit metric assignment are lowered; the remaining retained programs stay enumerated and unrealized, and no claim is made that they are realizable."
