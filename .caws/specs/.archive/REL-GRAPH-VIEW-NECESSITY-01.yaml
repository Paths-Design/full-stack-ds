    evidence_ref: "THE INVENTORY IS DERIVED FROM THE EMITTED SCHEMA. declaredGraphViewCoordinates walks definitions[\"graph-view\"] and definitions[\"graph-view-binding\"] in graph-view.schema.json - the artifact the family is drift-gated against - so a field added to the declaration arrives failing here rather than silently unaccounted. Deriving it corrected an undercount: SIX slots, not five. The review list omitted binds.edges.relation, which can change the incidence while the selected node universe stays fixed. EVERY DISPOSITION IS EXECUTED AND USES ONLY THE DOCTRINE CENSUS VOCABULARY (witnessed / representation-artifact); joint witnessing is stated inside the pair rather than as a new label, and no label was manufactured to produce a closed-looking list. MEASURED: binds.nodes.relation WITNESSED by GV_ALL_NODES against GV_CONNECTED_SET over one source and one edge relation, nodes n1,n2,n3 against n1,n2. binds.edges.relation WITNESSED by an AUTHORED second edge relation (the shipped source declares one, so the slot would otherwise have no pair) - edges n1->n2 against n2->n1. binds.edges.fromField and binds.edges.toField WITNESSED JOINTLY in a minimal 2-set: the reversal changes the DIRECTED INCIDENCE to n2->n1 and no population at all, and changing one alone yields a degenerate endpoint. binds.nodes.keyField REPRESENTATION-ARTIFACT: every candidate node relation in this source declares exactly one key, so the identity field is DERIVABLE from the relation own declaration; it would be independent for a relation declaring more than one key, and the edge relation declares none, which is why the endpoint fields are not derivable the same way. id REPRESENTATION-ARTIFACT, executed: the view is renamed and its references updated through the parsed declaration and the denoted graph is UNCHANGED (same nodes, same edges), so the identifier carries no analytical degree of freedom - its role is reference identity, selection and provenance. THE DISTINCTION THE REVIEW ASKED FOR IS HONORED: a resolving-but-invalid field proves a REFERENCE CHECK, not an independent semantic coordinate, and only a changed denoted object earns a necessity disposition here. NON-CLAIM, carried explicitly: this does not claim six independent semantic primitives are established; it records each slot actual role, and the edge-relation witness is an AUTHORED stimulus rather than one the shipped source carries. Verification: pnpm exec vitest run packages/ds-codegen/src/analytical (22 files / 962 tests), pnpm test (303 files / 4183 tests), typecheck, lint, governed:rail, test:frameworks, analytical:check-schemas, analytical:check-baseline (conserved) and analytical:freeze:check (160/126) all green on merge, with NO ledger re-record because no governed behavior changed."
