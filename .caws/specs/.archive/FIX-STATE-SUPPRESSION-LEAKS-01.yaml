invariants:
  - 'The guard is emitted by the codegen from the declared contract fact, never hand-authored per component. Enumerating resets property-by-property is exactly the fragile approach that produced the leak: Button reset background-color and color and forgot border-color.'
  - 'The guard form follows the element: a contract-declared a11y.attribute wins; otherwise :disabled for native form controls; otherwise the aria-disabled attribute selector. A guard the root can never match is no guard at all.'
  - 'Guarding changes selector specificity (adding :not(:disabled) contributes (0,1,0)). Nothing may regress as a result — the full battery plus the framework suites must stay green, and any cascade change must be understood rather than absorbed.'
  - 'The audit is not the proof. It scores selector presence, so it would score a guard realized whether or not it matches at runtime; the honest evidence is the emitted CSS plus the reachability grading.'
acceptance:
  - id: A1
    given: 'A contract declaring availability.suppresses.categories including interaction.'
    when: 'The component CSS is emitted.'
    then: 'Every interaction pseudo selector on the root carries a guard excluding the suppressed state.'
  - id: A2
    given: 'A root that is a native form control versus one that is not.'
    when: 'The guard is emitted.'
    then: 'The form control gets :not(:disabled) and the other gets the aria-disabled form, so the guard can actually match.'
  - id: A3
    given: 'A component with NO suppression declaration.'
    when: 'Its CSS is emitted.'
    then: 'No guard is added — the change is driven by the declared fact, not applied blanket.'
  - id: A4
    given: 'The state-suppression ledger.'
    when: 'The rail runs after regeneration.'
    then: 'The reachable leaks burn, the ledger shrinks by exactly those entries, and no unledgered or stale entries remain.'
  - id: A5
    given: 'The completed slice.'
    when: 'The full gate battery runs.'
    then: 'All three rails, generate:check, governed:rail, root and framework suites are green, and regenerated bytes land with the codegen change.'
non_functional: {}
contracts:
