invariants:
  - 'Every existing (non-removed) brand keeps working unmodified — the @layer re-wrap of component tokens.css changes cascade mechanics, not any single brand''s declared values, so default/corporate/forest/canary/monochrome must render identically before and after.'
  - 'A brand''s components.<Name>.<slot> override, when present, wins over the component''s own .tokens.css default for that exact CSS custom property, on every framework target, without !important.'
  - 'Removing a brand file is a pure deletion — no code path references ocean/midnight/rose/sunset/slate by name after this lands (BrandId type, illustrative doc samples).'
  - 'generate:check and governed:rail stay green with zero drift after full regeneration across all 5 frameworks.'
acceptance:
  - id: A1
    given: 'a brand file declares a components.<ComponentName>.<slotKey> override (e.g. Button background) and that component is regenerated across all 5 frameworks'
    when: 'the token build runs and the component''s generated tokens.css/component CSS is inspected under [data-brand="<id>"]'
    then: 'the brand-specific custom property value is what actually renders for that component in that brand, verified via a real browser/JSDOM computed-style check, not just presence of the CSS rule text'
  - id: A2
    given: 'the 5 removed brand files (ocean, midnight, rose, sunset, slate) are deleted and 5 new persona brand files (streaming, fintech, developer, quickserve, marketplace) exist'
    when: 'pnpm -F @full-stack-ds/tokens build runs'
    then: 'tokens.css @layer brand contains exactly the new 10-brand set (default, corporate, forest, canary, monochrome, streaming, fintech, developer, quickserve, marketplace) and zero references to the removed 5'
  - id: A3
    given: 'the 5 new personas each declare a distinct semantic-layer identity (color ramp/accent, shape radii+elevation, spacing/density, motion duration+easing, typography weight)'
    when: 'tokens:check-contrast, generate:check, and governed:rail run'
    then: 'all pass with zero drift and all curated brand-mark contrast pairs clear WCAG AA in both light and dark'
non_functional: {}
