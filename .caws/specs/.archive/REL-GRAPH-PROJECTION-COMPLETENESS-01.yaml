    evidence_ref: "BOUNDED COMPLETENESS AGAINST AN INDEPENDENTLY DERIVED SET, which is the point of the control: lawfulGraphTopologies reasons directly from the CAPACITY table and the stated domain restriction (only non-metric, both channels hosted by it, node and edge channels distinct, the edge channel must be connection because that is what induces the incidence claim) and does NOT call enumerateGraph, so the expectation cannot be a restatement of the output and a candidate the implementation never generates appears as a MISSING MEMBER rather than as a smaller self-consistent number. MEASURED: the retained membership is exactly non-metric|hue|connection, non-metric|shape|connection, non-metric|texture|connection, and graphMembership(run) equals the independently derived list. SOUNDNESS: graphCandidateIsSound is asserted for every retained candidate - in inventory, distinct channels, coordinate non-metric, both channels hosted by that coordinate, and inducedGraphClaims containing incidence-recoverable. THE PRE-COMMITS ARE MEMBERSHIP AND WERE RECORDED BEFORE THE RUN: removing connection removes exactly the predicted candidates and keeps NONE (the incidence claim needs it, so nothing survives by luck); removing texture - chosen because it is actually assigned, unlike text or position which are not hosted by non-metric and would make the control vacuous - removes exactly the candidate assigning it and preserves the other two. INVARIANCE: the perturbation is chosen BY THE CAPACITY TABLE, not by taste - area is asserted NOT to be hosted by non-metric and adding it leaves the normalized outcome identical, while shape IS a lawful node channel here and adding it correctly ADDS a candidate, which is asserted as the contrast. ZERO/ONE/MULTIPLE: no connection yields none; a two-channel inventory yields exactly non-metric|hue|connection; the full inventory yields three. The population counters keep the 912 excluded candidates visible, so a restricted search cannot read as no lawful projection. UNPROVEN / CONTRADICTION / UNIMPLEMENTED stay distinct: a missing population is carried (unproven), an endpoint outside the selected universe is refused, and the seven still-unimplemented tasks are named with topology asserted NOT among them. Verification: pnpm exec vitest run packages/ds-codegen/src/analytical (22 files / 970 tests; graph-projection.test.ts 44), pnpm test (303 files / 4191 tests), typecheck, lint, governed:rail, test:frameworks and analytical:check-baseline (conserved) all green on merge. NON-CLAIMS: this is the graph topology candidate space only - it is not a complete topology algebra, no layout, and the relation-valued path candidate space is not re-derived here; the independent derivation shares the capacity table with the enumerator, so it bounds completeness WITHIN that table rather than establishing the table."
