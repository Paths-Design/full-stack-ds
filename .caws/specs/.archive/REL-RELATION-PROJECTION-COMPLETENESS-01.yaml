    evidence_ref: "BOUNDED COMPLETENESS AGAINST AN INDEPENDENT DERIVATION, and the control corrected THE DERIVATION rather than the enumerator - the result worth recording. lawfulRelationPrograms reasons from the capacity table, the task requirement and the RESULT facts and never calls enumerate. FIRST RUN: 14 derived against 12 retained. The two extras were polar|angle|length and polar|angle|position, refused by the enumerator under REL_CYCLIC_ANGLE_NONCYCLIC. THE ENUMERATOR WAS RIGHT AND THE DERIVATION WAS OVER-PERMISSIVE: the cyclic licence applies to WHICHEVER role the angle channel carries, so the DIMENSION needs it too - the result group column is date with transformation interval and cyclic false. Both lawfulRelationPrograms and relationProgramIsSound now carry the dimension-role check and the sets agree at twelve. This is the soundness limb in the direction that is easy to forget: an independent set can be wrong by INCLUDING an unsound candidate, not only by omitting a lawful one, so a completeness check that only looks for missing members would have passed a permissive derivation. SOUNDNESS: relationProgramIsSound asserted for every retained program. PRE-COMMIT (MEMBERSHIP, NOT COUNT): removing the area measure channel removes exactly the predicted programs and preserves every other same-task program, with the predicted kept set recorded before the run. ALPHA-RENAMING IS AN INVARIANT: the relation, the aggregated field and the group column are respelled and the operation rebound, and the retained MEMBERSHIP is unchanged - a membership that moved on a respelling would be name-based dispatch. An irrelevant declared field leaves it unchanged. ZERO/ONE/MULTIPLE reachable; a missing premise is CARRIED while a contradiction is REFUSED; population considered 168 with the excluded set visible so a restricted search cannot read as no lawful projection. Verification: pnpm exec vitest run packages/ds-codegen/src/analytical (22 files / 977 tests), pnpm test (303 files / 4198 tests), typecheck, lint, governed:rail, test:frameworks and analytical:check-baseline (conserved) all green before the merge. NON-CLAIMS: the independent derivation shares the capacity and task tables with the enumerator, so it bounds completeness WITHIN those tables rather than establishing them; magnitude-comparison over the stock fixture only, not OHLC, not the other seven tasks, not combinators, not lowering, not stage-2."
