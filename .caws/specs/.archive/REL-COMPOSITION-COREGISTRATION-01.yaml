  - id: A4
    given: 'one qualified operand whose standing is unproven because a participating value was unreadable'
    when: 'layer composes it with a qualified operand'
    then: 'the composite is unproven with the operand''s own obligation attributed to the part at its recorded path'
  - id: A5
