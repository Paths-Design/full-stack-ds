invariants:
  - 'COREGISTRATION IS SET IDENTITY: two layer operands are co-registered exactly when the analytical observations they carry the same structured source-grain key sets; never row order, never index, never cardinality, never field spelling, never relation name.'
  - 'POPULATION IS NOT ALIGNMENT: a missing observation leaves the population/alignment premise explicitly unresolved with the unmatched keys named; an equal-cardinality key mismatch is an observed unregistration, refused; neither silently intersects the operands.'
  - 'STANDING IS CONSERVED THROUGH COMPOSITION: an unproven operand leaves the composite unproven with the operand''s own obligation; a contradicted operand refuses the composite with the operand''s own cause, attributed to that operand at its recorded path with the observation''s structured key named; composition never summarizes an operand''s standing away.'
  - 'NO FORM LORE IN THE RULE: the layer rule consumes structured keys and declared facts only; no OHLC branch, no reopening of raw rows, no reorder dependence.'
  - 'EXISTING LAYER SEMANTICS ARE PRESERVED: judgeLayer''s shared-channel, scale-policy, unit-conflict and commensurability rules are unchanged; the co-registration decision is added before them for qualified operands and mixed operand families are unsupported rather than improvised.'
