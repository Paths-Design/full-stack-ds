    - 'packages/ds-codegen/src/analytical/projection.test.ts (the host standing controls)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/analytical'
  out: []
invariants:
  - 'THE HOST IS AN OPERAND. A composite is judged from its operands, and an embed declares two: the host projection and the embedded part. A checker that reads only one of them cannot establish the composite it claims to judge.'
  - 'Host and embedded part are attributed DISTINCTLY. The host path is unambiguous against every part path, so a refusal names which operand failed rather than a single undifferentiated "part".'
  - 'A supported child never hides a faulty host. The child is still read, and its disposition stays on the record, but it cannot upgrade a host that has no standing.'
  - 'The correction adds no host constraint the doctrine does not name. It establishes the host''s STANDING through the paths that already exist; it does not invent a rule about what a host must be.'
acceptance:
  - id: A1
    given: 'An embed whose host is a retained program and whose embedded part is a retained program.'
    when: 'The composite is judged and the record read.'
    then: 'given an embed whose host and whose embedded part are both retained programs; when the composite is judged; then it is retained and the host''s standing is on the record at its own path'
  - id: A2
    given: 'An embed whose host declares a task the relation path does not implement, with a retained embedded part.'
    when: 'The composite is judged.'
    then: 'given an embed whose host declares a task the relation path does not implement; when it is judged; then the embed is unsupported and attributed to the HOST, and the embedded part''s own disposition is still on the record'
  - id: A3
    given: 'An embed whose host is built on an operation the analytical rules contradict, with a retained embedded part.'
    when: 'The composite is judged.'
    then: 'given an embed whose host''s operation the analytical rules contradict; when it is judged; then the embed is refused carrying the host''s own named cause and attributed to the host'
  - id: A4
    given: 'An embed whose host is contradicted and whose embedded part is unsupported.'
    when: 'The composite is judged.'
    then: 'given an embed whose host and whose embedded part are BOTH faulty; when it is judged; then both origins are on the record at distinct paths and neither erases the other'
  - id: A5
    given: 'A retained embed and the existing cell-budget controls.'
    when: 'The record''s paths are compared and the budget controls re-run.'
    then: 'given an embed; when its record is read; then the host path is unambiguous against every part path, and the existing cell-budget controls are unchanged'
non_functional: {}
