id: REL-EMBED-HOST-STANDING-01
title: 'The embedded projection''s HOST is an operand: its standing is read, recorded at its own path, and affects the embed'
risk_tier: 2
mode: feature
lifecycle_state: archived
resolution: completed
closure_notes: 'The embed host is now an operand: read through the support and certification path, recorded at an unambiguous host path, attributed distinctly from the embedded part, and unable to be hidden by a supported child.'
created_at: '2026-09-19T06:00:11.845Z'
updated_at: '2026-11-05T23:06:19.351Z'
created_by_session: 'session-81b74ef5-48d2-46ae-a53d-880593255530'
blast_radius:
  modules:
