invariants:
  - 'A slot is INERT when no rule reads it: setting the custom property has no effect, so it presents as settable and turns nothing. Verified: every dead slot is declared in 9 emitted files and read by var() in zero.'
  - 'Inert and defect are different questions. A shadowed slot is inert (nothing reads it on that component) but is NOT an authoring defect (the author deliberately overrode the primitive). Both facts must be visible; collapsing them in either direction loses information.'
  - 'The ledger accounts for every inert slot, including inert-by-design ones. Nothing leaves the ledger by being declared acceptable — it leaves only by becoming consumed or by having its declaration deleted.'
  - 'A declared-but-unread slot is not an override escape hatch. The hatch requires a consumer rule; without one the declaration is an advertised control with no wire behind it. This is the premise the audit measures.'
  - 'Remediation-free: no contract, codegen source, emitter or generated artifact changes.'
acceptance:
  - id: A1
    given: 'A shadowed slot (author root rule overrides the box-model primitive).'
    when: 'The dead-slot audit runs.'
    then: 'It appears in the ledger with disposition shadowed and is excluded from the defect count.'
  - id: A2
    given: 'The audit output.'
    when: 'A reader inspects the headline.'
    then: 'Inert total, defect count and inert-by-design count are reported separately, so neither is inferable only by subtraction.'
  - id: A3
    given: 'A shadowed slot removed from the ledger.'
    when: 'The audit runs.'
    then: 'It fails as unledgered — proving inert-by-design slots are genuinely accounted for rather than exempt from the ratchet.'
