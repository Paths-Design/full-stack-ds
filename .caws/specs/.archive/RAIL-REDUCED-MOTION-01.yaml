    command: "pnpm run audit:motion-realization"
    exit_code: 0
  - criterion_id: A2
    status: pass
    evidence_ref: "contract.motion is typed as ContractMotion (was unknown), projected by buildMotion into MotionIR on ComponentIR, and lowered once in css.ts#reducedMotionBlock. All five web families share emitCss, so one seam reaches every target: 17 components per target now carry a derived @media (prefers-reduced-motion: reduce) block (react/vue/svelte/lit/angular all 17; react also shows Popover before its region was retired). The selector list is derived from the emitted declarations, and declarations that name an animating property while switching it off (animation: none on Skeleton --wipe/--none) are excluded, so the block names 4 selectors for Skeleton rather than 6. Honouring is opt-out (honorsReducedMotion = reducedMotion !== 'ignore'), which is why Button/Details/Skeleton/Spinner are covered despite declaring no motion block at all. governed:rail overall pass; typecheck:all 0 errors."
    recorded_at: "2026-09-01T20:12:59.093Z"
    command: pnpm run generate -- --target=all
    exit_code: 0
  - criterion_id: A3
    status: pass
    evidence_ref: "REDUCED_MOTION_UNHONOURED is 0 across the corpus: every component whose emitted CSS animates and whose contract does not say ignore now carries a derived block. Popover's hand-authored region is retired — its min/max-width, contain, and enter animation come from Popover.styles.json plus a new contract keyframes block, with the hardcoded 200ms and cubic-bezier(0.34,1.56,0.64,1) replaced by core.motion.duration.short and core.motion.easing.emphasizedOut, the two tokens its own contract declared. Verified per target: popover-enter keyframes present and custom region empty in all five (react/vue/svelte/lit/angular). audit:custom-regions source occupancy 1 -> 0, findings=78 (ledgered=78) unledgered=0 stale=0. Stated visual change: the token easing has no overshoot, so the entrance no longer bounces."
    recorded_at: "2026-09-01T20:13:09.723Z"
    command: "pnpm run audit:motion-realization && pnpm run audit:custom-regions"
    exit_code: 0
  - criterion_id: A4
    status: pass
    evidence_ref: "Live falsification on the real tree: deleting the derived @generated:start reduced-motion region from packages/ds-react/src/components/Skeleton/Skeleton.css produced 'REDUCED_MOTION_UNHONOURED: 1 - Skeleton: css animates with no prefers-reduced-motion block', findings=50 unledgered=1, exit 1; restoring returned 49/49/0/0 exit 0. The dangling-easing half was exercised for real rather than synthetically: Select's two refs WERE dangling and the rail named them before repair. selfcheck 16/16, four pinning the self-answering-question trap — the neutralising block sets animation-duration, so without stripReducedMotion every honouring component would read as animating AND have the block, making REDUCED_MOTION_UNHONOURED unreachable; one check asserts the block alone does not read as animation, one that stripping removes the whole media block rather than its first rule, one that keyframe-declared properties count as realized, one that properties inside the block do not."
    recorded_at: "2026-09-01T20:13:20.692Z"
