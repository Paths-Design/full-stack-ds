invariants:
  - 'Every contract slot (in *.tokens.json and *.styles.json) that declares resolvesTo MUST also declare fallback. The codegen emits var(--ref, fallback) only when fallback is present; without it the property silently drops to its initial value if the referenced token is ever absent. The validator enforces this as a hard error in generate:check ([FALLBACK_MISSING]).'
  - 'The fallback value is the REAL resolved value from the composed token graph, not a guessed literal — so a component renders identically with tokens.css loaded (via the ref) or absent (via the fallback). This is the QDS universal-fallback discipline, enforced once at the contract layer rather than hoped-for per variant.'
  - 'The dead-slot audit classifies every declared slot as consumed or dead by scanning the generated ds-react CSS for var(--slug) references, EXCLUDING the declaration site (tokens.css) so a slot cannot consume itself. Read-only and advisory this slice (mirrors pseudo-state-audit posture); not a CI gate yet.'
  - 'The iconography emission ledger gate runs in CI (after the six-tree drift diff) and in pre-push (gated on the iconography scope flag). It fails naming missing/stale edges when the committed emission-ledger.json diverges from a fresh regeneration. The pre-push classifier recognizes both packages/ds-iconography/ and packages/ds-react-native/ (closing the latent RN gap the hook comment warned about).'
  - 'Every generated component root across react/vue/svelte/angular/lit carries data-fsds-component=cssPrefix for audit/devtools discoverability. For react/vue/svelte this is a template attribute on the root element; for lit/angular it is a HOST-side attribute (Lit static host attribute / Angular host: decorator) so it is visible from the light DOM outside shadow encapsulation. This is identification only — it does NOT change any CSS selector or cascade behavior.'
  - 'No emitter branches on a component name to produce data-fsds-component; the value comes from ir.cssPrefix (the same IR fact that namespaces every --fsds-<prefix>-* slot). Per-emitter spelling mirrors the existing data-fsds-icon precedent (5 framework-specific attribute syntaxes).'
  - 'The CSS collision concern (component CSS is unlayered; consuming-app CSS can override at equal specificity) is RECORDED as a non-claim in the snapshot with two fix options (@layer fsds-components wrapping vs selector-prefixing) but NOT acted on in this slice. The data-fsds-component attribute added here is a prerequisite for any future selector-prefixing fix, not a fix itself.'
acceptance:
  - id: A1
    given: 'a contract token/style slot with resolvesTo but no fallback'
    when: 'generate:check runs'
    then: 'a [FALLBACK_MISSING] issue is emitted for that slot and the check fails'
  - id: A2
    given: 'the repaired corpus where every resolvesTo slot carries a fallback'
    when: 'generate:check runs'
    then: 'zero [FALLBACK_MISSING] issues and the check passes'
  - id: A3
    given: 'the post-repair contract corpus'
    when: 'the dead-slot audit runs'
    then: 'a dead-slot-matrix.{json,md} is produced classifying every declared slot as consumed or dead'
  - id: A4
    given: 'CI/pre-push after the iconography ledger gate is wired'
    when: 'the iconography emission ledger drifts from a fresh regeneration'
    then: 'CI/pre-push fails naming the missing/stale edges'
  - id: A5
    given: 'any generated component across react/vue/svelte/angular/lit'
    when: 'the component renders'
    then: 'the root element carries data-fsds-component=cssPrefix visible from the light DOM (host-side for lit/angular)'
