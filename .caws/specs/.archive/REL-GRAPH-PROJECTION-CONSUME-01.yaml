evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "MILESTONE 1 EXIT CRITERION, met and scoped. The graph path now reaches the enumerator: enumerateGraph takes {graph, task, inventory} where `graph` is a denoted GraphResult and NOT a GraphBinding, so the projection layer cannot re-resolve a source relation, re-select a population, or consult a second declaration - the exit criterion is structural rather than promised, and a test asserts the input surface is exactly those three keys and that no retained program carries `operation` or `binding`. GraphProgram assigns channels to the NODE population and the INCIDENCE and makes no magnitude claim, so it is a distinct program shape rather than a relation-shaped object wearing a graph name. topology moves from notEnumerated to implemented FOR THIS PATH: inducedGraphClaims yields incidence-recoverable from a connection channel and partition-membership from the node channel, the task requires the former, and the retained set is non-empty with every retained program at coordinate non-metric. The RELATION path still admits nothing for topology, now asserted directly (a relation-shaped operation induces no incidence claim) rather than by the not-implemented count, which moved 8 -> 7. THE DOMAIN RESTRICTION IS EXPLICIT: a coordinate other than non-metric is EXCLUDED rather than refused, because a topology projection must not make a positional claim, and the population counters (considered/excluded/disposed) keep outside-the-declared-domain distinct from illegal - an exhausted or restricted search must not read as no lawful projection. Both graph universes pass through the SAME enumerator and differ only in the graph they display. Verification: pnpm exec vitest run packages/ds-codegen/src/analytical (22 files / 957 tests), pnpm test (303 files / 4178 tests), typecheck, lint, docs:check-claims, governed:rail, test:frameworks, analytical:check-schemas, analytical:check-baseline (conserved) and analytical:freeze:check (160 erasures / 126 verdicts) all green on merge 1ac770bf, with NO ledger re-record. NON-CLAIMS: this is not a complete topology algebra, implements no layout, and does not establish that every topology candidate is enumerated; the graph-valued result now reaches the projection layer but projection enumeration for graphs is not claimed complete."
    recorded_at: "2026-09-18T17:47:17.614Z"
  - criterion_id: A2
    status: pass
    evidence_ref: "TWO M1 EVIDENCE GAPS CLOSED, and one left open explicitly. MISSING VERSUS EXPLICITLY EMPTY: empty node and edge arrays together DENOTE AN EMPTY GRAPH (nodes [], edges [], isolates []), while an explicitly empty node population beside a non-empty edge relation is a CONTRADICTION and is REFUSED under \"does not contain\" rather than carried - the two are asserted to be different kinds and only the missing case had a test before. THE METADATA-PRESERVING BINDING MUTANT: for each parsed view the result is compared against the population the binding NAMES, read independently from the authored rows, and against the reported `selected` relation - so an implementation that always read one relation while descriptive metadata still named the declared one is detectable, which an outcome-only check would pass. The two populations are asserted to genuinely differ (three nodes against two) so the check has teeth. STILL OPEN AND NOT IMPLIED BY THIS SLICE: necessity/accounting for the graph-view coordinates (nodes.relation, nodes.keyField, edges.fromField, edges.toField, the view id) - the family has an identity and a drift-gated schema, but no necessity witness and no disposition, and schema acceptance is not necessity. That is the remaining M1 item and it is recorded as such rather than implied satisfied."
    recorded_at: "2026-09-18T17:47:18.100Z"