id: FIX-DEAD-SLOT-VARIANT-REPOINT-01
title: 'Re-point orphaned variant leaf slots so the variant block consumes them'
risk_tier: 2
mode: fix
lifecycle_state: archived
resolution: superseded
closure_notes: 'Repair verified correct and value-identical but invisible to the audit: the leaf read lands in tokens.css, which the consumption scan excludes wholesale. Blocked on the consumption-definition fix; re-open after.'
created_at: '2026-07-29T16:39:48.463Z'
updated_at: '2026-11-05T23:02:30.740Z'
blast_radius:
  modules:
    - 'packages/ds-contracts/components/*/*.styles.json (one resolvesTo edit per orphaned leaf)'
    - 'packages/ds-{react,vue,svelte,angular,lit,react-native}/src + ds-figma-plugin (regenerated)'
    - 'scripts/dead-slot-audit/known-dead.json (ledger shrinks by the burned entries)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-contracts/components'
    - 'scripts/dead-slot-audit'
    - 'docs/dead-slot-audit'
    - 'packages/ds-react/src'
    - 'packages/ds-vue/src'
    - 'packages/ds-svelte/src'
    - 'packages/ds-angular/src'
    - 'packages/ds-lit/src'
    - 'packages/ds-figma-plugin/src'
    - 'packages/ds-react-native/src'
  out: []
invariants:
  - 'Every edit is value-identical: the variant block already redefines the sibling with byte-identical {resolvesTo, fallback} to the orphaned leaf, so routing through the leaf adds a var() hop and changes no computed value.'
  - 'Only entries the classifier marked `repoint` are touched. `repoint-divergent` (values differ) is excluded by construction — re-pointing there WOULD change rendered output, and batching one as a no-op is the defect this split exists to prevent.'
  - 'The proof of no-op is the emitted CSS: for each edited slot the consuming declaration must differ only by the added indirection, with the same terminal token and the same fallback literal.'
  - 'The ledger shrinks by exactly the burned entries, with no stale and no unledgered; the inert total drops by the same number.'
acceptance:
  - id: A1
    given: 'A leaf slot orphaned by a variant block that redefines a sibling with identical values.'
    when: 'The block is re-pointed at the leaf and the corpus is regenerated.'
    then: 'The dead-slot audit reports the leaf as consumed.'
  - id: A2
    given: 'Each re-pointed slot.'
    when: 'The emitted CSS is compared before and after.'
    then: 'The declaration differs only by the added var() indirection, resolving to the same terminal token with the same fallback literal — no computed value changes.'
  - id: A3
    given: 'Slots classified repoint-divergent.'
    when: 'This slice runs.'
    then: 'None are touched, and they remain ledgered for individual adjudication.'
  - id: A4
    given: 'The completed slice.'
    when: 'The full gate battery runs.'
    then: 'All three rails, generate:check, governed:rail and the test suites are green, and regenerated bytes are committed.'
non_functional: {}
contracts:
  - name: 'repoint-value-identity'
    type: contract-test
    path: 'scripts/dead-slot-audit/disposition.test.mjs'
