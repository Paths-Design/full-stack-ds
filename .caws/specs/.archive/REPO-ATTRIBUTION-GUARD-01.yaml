    evidence_ref: "Reproduce: node --test scripts/attribution-guard.test.mjs (17/17 pass). Cited node test: \"a clean commit goes through — the hook is not a blanket refusal\" — asserts a real clean commit exits 0 and rev-list count is 1. Paired with \"an obviously clean message passes\" for the admitted direction and \"an unknown address is STILL refused\" for the default-deny direction. Landed-revision scan: node scripts/attribution-guard.mjs --range origin/main..main exits 0 over 10 commits; that range excludes the three grandfathered Qwen-Coder commits by construction because they predate origin/main, which is the intended behavior, while a full-history scan flags exactly 3."
