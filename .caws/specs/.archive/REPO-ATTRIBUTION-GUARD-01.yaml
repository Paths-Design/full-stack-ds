    commit_sha: "6645e4a0"
  - criterion_id: A3
    status: pass
    evidence_ref: "Reproduce: node --test scripts/attribution-guard.test.mjs (17/17 pass). Cited node test: \"git commit is REFUSED when the message carries an agent co-author trailer\" — asserts non-zero exit, /attribution-guard/ on stderr, and rev-list --count --all == 0, so nothing entered history. Companion case \"the commit-msg hook is present and executable\" asserts the executable bit, which is what makes the refusal meaningful because git silently skips a non-executable hook. Live in the canonical checkout: git hook run commit-msg -- <message file carrying a Claude trailer> exits 1 with the refusal text; the identical command on a clean message exits 0."
    recorded_at: "2026-09-23T01:20:50.415Z"
    artifact_path: .githooks/commit-msg
