invariants:
  - >-
    background.inverse flips per theme (mode.dark in light, mode.light in dark),
    so its paired label must flip the OPPOSITE way. foreground.inverse is
    deliberately light in BOTH modes — its own $description says it is for the
    label inside colored action surfaces and is NOT the inverse of
    foreground.primary. Pairing it with background.inverse yields light-on-light
    in dark mode.
  - >-
    The fix adds the missing token rather than redefining foreground.inverse.
    Action surfaces (primary/danger buttons) keep their hue across themes and
    genuinely need a label that stays light; changing that token would break them
    to fix the tooltip.
  - >-
    This defect was UNOBSERVABLE before FIX-SURFACE-PART-CLASS-01: the tooltip's
    colours were authored against a selector that matched nothing, so the wrong
    pairing rendered as no pairing. Making styles apply is what surfaced it.
acceptance:
  - id: A1
    given: 'An open Tooltip in the dark-mode showcase'
    when: 'its content element is measured in Chromium'
    then: >-
      computed color and background-color differ and meet WCAG AA for body text;
      measured contrast ratio reported, not asserted by eye.
  - id: A2
    given: 'foreground.onInverse'
    when: 'the token graph is built'
    then: >-
      it resolves to mode.light in the light theme and mode.dark in the dark
      theme — the mirror of background.inverse — and carries a $description
      stating the pairing so the next author does not repeat the mistake.
  - id: A3
    given: 'foreground.inverse and every existing consumer of it'
    when: 'this slice lands'
    then: >-
      foreground.inverse is UNCHANGED and its action-surface consumers
      (primary/danger Button labels) render identically; enumerated, not assumed.
  - id: A4
    given: 'The contrast gate'
    when: 'tokens:check-contrast runs'
    then: >-
      the new pairing is added to the curated pairs so a future re-point of
      either side fails the gate rather than silently going invisible again.
