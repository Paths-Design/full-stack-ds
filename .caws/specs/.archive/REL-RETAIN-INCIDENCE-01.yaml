    evidence_ref: "THE ACCEPTANCE CRITERION WAS NOT MET, DELIBERATELY, AND THE REFUSAL IS THE RESULT. The spec was written to adjudicate relation.derivedBy.nest.levels#incidence as required-derived-vocabulary under the retention policy text. Applying it exposed that the policy text stated only ONE of retention's two clauses: candidacy (an independently grounded cause requires a distinction that becomes unexpressible when exactly that coordinate is erased -- which this coordinate satisfies: CASE_NESTED_SUBTOTALS_OFF_GRAIN is a committed corpus case and round 25's pair is the measured separation) vs admission (what final-quotient's close condition 4 actually enforces: the retained verdict must name, in derivableFrom, at least one LIVE RETAINED coordinate carrying the same content -- invariant 17's factoring, which is why relation.derivedBy.kind is retained from its 21 member pairs and relation.derivedBy.join.cardinality from its 6). nest.levels#incidence satisfies candidacy and fails admission: nothing the kernel retains carries its content, so the applied verdict was refused by the close condition by name and REVERTED -- the coordinate stays unresolved, the suite is green at 862, and no measured value moved. What DID land is the defect repair and the consequence: the policy text now states both clauses and their relation, and both docs record that the three structurally-unwitnessable coordinates (nest.levels#incidence, toGrain#incidence, peers[]#present) have NO terminal class -- witnessed is measured impossible (round 38/39), representation-artifact is false (the distinction is real and oracle-separated), not-yet-admitted would remove a real distinction from the kernel, and retention refuses them -- while obligation 8 admits only non-primitive, non-interaction, adjudicated dependencies. That is a vocabulary decision (remove, re-earn at a later stage, or name a sixth accounting mode) and it is now the last structural blocker on closing the subtraction, stated with its evidence rather than worked around by stretching a disposition. Merge a0a69506; no ledger artifact was written by this spec."
