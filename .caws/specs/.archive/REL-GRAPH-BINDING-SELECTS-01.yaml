evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "THE SELECTION CONTROL, measured into packages/ds-contracts/analytical-fixtures/graph-experiment.json and byte-compared by the test. ONE source holds two candidate node universes and one edge relation: allNodes {n1,n2,n3}, connectedSet {n1,n2}, links {(n1,n2)}. Changing ONLY the binding changes the denoted graph - selectionChanged true, byAllNodes selects [n1,n2,n3] with isolates [n3] and byConnectedSet selects [n1,n2] with no isolate - while edgeRelationIdentical is true and the source rows are unchanged. The preset-array entry point is REMOVED: `evaluateGraph(binding, rows)` no longer exists, `denoteGraph` takes a GraphSource whose rows are keyed by relation NAME, and `selected` reports which relations the binding chose, so a caller cannot pair a binding with an independently preselected arrangement. Both bindings preserve through both produced representations (relational readback and incidence output, the isolate present with an EMPTY incident list), and the node-from-edges counterexample still collapses the pair (distinguishesThePair false). QUALIFICATION, each recorded as its refusal text: `allNodes.label` RESOLVES but is not the relation declared key, so it is refused as an identity rather than accepted; an endpoint `n9` outside the SELECTED universe is refused rather than silently dropped from the incidence; and a MISSING population is CARRIED under invariant:population-declared rather than becoming a silently empty node list, with graphPreservation refusing outright because the binding does not denote a graph. The node-universe-is-the-edge-relation case remains refused. THE DECODER COLLISION, repaired: deduplicating by joined endpoint text mapped (\"a->b\",\"c\") and (\"a\",\"b->c\") to the same key and dropped one edge; the key is now an ordered JSON-encoded pair and bothSurvive is true with both edges recovered. THE MUTATION now moves the PRODUCED incidence output directly through `renameInOutput` rather than re-encoding a mutated result: the entry becomes n3-impostor, countAndEdgesUnchanged is true and detected is true. Verification: pnpm exec vitest run packages/ds-codegen/src/analytical (22 files / 945 tests), pnpm test (303 files / 4166 tests), typecheck, lint, docs:check-claims, governed:rail and test:frameworks green on merge. NON-CLAIMS: no canonical-model integration (the zod model, schema emission and stage-2 ledgers are untouched, and authorityGap.declaresANodeRelation stays false); the graph tests construct the source directly and do not invoke the analytical judge; one source, two bindings, two representations and one mutation, with no layouts, general graph algorithms, multigraph support, accessibility or combinators."
    recorded_at: "2026-09-18T05:27:19.717Z"