invariants:
  - 'A ledger note states only what the classifier actually verified. An evidence string that asserts an unperformed check is a defect equal to a wrong disposition, because downstream slices act on the note.'
  - 'Realization and suppression are independent obligations: a state dimension may be realized (a :disabled block exists) while its declared suppresses contract is simultaneously violated. The suppression rail must therefore be a separate axis, not a refinement of the pseudo-state audit.'
  - 'A reported leak distinguishes reachable from unreachable: on a native form-control root, :focus-visible and :active cannot match a natively-disabled element, so only :hover leaks are live. Reporting unreachable leaks with equal weight would make the rail noise and get it ignored.'
  - 'This slice is remediation-free: it changes no contract, no codegen source, no emitter, and no generated artifact.'
acceptance:
  - id: A1
    given: 'A dead slot that IS redefined by a block named for its axis value but read by no rule.'
    when: 'The dead-slot classifier runs.'
    then: 'It reports disposition unconsumed-vocabulary, and no ledger note claims a block check the code did not perform.'
  - id: A2
    given: 'A contract declaring availability.suppresses.categories including interaction, whose CSS sets an interaction property never reset in the disabled block and never guarded.'
    when: 'The state-suppression rail runs.'
    then: 'It reports the leak with the pseudo, the property, and whether the leak is reachable on that root element.'
  - id: A3
    given: 'A fabricated unledgered leak, and separately a fabricated stale ledger entry.'
    when: 'The rail runs.'
    then: 'Each independently exits non-zero, proven by a falsification probe.'
  - id: A4
    given: 'The corpus as committed, with the suppression ledger seeded at the measured counts.'
    when: 'The rail runs via its pnpm script.'
    then: 'It exits zero with no unledgered and no stale entries, and is wired into pre-push and CI.'
  - id: A5
    given: 'The completed slice.'
    when: 'The full gate battery runs.'
    then: 'generate:check, governed:rail and the test suites are green and no generated bytes changed.'
non_functional: {}
contracts:
