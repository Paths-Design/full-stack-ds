id: RAIL-STYLING-REALIZATION-LEDGERS-01
title: 'Two-directional ledger ratchet for the dead-slot and pseudo-state audits, gated at pre-push'
risk_tier: 2
mode: feature
lifecycle_state: archived
resolution: completed
closure_notes: 'Auto-closed by caws worktree merge s1-ledgers at 274edb4a18b9c8efa22e3b3189820fddba4fd628'
created_at: '2026-07-28T23:26:23.709Z'
updated_at: '2026-11-05T23:05:51.661Z'
blast_radius:
  modules:
    - 'scripts/dead-slot-audit (ratchet, selfcheck, disposition classifier, ledger)'
    - 'scripts/pseudo-state-audit (ratchet, selfcheck, ledger)'
    - '.githooks/pre-push + scripts/prepush-scope.mjs (gate of record)'
    - '.github/workflows/ci.yml (secondary gate)'
    - 'docs/{dead-slot,pseudo-state}-audit matrices (regenerated report output)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'scripts/dead-slot-audit'
    - 'scripts/pseudo-state-audit'
    - 'scripts/prepush-scope.mjs'
    - '.githooks'
    - '.github/workflows/ci.yml'
    - 'package.json'
    - 'docs/dead-slot-audit'
    - 'docs/pseudo-state-audit'
    - 'docs/current-implementation-snapshot.md'
    - scripts/lib
    - scripts/prepush-scope.test.mjs
  out: []
invariants:
  - 'The ledger only shrinks truthfully: the audit fails if any current finding is absent from the ledger (unledgered) OR any ledger entry no longer reproduces (stale). Neither direction may be waived.'
  - 'This slice is remediation-free: it changes no contract, no codegen source, no emitter, and no generated artifact. Counts move only because classification is corrected, never because a defect was silently reclassified away.'
  - 'Consumption is scanned only in the structure CSS. The dead-slot scan must NOT be widened to <C>.tokens.css: a slot redefinition is not a consumption, and admitting it would mass-false-green the entire re-point defect class.'
  - 'Every ledger entry names its owning downstream spec and records why the declaration exists; an entry no one can justify is a deletion candidate, not a permanent resident.'
  - 'The gate of record is .githooks/pre-push; ci.yml is a secondary path. prepush-scope.mjs and the hook are updated in lockstep.'
acceptance:
  - id: A1
    given: 'A fabricated finding that is absent from the committed ledger.'
    when: 'The audit runs.'
    then: 'It reports the finding as unledgered and exits non-zero.'
  - id: A2
    given: 'A fabricated ledger entry that no longer reproduces against the corpus.'
    when: 'The audit runs.'
    then: 'It reports the entry as stale and exits non-zero.'
  - id: A3
    given: 'The corpus as committed on main, with both ledgers seeded at the measured counts.'
    when: 'Both audits run.'
    then: 'Both exit zero with no unledgered and no stale entries.'
  - id: A4
    given: 'A dead slot in any of the taxonomy families.'
    when: 'The dead-slot audit runs.'
    then: 'It emits a machine-computed disposition for that slot, and the classifier is unit-tested on one fixture per disposition.'
  - id: A5
    given: 'A push touching contracts, generated React CSS, or either audit directory.'
    when: 'The pre-push hook runs.'
    then: 'Both audits execute via their pnpm scripts; the full gate battery is green and no generated bytes changed in this slice.'
non_functional: {}
contracts:
  - name: 'styling-ledger-ratchet'
    type: contract-test
    path: 'scripts/dead-slot-audit/selfcheck.mjs'
