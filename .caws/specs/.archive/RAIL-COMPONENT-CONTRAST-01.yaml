title: 'Component-derived WCAG contrast gate in the pre-emission semantics rail'
risk_tier: 2
mode: feature
lifecycle_state: archived
resolution: completed
closure_notes: 'component-derived WCAG contrast gate landed in generate:check and governed:rail pre-emission; 6 pair identities ledgered under a two-directional ratchet'
created_at: '2026-08-15T01:10:52.910Z'
updated_at: '2026-11-05T23:05:37.503Z'
blast_radius:
  modules:
    - 'packages/ds-codegen/src/validation (new component-contrast validator + tests)'
    - 'packages/ds-codegen/src/cli.ts (semantic drift pass gains the new validator)'
    - 'root package.json (governed:rail scripts gain a pre-emission generate:check)'
