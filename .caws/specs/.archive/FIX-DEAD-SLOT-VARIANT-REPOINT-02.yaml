invariants:
  - 'Every edit is value-identical: the variant block already redefines the sibling with byte-identical {resolvesTo, fallback} to the orphaned leaf, so routing through the leaf adds one var() hop and changes no computed value. The repair script re-asserts this per edit and refuses anything that is not.'
  - 'Only entries the classifier marks `repoint` are touched. `repoint-divergent` would change rendered output and is excluded by construction.'
  - 'Proof of no-op is the emitted CSS, not the intent: each affected declaration must differ ONLY by the added indirection, terminating at the same token with the same fallback literal.'
  - 'The predecessor attempt (FIX-DEAD-SLOT-VARIANT-REPOINT-01) was correct but unmeasurable — the leaf read lands in tokens.css, which the scan then excluded. That is fixed upstream, so this slice must now show the ledger actually shrink; if it does not, the repair is wrong rather than invisible.'
acceptance:
  - id: A1
    given: 'The 18 leaf slots the classifier marks `repoint`.'
    when: 'Each variant block is re-pointed at its leaf and the corpus is regenerated.'
    then: 'All 18 classify as consumed and leave the ledger.'
  - id: A2
    given: 'Each re-pointed declaration in the emitted CSS.'
    when: 'Before and after are compared.'
    then: 'The declaration differs only by the added var() indirection, resolving to the same terminal token with the same fallback literal.'
  - id: A3
    given: 'Slots classified repoint-divergent or any other disposition.'
    when: 'This slice runs.'
    then: 'None are touched and their ledger entries are unchanged.'
  - id: A4
    given: 'The completed slice.'
    when: 'The full gate battery runs.'
    then: 'All three rails, generate:check, governed:rail and the test suites are green, and regenerated bytes are committed in the same commit as the contract edits.'
