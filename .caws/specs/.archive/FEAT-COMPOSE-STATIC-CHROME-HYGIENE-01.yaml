invariants:
  - 'The static-content emitter emits a slot resolution only when findLayeredSlot/findTokenSlot returns an actual scope value; the ?? "" empty-key sentinel is removed from the emitter.'
  - 'Chrome role classification is a single corpus-derived grammar (regex over slot names covering both .primary and .default foreground patterns), validated by the usage-parity ratchet - never per-component names.'
  - 'Content-color propagation is foundation-only (a LocalFsdsContentColor CompositionLocal in the tokens runtime), never a material3 import in generated code.'
  - 'The usage ratchet is two-directional like the set ratchet: RN-consumed chrome slots must be consumed in Compose emission, and Compose lookups must reference existing scope keys (no dead names).'
  - 'Modifier ordering: exactly one modifier parameter, first optional, forwarded unchanged (append-only internal chains).'
acceptance:
  - id: A1
    given: 'the static-content emitter'
    when: 'it lowers any admitted component'
    then: 'every chrome slot resolution is gated on the slot existing in the IR token scopes - zero layeredSlot("")/empty-key lookups across the generated batch, and the unused contentColor val is either consumed or omitted.'
  - id: A2
    given: 'the corpus slot grammar'
    when: 'the emitter classifies chrome roles (background/foreground/radius/padding/min-height)'
    then: 'the classification matches the actual slot-name patterns of the corpus (foreground .primary and .default, background .default, size.radius, box-model.*) and the extended scripts/compose-parity-diff.mjs usage ratchet passes for all 16 admitted components: every chrome-role slot the RN <Name>.styles.ts consumes appears as a consumed lookup in the emitted Compose file, and no emitted lookup references a key absent from the component token scopes.'
  - id: A3
    given: 'a static component carrying a classified foreground slot'
    when: 'the composable emits'
    then: 'the resolved foreground is applied to the content via a foundation-only LocalFsdsContentColor CompositionLocalProvider, zero androidx.compose.material imports in generated code - mirroring swift foregroundStyle and RN color usage.'
  - id: A4
    given: 'every generated component signature'
    when: 'inspected'
    then: 'modifier: Modifier = Modifier is the first optional parameter per the AOSP Compose API guideline across all 16 admitted components (native-toggle, projected-children, static-content), verified by a mechanical signature check.'
  - id: A5
    given: 'the hand-authored substrate'
    when: 'the slice lands'
    then: 'FsdsButtonStyle/FsdsToggleStyle/ComponentTokenDefinition are @Immutable, FsdsButton/FsdsToggle apply Modifier.minimumInteractiveComponentSize() for touch targets with visual sizing staying token-driven, and the gradle library plus settings example lane compile green.'
  - id: A6
    given: 'the whole batch'
    when: 'regenerated and gated'
    then: 'pnpm run governed:rail, pnpm test, pnpm run test:frameworks, and node scripts/compose-parity-diff.mjs all pass and the generated trees are committed.'
