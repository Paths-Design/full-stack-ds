invariants:
  - "The mirror is a LAW fact declared on the operand map and read where every other operand fact is read: the executor never hardcodes which result slot an operand mirrors, and the pool is the mirror list itself -- so the image satisfies the law's equation by construction rather than by searching the input's namespace."
  - "The mirror rebind is the identity on every declaration that already satisfies the equation, which the corpus proves holds throughout: the three coordinates leave never-discharged as corpus-dead, and the structural fact is recorded -- no two admissible fixtures can differ only in the mirrored operand, because the law slaves it to the other side."
  - "The arity facet of a mirrored slot truncates to the mirror's length (a runtime fact) instead of the static minItems floor, and wouldChange answers by comparison there; names are preserved when truncating, so an arity erasure never rewrites occupants."
  - "Both authorities moving means the freeze is superseded with authored effects for both classes, and the pins that named the old refusals are corrected rather than deleted."
