    evidence_ref: "Executed each of the 24 closure-dependency erasures over the committed 208-specimen population (corpus 90, stimuli 22, synthesized 96). Result: 23 of them collide at least one pair of specimens that differ before the erasure -- so none is in the report's unseparated list, the instrument reaches them -- and ZERO have a collided pair whose oracle outcomes differ; every oracle-bound collided pair carries the same status, codes and terms on both sides. Hence no witness is constructible and no verdict exists that this corpus supports, which is why they stay unresolved rather than being filed as not-yet-admitted or representation-artifact to unblock the gate. The 24th, field.additivity.semi-additive.nonAdditiveAlong#incidence, is primitive: removals.json leafMap maps the removed stage-1 leaf nonAdditiveAlong onto it, so it was re-earned at stage 1 and is decided against the two additivity closures (composite constructor and payload under this encoding). closure.test.ts pins both halves against the live gate result rather than a hardcoded list, with a non-vacuity guard, so a corpus case that makes any of them witnessable fails the pin. Non-claim: this measures witnessability on the COMMITTED population only -- it is not a claim that these coordinates are representation artifacts or semantically empty, and it does not adjudicate, ratify or remove any coordinate; the gate is correctly still red."
