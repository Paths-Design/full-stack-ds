invariants:
  - 'A JUDGMENT IS ONLY AS STRONG AS THE PATH THAT PRODUCES IT. The composer must consume the SAME classification the enumerator does, over the same request premises. A weaker helper answering "no unmet premise" is not permission; it is a smaller question.'
  - 'PREMISES TRAVEL WITH THE OPERAND. A composition partition supplied only to the enumerator cannot be recovered by a later reader from the program, and re-reading the source grain does not recover the analytical choice that was made.'
  - 'A SUMMARY MAY NOT DESTROY WHAT ITS PARENT MUST DECIDE ON. Collapsing several operands to one representative unit is legitimate only after compatibility across the relevant scope is established, and a missing fact must never become "whichever value was encountered first".'
  - 'AN INTERVENTION MUST REACH THE THING IT CLAIMS TO TEST. A control that changes a directory the search never reads demonstrates repeatability, not independence; the removal has to happen in the environment the DEFAULT loader actually consults, and a deliberately dependent mutant must fail the control.'
acceptance:
  - id: A1
    given: 'One atomic request in each of three regimes, presented to both consumers.'
    when: 'Both dispositions are read and compared.'
    then: 'given one atomic request under each of the omitted-partition, forbidden-partition and keyed-channel regimes; when it goes through the enumerator and through the composite part-reader; then both report the SAME disposition and the composer cannot certify what enumeration withholds'
  - id: A2
    given: 'An atomic operand and the premises its judgment depends on.'
    when: 'The carrier is inspected.'
    then: 'given an atomic operand; when it is presented to a composer; then the task-relevant premises its judgment depends on travel with it rather than being supplied separately by only one of the two consumers'
  - id: A3
    given: 'A shared facet over a kg panel and a seconds panel, layered with a kg annotation, in both panel orders.'
    when: 'Each is judged.'
    then: 'given a shared facet over a commensurable kg panel and an INCOMMENSURABLE seconds panel; when it is layered with a kg annotation; then it is refused under the shared-scale dimensional rule, and reversing the panel order does not change that'
  - id: A4
    given: 'A shared facet over two commensurable panels, layered.'
    when: 'It is judged.'
    then: 'given a shared facet over two commensurable panels; when it is layered; then it remains retained, so the correction does not refuse lawful nesting'
  - id: A5
    given: 'A missing unit, an established incompatibility, and a free-scale scope, each reaching a parent.'
    when: 'Each is judged.'
    then: 'given a MISSING unit and an established incompatibility; when each reaches a parent; then the two remain distinguishable, and a free-scale scope is not rejected merely for not being shared'
  - id: A6
    given: 'An isolated environment whose default alias loader sees a removed or changed layer.'
    when: 'The search and the default catalogue path both run, and a dependent mutant is introduced.'
    then: 'given an environment in which the DEFAULT alias loader encounters a removed or changed layer; when the search runs; then its normalized outcome is identical while the default catalogue path fails or changes, and a deliberately alias-dependent search mutant FAILS that control'
  - id: A7
    given: 'Regions whose candidates are refused, undecided, unsupported, or a mixture.'
    when: 'The catalogue is generated and its reasons read.'
    then: 'given a region no retained program satisfies; when the catalogue reports it; then the enumeration''s own support, refusal and obligation evidence is preserved rather than flattened to one reason, and a region mixing refused and undecided candidates keeps both'
non_functional: {}
