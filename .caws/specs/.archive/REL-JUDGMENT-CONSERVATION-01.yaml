closure_notes: 'All seven criteria carry evidence: the composer consumes the validated atomic request, scale compatibility is computed over every relevant pair, the alias control reaches the environment the search uses with a mutant that fails it, and the catalogue keeps the enumeration''s own support, refusal and obligation evidence.'
