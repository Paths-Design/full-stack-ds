    status: pass
    evidence_ref: "Prototyped and measured a resolution-preserving incidence quotient for bound references. THE PROBLEM (round 25): the census's incidence erasure rewrites a reference's names to reserved tokens, which is a legal QUOTIENT image but not a legal DECLARATION, so for a reference the derivation boundary must RESOLVE the boundary reports REL_DERIVATION_INPUT_MISSING or REL_DERIVATION_RESULT_NOT_DERIVABLE, checkIsolation refuses it, and no witness can be admitted. Eighteen coordinates are in that position and every route to closing the closure gate passes through them. THE CANDIDATE: canonical REBINDING -- replace the slot's names with the operand's OWN first k declared names (a relation-valued operand ranges over the structure's relations, a field-valued one over the input relation's fields). The image resolves because the names are declared, arity is preserved, and every pair of stimuli differing only in WHICH declared things the slot binds is identified. MEASURED over the twenty-one reference-topology coordinates at derivation operands: REACHES THIRTEEN -- aggregate-to-grain.from#incidence, bin.from#incidence, graph.edgeFrom#incidence, graph.from#incidence, graph.value#incidence, join.from#incidence, nest.from#incidence, nest.levels#arity, nest.levels#incidence, nest.levels#order, normalize.field#incidence, normalize.from#incidence, project.from#incidence. Every image is schema-valid (invalid-image = 0) and none introduces a boundary finding. It IDENTIFIES the pair C1f used to show the distinction is real: on FX_N_NESTED_SUBTOTAL_AT_PREFIX the images of levels=[country,state] and levels=[revenue,state] are canonically EQUAL, the a-side is byte-unchanged by the erasure, and neither side gains a finding. LEAVES EIGHT, each refused by REL_DERIVATION_RESULT_NOT_DERIVABLE and each named: aggregate-to-grain.toGrain#{arity,incidence,order}, bin.field#incidence, graph.edgeTo#incidence, join.with#incidence, project.keep#{arity,incidence}. THE DOMINANT CAUSE IS STRUCTURAL: for toGrain, keep, bin.field and edgeTo the law writes the SAME binding a second time in the RESULT's own declaration -- sameSet(out.grain, d.toGrain), sameSet(fieldNames(out), d.keep), the retained binned field -- so rebinding the operand alone leaves a declaration that no longer agrees with itself. The coordinate's extent is WIDER THAN ITS LOCATOR, and a quotient for those has to name both sides, which is a claim about where the coordinate LIVES and therefore a CENSUS change rather than an erasure change. That is the substrate answer this round produces: the binding quotient exists and is constructive for a majority of the family, and the residue is a locator question, not a corpus question. NON-CLAIMS: this is a MEASUREMENT, not a landed erasure -- census.ts, erasure-plan.ts and every ledger are untouched, so no verdict moved and the closure gate still reports 22 provisional and 21 unsettled dependencies; the partition is the candidate's, so the eight refusals are refusals BY THIS CANDIDATE and two of them (join.with, whose distinctness from join.from is a two-operand constraint, and graph.edgeTo) may yield to a smarter canonical rule rather than being structurally unreachable; canonical rebinding is also not claimed to be the ONLY resolution-preserving erasure, nor that its images are semantically well-motivated beyond being legal and identifying; and C1h runs the candidate as a local helper in the test, so the measurement is reproducible but not a production code path. C1h pins the reach set, the refusal set, the schema-validity of every image, the introduced code, and the pair. Verified by the analytical suite (19 files, 837 tests), the full root suite (301 files, 4058 tests), all eight analytical gates, docs:check-claims and docs:check-links."
