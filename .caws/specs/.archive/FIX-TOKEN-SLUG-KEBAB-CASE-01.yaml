invariants:
  - >-
    There is ONE authority for lowering a dotted token path to a CSS custom
    property name. Today there are two that disagree: tokenSlug
    (packages/ds-codegen/src/ir.ts) replaces dots and preserves casing, while
    tokenPathToCSSVar (packages/ds-tokens/build/core/index.ts) also kebab-cases.
    Both are documented in-file as the authority. Fixing one to match the other
    leaves the seam intact for the next divergence — the two must agree by
    construction, pinned by a test that fails if they disagree on any corpus path.
  - >-
    The population splits on whether repair preserves the rendered value, and the
    two halves are NOT batched together. 19 of 23 names resolve to exactly the
    fallback literal the property already renders, so repairing them restores the
    token chain with no visual change. The other 4
    (semantic.color.background.accentSubtle, foreground.linkHover,
    foreground.linkVisited, semantic.spacing.gap.gridSmall) resolve to
    theme- or density-varying values with no single fixed point, so repairing them
    changes what renders in dark mode — currently the fallback pins one value in
    every theme. That half needs visual review, not a rename.
  - >-
    The ledger only shrinks truthfully. Entries leave
    scripts/token-resolvability-audit/known-unresolvable.json only because the
    reference resolves, never because the audit stopped looking. The
    two-directional ratchet enforces both halves.
  - >-
    A codegen change without regeneration is drift. The emitter change and the
    regenerated bytes for all five web packages land in the same commit, or the
    rail's git-diff step fails on the next push.
acceptance:
  - id: A1
    given: 'A contract resolvesTo with a camelCase segment, e.g. semantic.shape.control.border.defaultWidth'
    when: 'codegen lowers it to a CSS custom property name'
    then: >-
      it emits --fsds-semantic-shape-control-border-default-width, byte-identical
      to what tokenPathToCSSVar produces for the same path. Pinned by a test that
      asserts the two functions agree across every resolvesTo in the corpus, so the
      seam cannot silently reopen.
  - id: A2
    given: 'The 19 value-preserving names in the ledger'
    when: 'the repair lands and all five web packages are regenerated'
    then: >-
      those ledger entries no longer reproduce and are deleted, the audit reports
      zero stale and zero unledgered, and e2e visual-regression snapshots do NOT
      move — a value-preserving repair that shifts a snapshot is a bug, not a
      success.
  - id: A3
    given: 'The 4 theme- or density-varying names'
    when: 'the repair lands'
    then: >-
      the dark-mode change is shown as runtime evidence (computed value before and
      after, in a real browser — JSDOM cannot resolve a var chain), and each is
      adjudicated explicitly rather than assumed correct because the name now
      resolves.
  - id: A4
    given: 'The whole ledger is burned down'
    when: 'audit:token-resolvability runs'
    then: >-
      it reports zero findings against an empty ledger, and the ledger file is
      deleted rather than left as an empty shell that reads as unfinished work.
non_functional: {}
contracts:
