invariants:
  - 'The swiftui primitive emitter derives every layout fact from PrimitiveIR (axisByVariant, axisModes, displayByMode keys, gap token identity); branching on hand-authored Stack lore instead of IR facts is a violation.'
  - 'Axis-mode gating mirrors the web doctrine (FIX-STACK-NATIVE-AXIS-LEAK-01): the flex axis applies only in axisModes modes; native layout renders a neutral container with no imposed spacing.'
  - 'The gap token''s concrete value is NOT invented by the emitter — spacing is a consumer-settable parameter; value projection arrives with the FsdsTheme module.'
  - 'Consumer-only changes to examples/settings/swift must not weaken its non-claims ledger; Stack replaces hand-rolled row containers where the spec mandates Stack.'
acceptance:
  - id: A1
    given: 'the Stack primitive contract and the swiftui emitter with emitPrimitives'
    when: 'pnpm run generate -- --target=swiftui Switch ToggleSwitch runs'
    then: 'Sources/DsSwiftUI/primitives/Stack.swift is emitted and swift build --package-path packages/ds-swiftui exits 0'
  - id: A2
    given: 'the emitted Stack'
    when: 'its source is inspected'
    then: 'the axis (VStack/HStack) derives from ir.axisByVariant, applies only in ir.axisModes modes, and the gap is exposed as a spacing parameter referencing the ir.gap token identity — no hand-authored layout lore in the emitter'
  - id: A3
    given: 'the settings swift lane'
    when: 'the Preferences rows are composed'
    then: 'they use DsSwiftUI.Stack for row layout and the example still compiles (consumer proof of the primitive)'
  - id: A4
    given: 'a mutation removing axis-mode gating'
    when: 'the swiftui primitive unit test runs'
    then: 'it fails (the native-layout no-spacing fact is pinned mutation-style)'
  - id: A5
    given: 'the full worktree gate'
    when: 'governed:rail, pnpm test, and test:frameworks run'
    then: 'all pass with no committed-tree drift outside packages/ds-swiftui'
non_functional: {}
