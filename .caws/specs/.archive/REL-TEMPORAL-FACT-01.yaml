invariants:
  - 'The projection boundary TRANSPORTS declared facts; it does not interpret them and it does not drop them. Carrying temporality.kind asserts nothing about duration or extent: the consumer that needs an extent still has to obtain it, and an absent extent stays absent.'
  - 'A default must not be invented for a fact the declaration does not carry. No temporality on the field means no temporal fact on the projection facts, never an implicit instant.'
  - 'The isolation control is the point of the slice: a change to temporality ALONE must move the facts, so the earlier control result (changing it moved nothing) is inverted rather than merely asserted against.'
