invariants:
  - 'A decoder receives ONLY the produced representation. It is given neither the supplied rows nor access to evaluateOperation, so it cannot reconstruct the expected answer instead of observing what the projection produced. A second evaluation of the same operation is not evidence that a distinct representation preserved it.'
  - 'The enumerator consumes RESULT facts derived from the admitted operation and the named relation, not independently supplied source facts that can describe a different relation or a field the operation already aggregated away. The operation is validated against the relation, including its name.'
  - 'The executable contract is narrowed to the aggregate it can actually perform: an unsupported aggregate name is REJECTED, never executed as sum. Implementing every aggregate is out of scope.'
  - 'Neither 42 retained candidates nor unchanged ledger counts is an acceptance requirement. Deriving result-field facts may change the candidate population, and that change is recorded rather than resisted.'
  - 'Out of scope and not to be widened into: OHLC and graph support, the eight unimplemented tasks, general combinators, production emission, stage-2 accounting, and exhaustive realization residue. A requirement to build any of those is a stopping finding.'
acceptance:
  - id: A1
    given: 'The spec implementation is complete.'
    when: 'The acceptance statement is evaluated.'
    then: 'given a projection is bound to an admitted aggregate operation; when the enumerator derives the facts it filters on; then those facts come from the operation and the relation it names, an operation naming a relation that does not exist or disagreeing with the admitted one cannot enter, and an aggregate the evaluator cannot perform is rejected rather than executed as a sum'
  - id: A2
    given: 'One admitted sum has been evaluated over a supplied population.'
    when: 'Two representations are produced from that single result and each is decoded.'
    then: >-
      A readback representation and a metric representation both recover the
      operation's values, the metric recovery uses the extents and the DECLARED
      scale rather than re-evaluating, each decoder receives only its own
      representation, and the recovered values are distinguished from the
      aggregation direction the declaration forbids.
  - id: A3
    given: 'A representation carries the result.'
    when: >-
      One metric extent is changed, and separately the group bindings are shifted
      while every value is held.
    then: >-
      Both changes are detected: the recovered set differs from the operation's, and
      the binding mutation is detected even though the numeric total is unchanged,
      so preservation is distinguished from agreement on a total.
  - id: A4
    given: 'The earlier binding slice presented consumer agreement as preservation.'
    when: 'The retained record is read against the re-executed evidence.'
    then: >-
      It states what that agreement did not establish, records the
      aggregate-dispatch and metric-channel-label repairs, records that the
      composition probe's earlier lawful completion was an artifact of source facts,
      and carries the corrected candidate population rather than the previous count.
non_functional: {}
