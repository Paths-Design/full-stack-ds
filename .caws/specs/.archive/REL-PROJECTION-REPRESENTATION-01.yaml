closure_notes: 'Recovered the bound sum from two produced representations by decoders that see only their own output: extents 60 and 210 decode to 30 and 105 through the declared scale, a bumped extent and a shifted group binding are both detected with the total held at 135, the enumerator now filters on result facts and refuses unsupported aggregates and relations, and the earlier shared-evaluator interpretation is withdrawn in the record.'
