blast_radius:
  modules:
    - 'pause-menu visual authority, native token projection and brand loaders'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'examples/game-pause-menu'
    - 'packages/ds-tokens/src/brands/orion.tokens.json'
    - 'packages/ds-tokens/generated'
    - 'packages/ds-unity/Runtime/Resources/FullStackDS'
    - 'packages/ds-gpui/src'
    - 'packages/ds-godot/addons/full_stack_ds'
    - 'scripts'
    - 'package.json'
    - 'examples/README.md'
  out: []
invariants:
  - 'Geometry, interaction semantics and the 195-probe/117-bbox parity baseline remain green'
acceptance:
  - id: A1
    given: 'the GPUI lane and the shared checker'
    when: 'captures and probes run'
    then: 'GPUI text ink weight matches Unity/Godot within tolerance and an ink-coverage probe fails on regression'
  - id: A2
    given: 'the parity authority and Orion brand'
    when: 'colors and type sizes are audited'
    then: 'every authority color and size carries token provenance resolved from resolved.tokens.json plus the Orion brand, with missing hues added to the brand instead of a parallel palette'
  - id: A3
    given: 'GPUI and Godot lanes'
    when: 'they build their palette'
    then: 'they resolve colors from the token graph (resolved + Orion brand) rather than the lane appearance fixture, and captures stay parity-green'
  - id: A4
    given: 'the Unity lane'
    when: 'rendered'
    then: 'generated-component color/shape token channels are used where they exist, remaining inline overrides are ledgered, and brand projection covers the supported shape/spacing/typography overrides'
  - id: A5
    given: 'the repository gates'
    when: 'node scripts/game-pause-token-provenance.mjs runs'
    then: 'it fails if any authority color or size lacks a resolvable token provenance'
non_functional: {}
contracts:
  - name: 'pause-menu-parity-spec'
    type: behavior
    path: 'examples/game-pause-menu/parity.md'
