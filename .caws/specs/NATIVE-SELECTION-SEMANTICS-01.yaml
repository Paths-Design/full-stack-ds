invariants:
  - 'Native selection state is exposed through the platform''s selected semantics, which the platform localizes, not through component-authored English words'
  - 'A trait computed from a channel reads the current value, never a stale binding'
acceptance:
  - id: A1
    given: 'the generated Compose Tabs'
    when: 'a tab renders'
    then: 'it is a selectable node with Role.Tab whose selected state follows the active tab, and no English stateDescription is emitted for tabs'
  - id: A2
    given: 'the generated SwiftUI Tabs'
    when: 'a tab renders'
    then: >-
      the active tab carries the isSelected accessibility trait and the others do
      not, read from the current channel value through the environment, and the
      trait follows a press and a parent-set value
  - id: A3
    given: 'the generated Compose Walkthrough, Popover and Select'
    when: 'they render'
    then: 'their previous/next buttons and the popover trigger expose Role.Button and the Select trigger Role.DropdownList'
  - id: A5
    given: 'the regenerated tree'
    when: 'the rail, committed-output check, a11y audit and the Compose and Swift test suites run'
    then: 'all pass'
rollback:
  - 'Revert the merge commit and regenerate the native targets'
non_functional: {}
contracts:
  - name: 'native-selection-semantics'
    type: behavior
