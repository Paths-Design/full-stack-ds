blast_radius:
  modules:
    - 'Pagination contract, generated consumers, Carousel composition, paging architecture and runtime witnesses'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-contracts/components/Pagination'
    - 'packages/ds-contracts/components/Carousel'
    - 'packages/ds-contracts/component.contract.schema.json'
    - 'packages/ds-codegen/src'
    - 'packages/ds-react/src'
    - 'packages/ds-vue/src'
    - 'packages/ds-svelte/src'
    - 'packages/ds-angular/src'
    - 'packages/ds-lit/src'
