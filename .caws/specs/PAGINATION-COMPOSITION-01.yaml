invariants:
  - 'Pagination selects an ordered position independently of content, surface presence, timing and movement.'
  - 'Carousel remains the sole owner of slide validity, autoplay budget and transition policy; composition introduces no second timer.'
  - 'Contract and normalized IR own semantics; framework emitters contain no Pagination or Carousel name branches.'
acceptance:
  - id: A1
    given: 'generic ordered page labels'
    when: 'standalone Pagination selects indicator or numbered items in controlled and uncontrolled use'
    then: 'selection and accessible current state match the accepted index without owning content or time'
  - id: A2
    given: 'generated Carousel consuming Pagination'
    when: 'picker and previous next controls navigate and automatic time advances'
    then: 'slides current selection focus policy and elapsed projection retain the existing sequence contract'
  - id: A3
    given: 'the reusable paging architecture'
    when: 'consumers inspect standalone and composition examples'
    then: 'Pagination is discoverable independently and paging presence selection and content ownership are documented with implementation boundaries'
  - id: A4
    given: >-
      A known finite collection using PageNavigator composed from Input Button Icon
      and optional Pagination choices
    when: 'The user steps backward or forward or commits a one-based page field'
    then: >-
      Only in-range integer requests are emitted, accepted state remains controlled
      by the owner, unavailable and empty collections disable navigation, and the
      compact form is demonstrated and verified across the five web frameworks
  - id: A5
    given: 'Shared ordered-set state and independently supplied item completion and progress'
    when: 'A display-only projection or an interactive location selector is generated'
    then: >-
      Values do not introduce interactive hosts or navigation actions and selecting
      a location does not infer or mutate activity completion; the representation
      and examples preserve that boundary
rollback:
  - 'Revert the extraction commit and regenerate contract-owned sources.'
non_functional: {}
contracts:
  - name: 'pagination-selection'
    type: behavior
  - name: 'composed-sequence'
    type: api
