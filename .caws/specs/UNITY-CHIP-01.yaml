invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; a trigger component reference lowers to native action chrome only when it declares a click callback binding and trigger role, and its composed visuals are never claimed'
acceptance:
  - id: A1
    given: 'the Chip contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'the action and guarded dismiss chrome render as native buttons with part identities, callbacks forward to generated Action properties, the dismiss presence follows a generated flag, and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the Chip control, the twenty-nine-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'the action and dismiss buttons are activated and the dismiss flag is toggled'
    then: 'the generated callbacks fire, the dismiss chrome presence follows the flag, and disabled state disables both'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'Chip, its native action chrome, the withheld composed Button visuals and the refused navigation/ARIA facts are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the Chip behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Chip from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'chip-actions'
    type: behavior
    path: 'packages/ds-contracts/components/Chip/Chip.contract.json'
