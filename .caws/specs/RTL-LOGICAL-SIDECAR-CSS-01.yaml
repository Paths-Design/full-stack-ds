  out: []
invariants:
  - 'Physical side values that a component exposes as API (Sheet side, Tooltip and Popover placement, Text align) stay physical until the user decides their meaning'
  - 'A declaration whose side depends on reading direction names the inline start or end, so horizontal left-to-right rendering is unchanged and right-to-left mirrors it'
acceptance:
  - id: A1
    given: 'Toast, Switch, Dialog, Sheet, Alert, AlertNotice, Progress, Walkthrough, vertical Tabs, Accordion and Select sidecars'
    when: 'they are generated'
    then: >-
      each direction-dependent declaration names the inline start or end with the
      value of the physical property it replaces (or, for the Switch track, adds a
      web-only dir=rtl mirror), so in horizontal left-to-right writing it resolves
      to the same physical side as before; vertical writing modes are not claimed
  - id: A2
    given: >-
      the Toast, checked Switch, open Dialog and dismissible Alert previews in
      Chromium for each of the five web frameworks
    when: 'each is measured under dir=ltr and then under dir=rtl on the document element'
    then: >-
      the toast sits on the right viewport edge in ltr and the left edge in rtl, and
      the thumb, dialog close button and alert dismiss sit within a small gap of the
      inline end in ltr and at that same gap, within 1px, from the opposite edge in
      rtl
  - id: A3
    given: 'the regenerated tree'
    when: 'the rail, committed-output check, styling audits and every framework suite run'
    then: 'all pass'
rollback:
  - 'Revert the merge commit and regenerate every target'
non_functional: {}
contracts:
  - name: 'logical-sidecar-css'
    type: behavior
    path: 'e2e/rtl-direction.spec.ts'
