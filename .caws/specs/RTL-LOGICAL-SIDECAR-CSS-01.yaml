blast_radius:
  modules:
    - 'packages/ds-contracts/components'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-contracts/components/Toast/Toast.styles.json'
    - 'packages/ds-contracts/components/Switch/Switch.styles.json'
    - 'packages/ds-contracts/components/Dialog/Dialog.styles.json'
    - 'packages/ds-contracts/components/Sheet/Sheet.styles.json'
    - 'packages/ds-contracts/components/Alert/Alert.styles.json'
