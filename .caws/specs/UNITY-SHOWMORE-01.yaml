updated_at: '2026-10-31T17:05:07.083Z'
created_by_session: 'session-5800e41f-e414-466a-a520-b46288f6bf5f'
blast_radius:
  modules:
    - 'Unity expansion lowering: a boolean channel over an always-mounted content slot with a trigger that paints its state-dependent label'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/frameworks/unity'
    - 'packages/ds-codegen/src/cli.test.ts'
    - 'packages/ds-unity/Runtime'
    - 'packages/ds-unity/Tests'
    - 'packages/ds-unity/Editor'
    - 'packages/ds-unity/README.md'
    - 'fsds.targets.json'
    - 'docs/architecture/unity-target.md'
    - 'docs/current-implementation-snapshot.md'
    - 'scripts/unity-tests.mjs'
  out: []
  support:
    - packages/ds-unity/Runtime/Resources/FullStackDS/Controls.unsupported.json
    - packages/ds-unity/Runtime/Resources/FullStackDS/Controls.uss
invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; the expansion runtime claims the channel, contentslot and label painting only, never the line-clamp measurement'
acceptance:
  - id: A1
    given: 'the ShowMore contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'the generated control exposes the expanded/default-expanded/label/controlled/request API and the content slot, the trigger binds the channel click, the conditional label props are painted, and the properties/messages/a11y families are adjudicated with no allowlisted catch-all reliance'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the ShowMore control and ExpansionControl runtime, the forty-eight-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'labels/expanded/default-expanded/controlled are exercised and the trigger is activated'
    then: 'the runtime paints the state-dependent label, toggles the expansion channel with commit/request semantics, keeps the content slot consumer-owned and renders no clamp/measurement API'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'ShowMore, its expansion runtime, label painting and the unclaimed line-clamp/measurement/localised-message facts are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the ShowMore behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove ShowMore from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'showmore-expansion'
    type: behavior
    path: 'packages/ds-contracts/components/ShowMore/ShowMore.contract.json'
