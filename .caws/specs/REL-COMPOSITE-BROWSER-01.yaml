    given: 'renamed fields and reordered source population'
    when: 'the same browser consumer runs'
    then: 'preservation holds without chart or fixture branches'
  - id: A5
    given: 'refused unproven unsupported and empty selections'
    when: 'the provider and browser run'
    then: 'no geometry is produced and disposition is visible'
