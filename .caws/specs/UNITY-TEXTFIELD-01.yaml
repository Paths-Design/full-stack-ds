invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; the text-input lowering attaches the string channel to whichever form-control part the contract identifies, root or child'
acceptance:
  - id: A1
    given: 'the TextField contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'a TextInput behavior attaches TextControl to the native field child, the label/description/error slots render as named hosts, the string channel API is emitted and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the TextField control, the thirty-four-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'the field value, controlled requests and disabled state run'
    then: 'the native field carries the channel, the wrapper exposes the channel API and slots, and no type/required/name/validity API is emitted'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'TextField, its wrapper/field split, named slots and the refused form/state facts are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the TextField behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove TextField from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'textfield-text'
    type: behavior
    path: 'packages/ds-contracts/components/TextField/TextField.contract.json'
