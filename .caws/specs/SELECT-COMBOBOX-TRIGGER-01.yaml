  out: []
invariants:
  - 'Exactly one element of a Select exposes the combobox role, and it is the element that takes focus'
  - 'The visible selected label is the combobox value, not overridden by its name'
acceptance:
  - id: A1
    given: 'the generated Select in each web framework'
    when: 'it renders'
    then: 'role=combobox, aria-haspopup=listbox, aria-expanded and aria-controls sit on the focusable trigger button, the wrapper carries none of them, and the document holds exactly one combobox'
  - id: A2
    given: 'a Select with a selected option'
    when: 'Chromium builds its accessibility tree in each web framework'
    then: 'the tree holds exactly one combobox, the trigger, named by triggerLabel, whose value is the selected option''s visible label and whose expanded state follows the open channel'
  - id: A3
    given: 'the regenerated tree'
    when: 'the rail, the committed-output check and the a11y and behavior realization audits run'
    then: 'all pass with no new ledgered gap'
rollback:
  - 'Revert the merge commit and regenerate Select'
non_functional: {}
contracts:
  - name: 'select-combobox'
    type: behavior
    path: 'packages/ds-contracts/components/Select/Select.contract.json'
