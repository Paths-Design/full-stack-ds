blast_radius:
  modules:
    - 'Unity UI Toolkit boolean form-control lowering: Checkbox label-host control and ToggleSwitch root-control anatomy'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/frameworks/unity'
    - 'packages/ds-codegen/src/cli.test.ts'
    - 'packages/ds-unity/Runtime/Components'
    - 'packages/ds-unity/Runtime/BooleanControl.cs'
    - 'packages/ds-unity/Runtime/ItemGroup.cs'
    - 'packages/ds-unity/Runtime/AnchoredSurface.cs'
    - 'packages/ds-unity/Tests'
    - 'packages/ds-unity/Editor'
    - 'packages/ds-unity/Samples~'
    - 'packages/ds-unity/README.md'
    - 'fsds.targets.json'
    - 'docs/architecture/unity-target.md'
    - 'docs/current-implementation-snapshot.md'
    - 'scripts/unity-tests.mjs'
  out: []
  support:
    - packages/ds-unity/Runtime/Resources/FullStackDS/Controls.unsupported.json
    - packages/ds-unity/Runtime/Resources/FullStackDS/Controls.uss
invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; the label-host and root-control boolean forms share one BooleanControl behavior selected by form-control facts'
acceptance:
  - id: A1
    given: 'the Checkbox and ToggleSwitch contracts and renamed fact-equivalent fixtures'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'Checkbox lowers through BooleanControl with its label host and ToggleSwitch lowers its root form-control part to a native Button-derived boolean control whose Trigger is itself, every refused or pending leaf carries an explicit rule, and no allowlisted leaf relies on a catch-all'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the generated Checkbox and ToggleSwitch controls, the ten-name component catalog and their USS carriers byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'Checkbox activation, label-click activation, disabled suppression, indeterminate non-support and ToggleSwitch pointer/submit activation are exercised in a live panel'
    then: 'the checked channel changes exactly once per activation, disabled activation is suppressed, and the results are recorded from the real Editor'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'both controls, their shared BooleanControl semantics and the refused indeterminate/ARIA/form-serialization non-claims are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the generated boolean-control behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Checkbox and ToggleSwitch from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'checkbox-channel'
    type: behavior
    path: 'packages/ds-contracts/components/Checkbox/Checkbox.contract.json'
  - name: 'toggleswitch-channel'
    type: behavior
    path: 'packages/ds-contracts/components/ToggleSwitch/ToggleSwitch.contract.json'
