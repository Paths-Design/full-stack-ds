id: FIX-NODE25-JSDOM-STORAGE-01
title: 'Rebind jsdom Web Storage over Node 25''s own storage globals in the shared test setup'
mode: fix
lifecycle_state: active
worktree: node25-jsdom-storage
created_at: '2026-10-28T08:57:56.873Z'
updated_at: '2026-10-28T08:58:11.548Z'
