invariants:
  - 'Semantics are declared through generic contract facts without component-name emitter special cases'
  - 'Authored dismissal labels remain localized and controlled owners may refuse close requests'
  - 'Literal component props use normalized target-property classification and host attributes retain their attribute semantics'
acceptance:
  - id: A1
    given: 'an open dismissible Dialog in each web framework'
    when: 'its close control is rendered and activated by pointer or keyboard'
    then: 'a visible nonempty glyph and localized accessible name accompany a close request'
  - id: A2
    given: 'an open Dialog with dismissible false'
    when: 'close affordances and backdrop are inspected and activated'
    then: 'the close button is absent and backdrop activation emits no dismissal request while Escape follows its declared policy'
  - id: A3
    given: 'controlled Dialog open remains true'
    when: 'a dismissal request occurs'
    then: 'the callback is emitted and the dialog remains open'
  - id: A4
    given: 'renamed referenced components with static props and host attributes'
    when: 'Lit lowers the normalized instance and the Dialog close glyph renders'
    then: >-
      declared props reach component properties including non-reflecting variants
      and host attributes remain attributes without component-name special cases
