invariants:
  - 'Meaning precedes realization; no form name or fixture identity selects an analysis or output.'
  - 'Composition preserves every operand-relevant transformation, task requirement and unresolved standing; reordering set-valued inputs cannot change analytical admission.'
  - 'Qualification owns complete unique typed source-grain identity and immutable carried field facts; output mutation cannot mutate analytical authority.'
  - 'Only selected supported lawful composites produce outputs, and lowerers consume the carried composite rather than source rows or mutable declarations.'
  - 'Stage-2 ratification remains open; the bounded output witness does not establish M5 or M6 completeness, endpoint roles, temporal traversal or broader aggregation.'
acceptance:
  - id: A1
    given: 'a magnitude comparison and a truncated cell'
    when: 'direct and nested compositions are judged'
    then: 'each refuses the same unmet ratio-comparability obligation'
  - id: A2
    given: 'mixed transformations sharing a channel and set-valued grain declarations'
    when: 'operands and grain fields are permuted'
    then: 'complete normalized semantics and admission remain equivalent'
  - id: A3
    given: 'missing, empty, duplicate and incomplete source populations'
    when: 'qualification runs'
    then: 'missing evidence stays distinct and unresolved while duplicate grain is contradicted and no missing value is manufactured as identity'
  - id: A4
    given: 'qualified field views and declared target capacities'
    when: 'composition runs with invalid channels or absent capabilities'
    then: 'invalid assignments refuse and unavailable target support cannot retain'
  - id: A5
    given: 'qualified authority and produced artifacts'
    when: 'source declarations or artifact values are mutated'
    then: 'established authority stays unchanged and downstream interpretation uses carried facts'
  - id: A6
    given: 'multiple faulted operands and constructed unselected lowering requests'
    when: 'composition and lowering run'
    then: 'contradictions dominate unresolved summary standing with all origins retained and unselected requests cannot produce output'
  - id: A7
    given: 'a qualified result consumed with changed declarations'
    when: 'composition reads its fields'
    then: >-
      transformation units and relationship facts are taken from the immutable
      carried result rather than reinterpreted from the changed declaration
  - id: A8
    given: 'set-valued source-grain declarations and structured keys'
    when: 'grain fields are permuted or numeric and string key values are compared'
    then: 'co-registration ignores grain declaration order while distinct scalar key types remain distinct'
  - id: A9
    given: 'a qualified ratio view and nominal view sharing one text channel'
    when: 'their operand order changes and a length-only embed budget is judged'
    then: >-
      all presented transformations survive normalization and the nominal
      requirement refuses in either order
  - id: A10
    given: 'an absent population and an explicitly empty population'
    when: 'the qualified-result selection and readback orchestration runs'
    then: >-
      the missing population remains unproven while the explicitly empty result
      remains distinct as nothing-to-realize
  - id: A11
    given: 'the bounded boundary repairs'
    when: 'analytical tests types lint and required repository gates run'
    then: >-
      the corrected cases and conservation checks pass and stage-2 unratified
      subtraction remains explicitly separate
