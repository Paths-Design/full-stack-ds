id: UNITY-CARD-01
title: 'Admit Card to the Unity target as a parts-only composed container (Godot parity)'
mode: feature
lifecycle_state: active
worktree: unity-card
created_at: '2026-10-31T10:53:54.860Z'
updated_at: '2026-10-31T11:06:35.666Z'
created_by_session: 'session-5800e41f-e414-466a-a520-b46288f6bf5f'
blast_radius:
  modules:
    - 'Unity passive lowering: parts-only composed container class'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/frameworks/unity'
    - 'packages/ds-codegen/src/cli.test.ts'
    - 'packages/ds-unity/Runtime/Components'
    - 'packages/ds-unity/Tests'
    - 'packages/ds-unity/Editor'
    - 'packages/ds-unity/README.md'
    - 'fsds.targets.json'
    - 'docs/architecture/unity-target.md'
    - 'docs/current-implementation-snapshot.md'
    - 'scripts/unity-tests.mjs'
  out: []
  support:
    - packages/ds-unity/Runtime/Resources/FullStackDS/Controls.unsupported.json
    - packages/ds-unity/Runtime/Resources/FullStackDS/Controls.uss
invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; a parts-only contract selects the same passive lowering only when it declares no channel, interaction or surface'
acceptance:
  - id: A1
    given: 'the Card contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'the root class carries its density carrier and each subcomponent part generates a composed class, the interactive hover affordance and non-native style facts are adjudicated, and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains Card with its composed subcomponent classes, the twenty-two-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'consumer content is composed into the card subcomponent parts and the density carrier is set'
    then: 'the parts render, the expected modifier class is present, and no interactive-motion API is exposed'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'Card, its composed parts, density carrier and refused interactive-motion non-claim are stated, and the Godot parity is noted'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the Card behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Card from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'card-container'
    type: behavior
    path: 'packages/ds-contracts/components/Card/Card.contract.json'
