invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; an axis is emitted only when the USS projection has a class carrier for it'
acceptance:
  - id: A1
    given: 'the List contract and a renamed fact-equivalent fixture'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'the passive root emits carrier-backed Marker and Size attributes, withholds Variant and Spacing whose selectors use child combinators outside the native grammar, refuses the polymorphic as prop, and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the generated List control, the fifteen-name component catalog and its USS carriers byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'list items are composed and marker/size carriers are set'
    then: 'the items render through the content container, the expected modifier classes are present, and no Variant/Spacing/As API is emitted'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'List, its marker/size carriers and the withheld combinator-only axes and refused as prop are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the List behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove List from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'list-container'
