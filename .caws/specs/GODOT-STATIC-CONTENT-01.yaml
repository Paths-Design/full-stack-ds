id: GODOT-STATIC-CONTENT-01
title: 'Godot static content and rule realization from shared IR facts'
mode: feature
lifecycle_state: active
worktree: godot-static-content
created_at: '2026-10-29T15:48:18.518Z'
updated_at: '2026-10-29T15:49:19.104Z'
created_by_session: '01a1883a-a922-7551-aca0-c7ed2d6e3ac8'
blast_radius:
  modules:
    - 'Godot IR lowering, generated components, runtime static content, and engine consumer witnesses'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/frameworks/godot'
    - 'packages/ds-godot'
    - 'scripts/godot-pilot.mjs'
    - 'fsds.targets.json'
    - 'docs/architecture/godot-target.md'
  out: []
invariants:
  - 'Static component emission reads normalized anatomy, content, variant and style facts without branching on component identity'
  - 'Unknown or unsupported contract facts fail admission or remain explicitly unadmitted; generation alone never counts as fidelity'
acceptance:
  - id: A1
    given: 'synthetic renamed static content and rule contracts'
    when: 'the Godot emitter builds their plans'
    then: 'source facts determine the host, content and exposed props, and unsupported facts fail with typed diagnostics without component-name dispatch'
  - id: A2
    given: 'Text and Divider contracts with their sidecars'
    when: 'generation runs'
    then: 'generated scripts and resources carry the supported text/rule content and styling facts with no silent omission in the admitted subset'
  - id: A3
    given: 'a fresh Godot consumer'
    when: 'the static-content runtime witness runs'
    then: 'real engine observations distinguish text content and variant changes, horizontal and vertical rule geometry, and token-derived rendered values'
  - id: A4
    given: 'the committed generated tree'
    when: 'regeneration and focused codegen plus Godot pilot checks run'
    then: 'generated bytes are stable and the named checks pass with recorded source identity'
non_functional: {}
contracts:
  - name: 'godot-static-facts'
    type: contract-test
    path: 'packages/ds-codegen/src/frameworks/godot/factory.test.ts'
  - name: 'godot-runtime-static'
    type: behavior
    path: 'packages/ds-godot/addons/full_stack_ds/runtime/static_content.gd'
