  out: []
invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; URL fetching, alternative text semantics and responsive source selection are explicitly not claimed'
acceptance:
  - id: A1
    given: 'the Image contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'the generated class derives the native Image element, exposes the source attribute backed by ImageControl texture loading and the size/radius carriers, and every other source/layout/a11y prop is refused by an adjudicated rule with no allowlisted catch-all reliance'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the Image control and ImageControl runtime, the thirty-nine-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'the source attribute is set and cleared and the size/radius carriers are set'
    then: 'the native image resets its texture, the carrier classes apply, and no alt/URL/responsive API is emitted'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'Image, its native element, Resources-source mapping, carriers and the non-realised URL/alt/responsive facts are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the Image behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Image from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'image-media'
    type: behavior
    path: 'packages/ds-contracts/components/Image/Image.contract.json'
