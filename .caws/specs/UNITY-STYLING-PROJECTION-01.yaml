invariants:
  - 'Every USS rule is derived from IR facts (ir.nativeStyleRules, ir.tokenScopes, ir.tokenFacts, ir.classRecipe, ir.states, the selected behavior''s state-class placement) and the token graph; no selector, property or value is authored per component, and no emitter branch names a component, part, channel or class literal beyond the HTML/CSS/USS platform vocabulary'
  - 'A CSS fact USS cannot realise is recorded in a machine-readable unsupported ledger emitted beside the stylesheet and classified refused or pending in the support boundary; it is never silently dropped and never approximated by hand-authored USS'
  - 'packages/ds-unity ships no hand-authored theme palette after this slice: Runtime/Resources/FullStackDS/Controls.uss is generated, sample-only styling lives under Samples~ and is not package theme authority'
  - 'Behavior semantics are unchanged: the 26 EditMode interaction cases and the frozen engine traces pass before and after; the allowlist stays Switch, Accordion, Popover, Tabs'
  - 'Token names in USS follow the web token build''s kebab-case --fsds-* naming so the same resolvability question is asked of both surfaces'
acceptance:
  - id: A1
    given: 'the four allowlisted contracts, their sidecars and the built token graph'
    when: 'pnpm run generate:unity runs'
    then: 'Runtime/Resources/FullStackDS/Controls.uss is generated with a token section (light, dark and each brand as class scopes) covering the closure of tokens the admitted components reference, and a per-component section whose selectors and declarations are lowered from ir.nativeStyleRules and the behavior state-class placement, with an unsupported ledger listing every declaration USS cannot realise and its reason'
  - id: A2
    given: 'the generated Controls.uss'
    when: 'pnpm run audit:token-resolvability and pnpm run audit:variant-realization run'
    then: 'both audits scan the unity target (USS var references resolve within the generated token section; every non-default variant value of an allowlisted component has a USS carrier or a ledgered gap) and pass with their ledgers reporting zero unledgered and zero stale findings'
  - id: A3
    given: 'the regenerated package under Unity 6000.5.3f1'
    when: 'pnpm run test:unity runs'
    then: 'all EditMode tests pass; the generated stylesheet imports with importedWithErrors and importedWithWarnings both false; StylingTests pin colours, typography, spacing and focus to token-graph values (light and dark), re-record the Player screenshots and the 26 interaction cases plus the frozen engine traces still pass'
  - id: A4
    given: 'the support boundary'
    when: 'pnpm run audit:unity-boundary runs'
    then: >-
      the tokens, styles, variants, states, rtl and morphology families are lowered
      with via naming the USS projection, refused with a reason, or pending a later
      named phase with a reason (never P3); every Controls.unsupported.json entry
      backed by a sidecar leaf is classified refused or pending; zero leaves remain
      pending P3, and the audit reports zero violations
  - id: A5
    given: 'the regenerated package'
    when: 'generate:unity runs a second time and the unity emitter and CLI suites run'
    then: >-
      the packages/ds-unity working tree is clean after the second regeneration,
      governed:rail still passes (the emission manifest records target assets for
      rail targets; unity is outside the rail until P5, so its drift proof is
      regeneration plus a clean tree), and the emitter suite pins the USS lowering
      against a synthetic contract outside the corpus
  - id: A6
    given: 'docs/architecture/unity-target.md, packages/ds-unity/README.md and the implementation snapshot'
    when: 'docs:check-claims and docs:check-links run'
    then: 'the projection rules (token scopes, selector lowering, state-class placement, property mapping, unsupported ledger, theme/brand switching API) and the recorded EditMode run with Unity version are documented and both gates pass'
observability:
  - 'audit:unity-boundary per-phase pending counts (P3 must read 0 after the slice)'
  - 'the generated unsupported ledger beside Controls.uss (count and reasons) and the two styling audits'' unity rows'
rollback:
  - 'revert the slice commits and regenerate: the hand-authored Controls.uss returns with the three-file sample; no persisted state'
non_functional: {}
