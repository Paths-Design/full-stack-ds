id: GAME-PAUSE-INTERACTION-REPAIRS-01
title: 'Repair game pause menu input and state paths across Godot GPUI and Unity'
mode: fix
lifecycle_state: draft
created_at: '2026-11-01T11:51:51.237Z'
updated_at: '2026-11-01T11:51:51.237Z'
created_by_session: '01a195d1-c003-73d0-bc10-857a40e75760'
blast_radius:
  modules:
    - 'game-pause-menu consumer lanes'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'examples/game-pause-menu/godot'
    - 'examples/game-pause-menu/gpui'
    - 'examples/game-pause-menu/unity'
  out: []
invariants:
  - 'All three lanes preserve the shared I1-I15 interaction semantics and fixture meanings'
acceptance:
  - id: A1
    given: 'a Godot remap modal'
    when: 'a pressed gamepad button is dispatched'
    then: 'its binding changes and the modal closes while cancel retains the binding'
  - id: A2
    given: 'an open Godot marker popover'
    when: 'another tab is activated'
    then: 'the popover closes and the new tab is unobstructed'
  - id: A3
    given: 'GPUI stepped sliders and language dropdowns'
    when: 'users select minimum values or any language option'
    then: 'zero-valued settings and all options remain reachable and visible'
  - id: A4
    given: 'Unity initial fixtures and remap state'
    when: 'the menu first renders or a remapped action modal reopens'
    then: 'hidden markers stay hidden and the modal shows the current binding'
non_functional: {}
contracts:
  - name: 'pause-menu'
    type: behavior
    path: 'examples/game-pause-menu/spec.md'
