invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; an ephemeral viewport surface is selected only from its surface/timing facts and its auto-dismiss timer is explicitly adjudicated'
acceptance:
  - id: A1
    given: 'the Toast contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'a Toast surface behavior attaches the item/close/title elements, the open channel, variant axis, title text and auto-dismiss duration are emitted, behavior-owned guards are allowed, and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the Toast control and ToastSurface runtime, the thirty-five-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'the toast opens/closes, the timer elapses, the close button runs and the title changes'
    then: 'presence and controlled state follow the knobs and no ARIA/politeness API is emitted'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'Toast, its ephemeral surface, auto-dismiss/title behaviour and the non-realised ARIA/progress/motion facts are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the Toast behavior to the tested revision'
rollback:
