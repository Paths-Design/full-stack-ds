invariants:
  - 'Every dom-tree Angular component that the other web frameworks scan with axe is scanned by its generated Angular test with the same plan inputs: activation props, label input, slot content and list parent'
  - 'An axe test proves the scan root contains the rendered component before asserting no violations'
acceptance:
  - id: A1
    given: 'the Angular test emitter'
    when: 'it emits a dom-tree component test'
    then: 'it emits an axe describe that renders the component through a host template carrying the plan props, label input and slot content, proves the component rendered, and asserts an empty violation id list, with emitter tests pinning that shape'
  - id: A2
    given: 'the regenerated Angular package'
    when: 'its jest suite runs'
    then: 'every generated axe test passes, the count of generated Angular axe tests matches the React count, and an axe test fails when a component renders an unnamed control'
  - id: A3
    given: 'the a11y matrix and implementation snapshot'
    when: 'they describe generated axe coverage'
    then: 'they state the Angular coverage the code now has'
rollback:
