updated_at: '2026-10-31T16:29:03.549Z'
created_by_session: 'session-5800e41f-e414-466a-a520-b46288f6bf5f'
blast_radius:
  modules:
    - 'Unity transfer lowering: a string[] selection channel over candidate ids with runtime-built dual lists'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/frameworks/unity'
    - 'packages/ds-codegen/src/cli.test.ts'
    - 'packages/ds-unity/Runtime'
    - 'packages/ds-unity/Tests'
    - 'packages/ds-unity/Editor'
    - 'packages/ds-unity/README.md'
    - 'fsds.targets.json'
    - 'docs/architecture/unity-target.md'
    - 'docs/current-implementation-snapshot.md'
    - 'scripts/unity-tests.mjs'
  out: []
invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; the transfer runtime owns available/selected derivation, marking, add/remove and the array channel, withholding keyboard, a11y and marked-state styling'
acceptance:
  - id: A1
    given: 'the Shuttle contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'the generated control exposes options/value/default/change/controlled/request array API over the runtime hosts, omits the iterated item markup and adjudicates the transfer/event/iteration/a11y/keyboard/channel families with no allowlisted catch-all reliance'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the Shuttle control and ShuttleControl runtime, the forty-seven-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'options/value/marking/add/remove/controlled are exercised'
    then: 'the runtime derives available/selected rows, transfers marked items through the array channel with commit/request semantics, enables the transfer buttons from marked state and renders no keyboard/a11y/marked-state API'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'Shuttle, its transfer runtime, array channel, derivation rules and the unclaimed keyboard/a11y/marked-state facts are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the Shuttle behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Shuttle from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'shuttle-transfer'
    type: behavior
    path: 'packages/ds-contracts/components/Shuttle/Shuttle.contract.json'
