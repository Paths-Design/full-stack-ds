id: GODOT-ACTION-CONTENT-PARITY-01
title: 'Godot contract-derived action content and styling'
mode: feature
lifecycle_state: draft
created_at: '2026-10-29T21:06:18.966Z'
updated_at: '2026-10-29T21:06:18.966Z'
created_by_session: '01a1883a-a922-7551-aca0-c7ed2d6e3ac8'
blast_radius:
  modules:
    - 'Godot emitter, generated action component, runtime and exported Player witness'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/frameworks/godot'
    - 'packages/ds-godot'
    - 'scripts/godot-pilot.mjs'
    - 'fsds.targets.json'
    - 'docs/architecture/godot-target.md'
  out: []
invariants:
  - 'Action structure, behavior and styles derive from normalized IR facts without component-name dispatch'
  - 'Unsupported contract facts are named in capability output and never silently credited as parity'
acceptance:
  - id: A1
    given: 'a projected-children action contract and renamed synthetic equivalent'
    when: 'Godot emits the action family'
    then: 'content, activation, disabled and loading semantics derive from IR without component identity dispatch and unsupported facts are explicit'
  - id: A2
    given: 'authored size and intent variants plus changed token values'
    when: 'a Godot action renders'
    then: 'source-derived text, foreground, background and geometry change on the native Button with declared precedence'
  - id: A3
    given: 'an instantiated scene in Godot Editor and fresh macOS export'
    when: 'content, variants and activation state change'
    then: 'the rendered button updates, fires one action per permitted input, and suppresses action while disabled or loading'
  - id: A4
    given: 'committed generated Godot output'
    when: 'regeneration and focused codegen and engine checks run twice'
    then: 'generated bytes remain stable and source-identified Editor and Player receipts pass'
non_functional: {}
contracts:
  - name: 'godot-action-contract'
    type: contract-test
    path: 'packages/ds-codegen/src/frameworks/godot/factory.test.ts'
  - name: 'godot-action-player'
    type: behavior
    path: 'packages/ds-godot/verification/main.gd'
