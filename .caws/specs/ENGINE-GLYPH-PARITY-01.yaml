id: ENGINE-GLYPH-PARITY-01
title: 'Contract glyph catalog and Icon parity for Unity and Godot'
mode: feature
lifecycle_state: active
worktree: engine-glyph-parity
created_at: '2026-10-30T16:49:29.435Z'
updated_at: '2026-10-30T17:00:09.241Z'
created_by_session: '01a1883a-a922-7551-aca0-c7ed2d6e3ac8'
blast_radius:
  modules:
    - 'Unity and Godot glyph lowering, catalog carriage, native rendering, engine witnesses and target claim ledger'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'fsds.targets.json'
    - 'packages/ds-codegen/src/frameworks/unity'
    - 'packages/ds-codegen/src/frameworks/godot'
    - 'packages/ds-unity'
    - 'packages/ds-godot'
    - 'scripts/unity-tests.mjs'
    - 'scripts/unity-player.mjs'
    - 'scripts/godot-pilot.mjs'
    - 'scripts/engine-comparison.mjs'
    - 'docs/architecture/unity-target.md'
    - 'docs/architecture/godot-target.md'
    - 'docs/current-implementation-snapshot.md'
    - packages/ds-codegen/src/frameworks/native-glyph-catalog.ts
    - packages/ds-codegen/src/frameworks/native-glyph-catalog.test.ts
  out: []
invariants:
  - 'The normalized iconGlyph fact and authored iconography catalog determine glyph identity, size choice and geometry; unknown names clear without a fallback glyph.'
  - 'No engine emitter branches on a component name to render or compose a glyph; unsupported authored facts fail generation or remain explicitly classified.'
  - 'The existing six shared engine controls and Godot Icon remain behaviorally stable while the Unity Icon is admitted.'
acceptance:
  - id: A1
    given: 'the normalized Icon glyph facts and authored iconography catalog'
    when: 'the Unity and Godot targets regenerate'
    then: 'Unity emits a catalog-backed Icon API and the package carries every authored size variant without component-name lore, while generated outputs match the committed source'
  - id: A2
    given: 'valid and unknown icon names, four size axes and changing theme foregrounds'
    when: 'Unity Editor and a fresh standalone Player render and reload Icon consumers'
    then: 'source-bound geometry and pixel witnesses show authored grid selection, inherited color, live updates and unknown-name clearing'
  - id: A3
    given: 'the same glyph scenarios in both engine packages'
    when: 'Godot Editor and fresh export and Unity Player run'
    then: 'both produce source-bound matching semantic observations and rendered foreground pixels, with target accessibility limits recorded separately'
  - id: A4
    given: 'a contract componentRef to the admitted Icon and an altered synthetic component identity'
    when: 'each engine generates and mounts it'
    then: 'the reference renders the catalog glyph and tracks inherited state without a component-name branch or silent placeholder'
  - id: A5
    given: 'the final generated packages and local engine receipts'
    when: 'governed rail, root and framework tests, target audits and documentation checks run'
    then: 'all pass, the implementation snapshot and target docs state the proven boundary, and the merged source records CAWS evidence'
rollback:
  - 'Revert the slice commits and regenerate both target packages; no persisted consumer data is migrated'
non_functional: {}
contracts:
  - name: 'engine-glyph-plan'
    type: contract-test
    path: 'packages/ds-codegen/src/frameworks/unity/glyph-plan.test.ts'
  - name: 'unity-glyph-runtime'
    type: behavior
    path: 'packages/ds-unity/Tests/Editor/GlyphTests.cs'
