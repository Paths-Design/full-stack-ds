id: SVELTE-NPM-PEER-FLOOR-01
title: 'Require the Svelte compiler API floor used by published components'
mode: fix
lifecycle_state: draft
created_at: '2026-11-01T03:28:06.522Z'
updated_at: '2026-11-01T03:28:06.522Z'
created_by_session: '01a18e6c-feec-7162-83fe-0a60125b9b40'
blast_radius:
  modules:
    - '@full-stack-ds/svelte package peer metadata and minimum-version consumers'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-svelte/package.json'
    - 'pnpm-lock.yaml'
    - 'packages/ds-svelte/README.md'
  out: []
invariants:
  - 'Generated component semantics and package versions remain unchanged; only the declared Svelte peer minimum changes.'
  - 'The isolated consumer uses the retained actual package tarball and the Svelte 5.20.0 compiler and runtime, without workspace source aliases.'
acceptance:
  - id: A1
    given: 'retained packed Svelte sources requiring props.id'
    when: 'compiled with Svelte 5.19.0 and 5.20.0'
    then: '5.19.0 rejects the unsupported rune and 5.20.0 compiles the published sources while the package requires Svelte >=5.20.0'
  - id: A2
    given: 'the retained actual packed package and Svelte 5.20.0 types'
    when: 'public declarations are checked in strict NodeNext and all packed declarations in strict Bundler mode'
    then: 'no diagnostics arise and the frozen-lock consistency decision is supported without changing dependency resolutions'
  - id: A3
    given: 'an isolated consumer of the retained package using Svelte 5.20.0 compiler and runtime'
    when: 'Chromium renders Button and Field association plus a dialog component and activates the supported control'
    then: 'visible output and activation state are observed and declared Field IDREF endpoints resolve to the intended mounted elements'
observability:
  - 'Retain compiler versions, source hashes, strict type diagnostics, Chromium observations and screenshot in ignored release evidence.'
rollback:
  - 'Revert the peer-minimum manifest commit through normal git history if the qualified minimum is invalidated.'
non_functional: {}
contracts:
  - name: 'svelte-package-peer'
    type: api
    path: 'packages/ds-svelte/package.json'
