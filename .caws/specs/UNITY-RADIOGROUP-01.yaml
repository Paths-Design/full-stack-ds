invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; the generated option type carries only the declared option leaves and the runtime uses native radio semantics without claiming authored internal markup or state-selector styling'
acceptance:
  - id: A1
    given: 'the RadioGroup contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'the generated control declares a nested option type from the iteration bindings, exposes the options/value/controlled/request/change API and orientation carriers over the runtime-built radio buttons, with adjudicated iteration/state-selector/type/name families and no allowlisted catch-all reliance'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the RadioGroup control and ChoiceGroupControl runtime, the forty-five-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'options/values/disabled options/orientation are set and a radio is chosen'
    then: 'the runtime builds one native radio per option, paints labels/tooltips, commits or requests the selection, disables the declared options, projects orientation and emits no name/aria/state-selector API'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'RadioGroup, its generated option type, native radio runtime, selection/orientation semantics and the unclaimed markup/state-styling/a11y facts are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the RadioGroup behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove RadioGroup from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'radiogroup-choice-group'
    type: behavior
    path: 'packages/ds-contracts/components/RadioGroup/RadioGroup.contract.json'
