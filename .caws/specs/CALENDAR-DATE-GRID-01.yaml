invariants:
  - 'The Calendar grid is derived from the visible month channel; no caller-supplied day list.'
  - 'Date arithmetic, selection, focus movement and Intl formatting live in one date-grid core per runtime family; emitters lower the dateGrid IR fact with no component-name special-casing.'
  - 'The selection dimension a11y attribute declared in states is the attribute bound on the day cell; the IR refuses a dateGrid contract that binds a different one.'
  - 'Exactly one day gridcell is a tab stop at any time.'
acceptance:
  - id: A1
    given: 'a contract declaring a dateGrid block'
    when: 'the IR builds'
    then: >-
      it yields a DateGridIR naming the value and month channels and the mode,
      locale, min, max, disabled and caption props; nested iteration over iter:item
      paths builds, an inner iteration's locals shadowing the enclosing ones as
      dom-tree.test.ts pins; and a missing or mistyped channel or prop (a value
      channel must be typed Date | Date[], optionally | null), a dateGrid binding
      without the block, a compositeControl on the value channel, a cell that does
      not bind the selection dimension a11y attribute, a day cell that is not itself
      the gridcell control (no role=gridcell, a missing tabindex, data-date or
      select binding, or a focusable, editable or interactive element inside it), or
      a grid that does not bind aria-multiselectable to dateGrid:multiselectable
      fails generate:check
  - id: A2
    given: 'a generated Calendar in React, Vue, Svelte, Angular and Lit'
    when: >-
      a user tabs, presses arrow keys, Home, End, PageUp, PageDown (Shift for year),
      Enter or Space on a focused day, clicks a day, or activates the previous and
      next buttons
    then: >-
      following the ARIA grid pattern each day is a gridcell that is itself the
      control: exactly one gridcell is tabbable (focused day, else selected day,
      else today, else first enabled day), focus moves onto the gridcell by the
      declared amount (Left and Right mirrored in RTL) with no focusable element
      inside any cell, crossing a month edge moves the month channel, click, Enter
      and Space select through the value channel in single and range mode, nav
      buttons have visible content and labels and move the month, the gridcell
      carries aria-selected from the selection state and aria-current=date on today
      on the same element that holds focus, and min/max/disabled days are
      aria-disabled and unselectable, proven by one shared behavioral test run in
      every web harness and by the browser runtime rail
  - id: A3
    given: 'a locale prop such as de-DE, ar-EG or en-US'
    when: 'the grid renders on any web family or React Native'
    then: 'day labels, full-date accessible names, weekday column headers, the month caption and the first day of the week follow the locale through Intl, and a locale whose default calendar does not share Gregorian months is formatted in the Gregorian calendar'
  - id: A4
    given: 'the a11y realization audit'
    when: 'it runs after regeneration'
    then: 'the Calendar web keyboard, roving focus, Enter|Space and aria-selected ledger entries no longer reproduce and are deleted from known-gaps.json, and the rail passes'
  - id: A5
    given: 'React Native, Jetpack Compose and SwiftUI'
    when: 'Calendar renders'
    then: 'each derives its grid from the month channel, nav buttons move the month, day labels and names follow the locale, and selection state is exposed through accessibilityState selected, Compose selected semantics and SwiftUI isSelected traits, proven by RN behavior tests, Compose JVM tests and Swift tests'
  - id: A6
    given: 'the landed mechanism'
    when: 'a reader consults the docs'
    then: 'the dateGrid contract surface, per-family realization, locale behavior and non-claims are documented, the localization doc names date formatting, and the snapshot ledger row cites the tests'
rollback:
  - 'Revert the merge commit; contract, IR, primitives and generated trees move together.'
non_functional: {}
contracts:
  - name: 'date-grid'
    type: schema
    path: 'packages/ds-contracts/component.contract.schema.json'
