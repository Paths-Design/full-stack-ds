updated_at: '2026-10-18T21:36:15.689Z'
created_by_session: 'cc2e39ec-43fe-4267-a6f5-92f59dfe759b'
blast_radius:
  modules:
    - 'packages/ds-contracts (schema + Calendar contract)'
    - 'packages/ds-codegen (dateGrid IR fact, nested iteration, every emitter)'
    - 'framework runtime primitives (date-grid core and bindings)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-contracts/component.contract.schema.json'
    - 'packages/ds-contracts/components'
    - 'packages/ds-codegen/src'
    - 'packages/ds-codegen/__golden__'
    - 'packages/ds-react/src'
