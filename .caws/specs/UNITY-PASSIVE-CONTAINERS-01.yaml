id: UNITY-PASSIVE-CONTAINERS-01
title: 'Admit Blockquote, Stat and ProfileFlag passive containers to the Unity UI Toolkit target and package'
mode: feature
lifecycle_state: draft
created_at: '2026-10-31T09:09:39.181Z'
updated_at: '2026-10-31T09:09:39.181Z'
created_by_session: 'session-5800e41f-e414-466a-a520-b46288f6bf5f'
blast_radius:
  modules:
    - 'Unity passive container lowering: carrier-backed variant axes and refused/pending semantic props'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-codegen/src/frameworks/unity'
    - 'packages/ds-codegen/src/cli.test.ts'
    - 'packages/ds-unity/Runtime/Components'
    - 'packages/ds-unity/Tests'
    - 'packages/ds-unity/README.md'
    - 'fsds.targets.json'
    - 'docs/architecture/unity-target.md'
    - 'docs/current-implementation-snapshot.md'
    - 'scripts/unity-tests.mjs'
  out: []
invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; a passive container exposes only carrier-backed style axes and its consumer content region'
acceptance:
  - id: A1
    given: 'the Blockquote, Stat and ProfileFlag contracts and renamed fact-equivalent fixtures'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'each passive root emits with its carrier-backed Variant/Size/Trend attributes, the Blockquote cite prop and ProfileFlag profile prop resolve to explicit refused/pending rules, and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the three generated controls, the thirteen-name component catalog and their USS carriers byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'consumer children are composed into each passive container and its variant-class carriers are set'
    then: 'the children render through the content container, the expected modifier classes are present, and no Cite/Profile API is emitted'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'the three admitted containers, their carrier axes and the refused citation/structured-profile non-claims are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the passive container behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove the three components from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'blockquote-container'
    type: behavior
    path: 'packages/ds-contracts/components/Blockquote/Blockquote.contract.json'
  - name: 'stat-container'
    type: behavior
    path: 'packages/ds-contracts/components/Stat/Stat.contract.json'
  - name: 'profileflag-container'
    type: behavior
    path: 'packages/ds-contracts/components/ProfileFlag/ProfileFlag.contract.json'
