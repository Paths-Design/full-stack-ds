id: UNITY-CONSUMER-TEST-PORTABILITY-01
title: 'Make the Unity package test assembly hold in a consumer project that stages nothing'
mode: fix
lifecycle_state: active
worktree: unity-consumer-tests
created_at: '2026-11-03T23:43:21.142Z'
updated_at: '2026-11-03T23:43:24.236Z'
created_by_session: '7595fd31-759a-40e1-ad95-5b82dea139a1'
blast_radius:
  modules:
    - 'Unity package EditMode test assembly and its fixtures (packages/ds-unity/Tests)'
    - 'Unity lane runner staging and provenance (scripts/unity-tests.mjs)'
    - 'SequenceControl autoplay dwell timing (packages/ds-unity/Runtime/SequenceControl.cs)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/ds-unity/Tests'
    - 'packages/ds-unity/Runtime/SequenceControl.cs'
    - 'packages/ds-unity/Runtime/AssemblyInfo.cs'
    - 'packages/ds-unity/Runtime/AssemblyInfo.cs.meta'
    - 'scripts/unity-tests.mjs'
