invariants:
  - 'Existing admitted Unity components retain their generated bytes and runtime behavior; a text input lowers only from a participating text form control whose root is the input element, and HTML form serialization stays refused'
acceptance:
  - id: A1
    given: 'the Input contract'
    when: 'the Unity emitter generates and the support-boundary audit runs'
    then: 'a TextInput behavior derives TextField, the string value channel and placeholder are emitted, HTML form/type/a11y facts are refused, and no allowlisted leaf relies on a catch-all rule'
  - id: A2
    given: 'a regenerated package on main'
    when: 'generate --target=unity runs twice and generate:check runs'
    then: 'packages/ds-unity contains the Input control and TextControl runtime, the thirty-three-name component catalog and its USS rules byte-stably, and the generated tree is git-clean'
  - id: A3
    given: 'the Unity EditMode lane with the package imported'
    when: 'typing, silent setters and controlled requests run'
    then: 'the value channel updates, ChangeEvents fire for user edits, controlled requests revert until committed, and no type/name/required/validity API is emitted'
  - id: A4
    given: 'the package README, unity-target architecture doc and implementation snapshot'
    when: 'read'
    then: 'Input, its TextField mapping, the string channel and the refused HTML form/a11y facts are stated'
observability:
  - 'tmp/unity-pilot results.xml and provenance bind the Input behavior to the tested revision'
rollback:
  - 'Revert the slice commits, remove Input from the unity allowlist and regenerate the Unity target'
non_functional: {}
contracts:
  - name: 'input-text'
    type: behavior
    path: 'packages/ds-contracts/components/Input/Input.contract.json'
