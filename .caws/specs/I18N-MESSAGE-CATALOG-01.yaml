  out: []
invariants:
  - 'Precedence is explicit prop value, then provided catalog entry, then contract default.'
  - 'Emitters lower message facts from the IR with no component-name special-casing.'
  - 'A message default is authored once, in the contract messages block; emitters never author user-facing English for a message-bearing part. Compose''s expanded/collapsed/selected stateDescription words are the one named residual, owned by the native accessibility semantics slice.'
acceptance:
  - id: A1
    given: 'a contract declaring a messages block and message:<key> bindings, content or prop defaultMessage'
    when: 'the IR builds'
    then: 'each reference lowers to a message fact resolved against the block, and an unknown key, a placeholder/param mismatch, or an unused message fails generate:check'
  - id: A2
    given: 'the contract corpus'
    when: 'generate:check runs'
    then: 'no text-bearing attribute, letter-bearing literal content, translatable string prop default, sequence label or child-component string attribute carries an English literal, and reintroducing one fails the check'
  - id: A3
    given: 'a web or React Native app providing a partial message catalog'
    when: 'a generated component renders'
    then: 'provided keys replace the default text in attributes, content and message-defaulted props, an explicit prop still wins, and missing keys fall back to the contract default, proven by runtime tests in React, Vue, Svelte, Angular, Lit and React Native'
  - id: A4
    given: 'a Carousel'
    when: 'slides render'
    then: 'slide role description, rotation start/stop labels and the per-slide position fallback come from the catalog, and the position fallback is one parameterized message rather than string concatenation in every sequence runtime'
  - id: A5
    given: 'SwiftUI and Jetpack Compose generated components'
    when: 'they render a message-bearing label'
    then: >-
      SwiftUI resolves Component.key through the FsdsMessages environment value
      (Bundle.localizedString(forKey:value:table:) over the FsdsComponents table,
      overrides first) with a generated reference FsdsComponents.xcstrings
      drift-tested against the corpus, Compose resolves through LocalFsdsMessages
      with the contract default, and neither emitter authors English for a
      message-bearing label; Compose's expanded/collapsed/selected stateDescription
      words are the named residual of the native accessibility semantics slice
  - id: A6
    given: 'the landed mechanism'
    when: 'a reader consults docs/architecture/localization.md and the claim ledger'
    then: 'each family''s consumer path and non-claims (plurals, word order around inputs, engine pilots) are documented and the ledger row cites the gate and tests'
rollback:
  - 'Revert the merge commit; contracts, IR and generated trees move together.'
non_functional: {}
