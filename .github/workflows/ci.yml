name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: Validate, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The doc-freshness check (docs:check-claims) resolves each doc's
          # verified_at_commit via rev-parse and checks ancestry via
          # merge-base — a depth-1 checkout makes every historical stamp
          # unresolvable and fails the job before tests or the rail run.
          # Full history keeps the check's real stale-stamp sensitivity.
          # FIX-CI-HISTORY-PROVISIONING-01
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The changed-path classifier is executable governance, not a helper:
      # its contract test proves each input family still reaches its local
      # pre-push gate. The coupling audit separately checks that admitted TS
      # targets and non-pnpm native compiler lanes remain in their declared
      # authorities. Both are cheap and unconditional here so neither can
      # become a dormant script by misclassifying its own edit.
      - name: Check pre-push scope and rail toolchain coupling
        run: |
          node --test scripts/prepush-scope.test.mjs
          node scripts/rail-toolchain-coupling-audit.mjs --check

      # worktree-install decides which node_modules a worktree install may
      # write; its contract test runs unconditionally for the same reason the
      # classifier's does. CI has no worktrees, so the live --check runs only
      # in the pre-push hook.
      - name: Check worktree dependency isolation contract
        run: node --test scripts/worktree-install.test.mjs

      # Attribution guard — the authority for a rule the local hooks can only
      # advise on. GitHub derives the repository contributors list from commit
      # authors AND from `Co-authored-by:` trailers whose email maps to an
      # account, publishes no UI to remove one, and charges a full history
      # rewrite to clear it afterwards (measured 2026-09-23: 3,826 of main's
      # 5,702 commits). `.githooks/commit-msg` refuses the trailer at creation
      # and `.githooks/pre-push` re-scans the pushed range, but both live on the
      # committing machine and both yield to --no-verify. This step is what
      # makes the rule hold regardless of who or what authored the commit.
      #
      # The scan is range-scoped, never full-history: three grandfathered
      # Qwen-Coder trailers from 2026-08-15 are already in main, and a
      # full-history scan would fail every run until someone rewrites them.
      # `fetch-depth: 0` above is what makes the range resolvable here.
      - name: Attribution guard (no AI-agent authorship)
        run: |
          set -euo pipefail
          # The guard's own contract test runs unconditionally, for the same
          # reason the pre-push classifier's does: a guard that silently broke
          # would read as a guard that passed. The classifier does not map a
          # `scripts/*.mjs` edit onto the test group, so this is the only place
          # a change to the rules is exercised before it ships.
          node --test scripts/attribution-guard.test.mjs

          ZERO="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/attribution-guard.mjs \
              --range "${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "$ZERO" ]; then
            node scripts/attribution-guard.mjs --range "${{ github.event.before }}..${{ github.sha }}"
          else
            # New branch (no `before`): the tip is the only commit CI can name
            # without guessing a base. The pre-push hook and the PR run cover
            # the rest once a base exists.
            node scripts/attribution-guard.mjs --range "${{ github.sha }}^!"
          fi

      # Contract-oracle catalog integrity. This is the cheap, deterministic
      # guard: every curated mutation must still resolve to its reviewed source
      # value and change exactly one contract leaf. The expensive execution of
      # those mutants lives in contract-oracle-mutations.yml, where reports and
      # per-stage logs are retained instead of taxing every push.
      - name: Check contract-oracle mutation catalog
        run: pnpm run audit:contract-oracle-mutations:selfcheck

      # Design tokens — emit composed.tokens.json before contract
      # validation. `generate:check` (next step) loads the composed
      # token graph to verify every contract's `resolvesTo` path, but
      # `composed.tokens.json` is gitignored (regenerable scratch), so
      # it has to be produced fresh in CI. Without this step, every
      # contract reports `token graph not built` DRIFT and the gate
      # fails before any real validation runs.
      - name: Build design tokens
        run: pnpm -F @full-stack-ds/tokens build

      # Contract validation — `generate:check` runs the JSON-Schema shape
      # validator AND the cross-graph semantic checks (every contract
      # resolvesTo path must exist in the composed token graph; emitted
      # CSS must match contract truth; styles selectors don't collide).
      # The bare `generate:validate` only checks shape, which is how a
      # token-graph cleanup landed silently in 2026-05: contracts still
      # referenced `semantic.overlay.scrim.dialog` after the shard was
      # deleted, and the shape validator said VALID. `generate:check` is
      # the real gate.
      - name: Validate contracts (shape + semantic)
        run: pnpm run generate:check

      # Docs-claims drift — asserts `<!-- component-count -->` markers in
      # governed docs match the loader-derived corpus count. Caught the
      # 2026-05 case where prose said 53 components but the corpus was 47.
      - name: Check docs claims (corpus count drift)
        run: pnpm run docs:check-claims

      # Doc cross-reference drift — every relative .md link in a TRACKED
      # markdown file must resolve. The docs tree was reorganised into
      # architecture/ + specifications/ + architecture/design/ without
      # re-pointing sibling `./foo.md` links, leaving 20 dead links between
      # the repo's own authority docs. Nothing walked doc links, so nothing
      # caught it. Targets that git ignores (per-machine `caws init` output)
      # are skipped, not failed.
      - name: Check docs links (cross-reference drift)
        run: pnpm run docs:check-links

      # Design tokens — DTCG validation. Catches malformed token JSON,
      # self-references, and unknown $type values in source token files
      # before the build composes them.
      - name: Validate design tokens (DTCG)
        run: pnpm run tokens:validate

      # Design tokens — drift gate. Rebuilds composed.tokens.json +
      # tokens.css and fails if the regenerated artifacts differ from
      # what's committed (same shape as the framework-src diff check
      # below, scoped to the tokens output).
      - name: Verify token build is up-to-date
        run: pnpm run tokens:build:check

      # SwiftUI semantic-defaults table — drift gate. The
      # FsdsSemanticDefaults.light table in FsdsTheme.swift is generated from
      # the committed resolved graph plus the Swift corpus's emitted refs. A
      # token change that regenerates the web trees but leaves this table
      # stale fails here, with the regeneration command named, before the
      # macOS Swift test ever runs (FIX-SWIFTUI-SEMANTIC-DEFAULTS-DRIFT-01).
      - name: Verify SwiftUI semantic-defaults table is up-to-date
        run: pnpm run swiftui:semantic-defaults:check

      # Design tokens — WCAG contrast gate. Loads resolved.tokens.json
      # and checks the curated semantic foreground × background pair
      # list (extractCanonicalPairs in build/w3c/w3c-contrast-validator.ts)
      # against AA in both light and dark themes. Fails if any declared
      # pair drops below its declared level.
      - name: Validate token contrast (WCAG AA)
        run: pnpm run tokens:check-contrast

      # Design tokens — brand-reference verifier. Every `{ref}` inside
      # the 10 brand override files must resolve to an actual token in
      # the composed graph. The token build deliberately skips brand-file
      # ref validation (brand overrides land in a separate cascade layer
      # with a local definedVars set), so `{color.palette.cobalt.500}`
      # would silently no-op at runtime without this gate.
      - name: Validate brand references
        run: pnpm run tokens:check-brand-refs

      # Design-token usage is REPORT-ONLY as of
      # RAIL-TOKEN-REFERENCE-RESOLVABILITY-01. It asked "is every declared token
      # referenced?", which is the wrong health question for a vocabulary layer:
      # base and semantic exist to be drawn from by path, and a brand may
      # legitimately ship a palette ramp ahead of its consumer. Gating on
      # reference count made that legal act fail the build — replacing a brand
      # persona orphaned 26 palette stops and blocked a push with nothing
      # broken. The blocking question is now the inverse (does every reference
      # RESOLVE) and lives in the token-resolvability ledger in the audits job.
      #
      # Non-claim: the new gate is NOT a superset. The signal dropped here — a
      # semantic token that lost its last consumer — is not preserved anywhere.
      # See docs/architecture/tokens-architecture.md.

      # Full usage report uploaded for visibility into the baseline floor
      # (398 tokens unused at baseline time, mostly data-viz palettes).
      - name: Generate token usage report
        run: pnpm run tokens:check-usage -- --output=tokens-usage-report.md
        continue-on-error: true

      - name: Upload token usage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tokens-usage-report
          path: tokens-usage-report.md
          if-no-files-found: ignore

      - name: Lint
        run: pnpm run lint

      - name: Typecheck (root + codegen)
        run: pnpm run typecheck

      - name: Typecheck (Vue)
        run: pnpm run typecheck:vue

      - name: Typecheck (Figma plugin)
        run: pnpm run typecheck:figma

      - name: Test (root)
        run: pnpm test

      - name: Test (Vue)
        run: pnpm run test:vue

      # Governed admission rail
      # (CODEGEN-RAIL-GOVERNED-CI-WIRE-01).
      #
      # Doctrine: required-mode only matters if CI invokes it after
      # generation AND refuses unstaged generated drift. The two
      # steps below encode two distinct proofs:
      #
      #   1. `governed:rail` proves the FULL generated workspace was
      #      regenerated and admitted by required-mode manifest
      #      validation (manifest present, schema v2, all hashes
      #      match, no untracked generated files, framework checks
      #      pass). See packages/ds-codegen/src/validation/required-mode.ts.
      #
      #   2. `git diff --exit-code` over the six rail-admitted framework src
      #      trees plus the registered native generated roots proves THAT
      #      regenerated workspace was already
      #      committed — i.e. the source-of-truth contracts didn't
      #      change without their emitted artifacts also being
      #      updated and committed.
      #
      # Order matters: validate first, then refuse drift. Reversing
      # would let a stale workspace pass the diff check on the way
      # in and only catch the drift after regeneration.
      #
      # `governed:rail` is local-runnable; the `git diff` step is
      # CI-only by design (locally dirty trees are routine during
      # development).
      - name: Governed generated-artifact rail
        run: pnpm run governed:rail

      - name: Generated artifacts are committed
        run: |
          git diff --exit-code -- \
            packages/ds-react/src \
            packages/ds-vue/src \
            packages/ds-svelte/src \
            packages/ds-angular/src \
            packages/ds-lit/src \
            packages/ds-react-native/src \
            packages/ds-swiftui/Sources/DsSwiftUI/Components \
            packages/ds-swiftui/Sources/DsSwiftUI/primitives \
            packages/ds-jetpack-compose/library/src/main/kotlin/com/fullstackds/components

      # Compose↔RN token-usage parity: every compose-admitted component's
      # emitted scopes follow its own consumers, shared addresses agree, and
      # supported chrome roles remain consumed. Includes rejection selfchecks.
      # Reads the generated trees after the drift check.
      - name: Compose-RN token parity
        run: pnpm run parity:compose-tokens

      # Iconography has two independent committed-output obligations. The byte
      # check proves package-root index.mjs/index.d.ts equal a fresh build; the
      # ledger check proves the content-addressed attachment edge set matches
      # that same build. The ledger rebuilds before attesting, so it cannot
      # substitute for the git diff against committed export bytes.
      - name: Iconography committed exports and emission ledger are up-to-date
        run: |
          pnpm run iconography:build:check
          pnpm run iconography:ledger:check

      # Behavior-realization rail: derives interactivity obligations (event
      # wires, compound/disclosure wiring, portal consumption) from the LIVE
      # contract corpus on every run — never a committed frozen classification
      # — and asserts each is realized in the generated output. Placed here,
      # in the gate job, because the two preceding steps have just proven the
      # generated bytes were regenerated (governed:rail) and are the committed
      # bytes (git diff --exit-code): this rail then reads THOSE verified bytes.
      # It needs no browser (static source check), so it belongs in the gate
      # job rather than the Playwright runtime-rail job. Every existing gate
      # checks SHAPE; this one checks INTERACTIVITY — the defect class
      # RAIL-BEHAVIOR-REALIZATION-AUDIT-01 was created to catch.
      - name: Behavior-realization rail (corpus-derived interactivity)
        run: pnpm run audit:behavior-realization

      # A11y-realization rail: derives accessibility obligations (ARIA
      # relationships, keyboard surfaces, focus strategies) from the LIVE
      # contract corpus and asserts each is realized in the generated output
      # of every rail-admitted family (iterated from the AdmissionDescriptor
      # registry — web + native lanes, never a hardcoded web list). Same
      # placement rationale as the behavior rail above: the preceding steps
      # proved the trees are the regenerated, committed bytes; this rail reads
      # those verified bytes. Pre-existing debt is enumerated in
      # scripts/a11y-realization-audit/known-gaps.json (each entry names its
      # owning campaign spec); the rail fails on any UNLEDGERED gap and on any
      # STALE ledger entry, so the ledger can only shrink. The defect class:
      # a contract declaring label-for / arrow-key nav / roving focus that no
      # emitter realizes while every shape gate stays green —
      # RAIL-A11Y-REALIZATION-01.
      - name: A11y-realization rail (corpus-derived accessibility)
        run: pnpm run audit:a11y-realization

      # Styling-realization ledgers. Same two-directional ratchet as the a11y
      # rail above, over two further obligation axes: slots a contract declares
      # but no rule consumes, and state values a contract declares but no
      # selector realizes. Placed after the rail + drift diff for the same
      # reason those are — these classify the committed generated bytes, which
      # the preceding steps have just proven are the regenerated ones.
      # The gate of record is .githooks/pre-push; this is the belt-and-braces
      # path for anything that reaches main without the hook —
      # RAIL-STYLING-REALIZATION-LEDGERS-01.
      - name: Dead-slot ledger (declared vs consumed slots)
        run: pnpm run audit:dead-slots

      - name: Pseudo-state ledger (declared vs realized state styling)
        run: pnpm run audit:pseudo-state

      # A third, independent obligation axis: a contract may declare that one
      # state suppresses another category (disabled suppresses interaction).
      # Realization and suppression are orthogonal — Button's `disabled` scores
      # REALIZED on the rail above while a disabled Button still takes :hover
      # border-color, because the :disabled block never resets it.
      - name: State-suppression ledger (declared suppression vs honoured in CSS)
        run: pnpm run audit:state-suppression

      # The blocking token gate (RAIL-TOKEN-REFERENCE-RESOLVABILITY-01),
      # replacing the count-based usage gate demoted to report-only above. Fires
      # when generated CSS reads a --fsds-* name the token graph never declares:
      # CSS falls back to the literal, so the property renders a plausible value
      # while the token layer is decorative for it and no brand or theme
      # re-point can reach it. Invisible to every other rail — the dead-slot
      # audit asks whether a slot has a var() consumer, and here the consumer
      # exists and reads a name nothing declares.
      - name: Token-resolvability ledger (references that never resolve)
        run: pnpm run audit:token-resolvability

      # The gate on the constraint every other gate presupposes
      # (RAIL-CUSTOM-REGION-GATE-01): generated artifacts are emitted from
      # contracts. A filled @custom region means one stopped being — and no
      # other check can see it, because preserve.ts re-emits the region
      # verbatim, so typecheck, the suites and governed:rail's byte diff all
      # stay green while the artifact diverges from its contract and the other
      # targets silently miss the edit. Ratchets in both directions: an
      # unledgered region fails, and so does a ledger entry that no longer
      # reproduces, so retired debt cannot linger on the books.
      - name: Custom-region ledger (hand edits in generated output)
        run: pnpm run audit:custom-regions

      # Motion realization (RAIL-REDUCED-MOTION-01). `contract.motion` was
      # declared by twelve contracts and read by nothing, so
      # `reducedMotion: "respect"` was a promise with no mechanism — and
      # `prefers-reduced-motion` appeared exactly once in the whole generated
      # corpus, inside a hand-authored region. The block is now derived from
      # the declarations actually emitted; this rail fails if that derivation
      # stops reaching a component that animates, and ledgers the motion token
      # references that resolve to nothing plus the transition properties no
      # emitted rule realizes.
      - name: Motion-realization ledger (reduced motion + motion tokens)
        run: pnpm run audit:motion-realization

      # Carrier reachability, both directions, one IR authority
      # (RAIL-WEB-STYLE-CARRIER-REACHABILITY-01). Forward: an authored style
      # selector that requires a component-owned carrier the Web-DOM IR never
      # produces — the rule compiles into all five packages and matches
      # nothing. Inverse: a non-default variant value whose emitted carrier no
      # rule selects, so choosing it changes nothing. Both consume
      # `deriveWebDomCarriers`; neither re-derives modifier spelling. The
      # forward validator is NOT yet an unconditional `generate:check` gate:
      # while its corpus ledger is nonzero, promoting it would mean carrying a
      # known-defect exception list inside semantic validation.
      - name: Carrier-reachability ledger (authored CSS -> producible carrier)
        run: pnpm run audit:carrier-reachability

      - name: Variant-realization ledger (emitted carrier -> reachable rule)
        run: pnpm run audit:variant-realization

  coverage-gate:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gate
    # Runs the ten scoped coverage suites (pnpm run test:coverage); every
    # runner enforces the floors declared once in coverage-floors.json
    # (vitest coverage.thresholds / jest coverageThreshold), so any floor
    # regression fails the job. Separate from `gate` so the slow
    # instrumented suites parallelize with the rail jobs instead of
    # lengthening the main critical path. Note this job is also the first
    # CI execution of the svelte/lit/angular/react-native suites — the gate
    # job runs only the root (React-focused) suite and test:vue.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build design tokens
        run: pnpm -F @full-stack-ds/tokens build

      - name: Coverage gate (all ten suites)
        run: pnpm run test:coverage

  runtime-rail:
    name: Runtime visual proof rail
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: gate
    # Runs after the gate job's pre-flight (validate/typecheck/test) passes.
    # The rail boots the Vite dev server and exercises each of the 5
    # changed components (Progress, Truncate, ShowMore, OTP, Calendar)
    # in a real Chromium under Playwright, asserting contract facts and
    # capturing screenshot baselines. Separates from the gate so that:
    #   - A rail failure (visual regression, dev-server boot issue)
    #     surfaces independently of contract validation.
    #   - The rail's Chromium download doesn't slow the gate job that
    #     also runs `pnpm test` and full typecheck.
    # Pre-push hook does NOT run this rail — too slow for the local
    # push gate; CI is where it earns its keep.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build design tokens
        run: pnpm -F @full-stack-ds/tokens build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # The screenshot describe block self-skips on CI=true (set
      # automatically by GitHub Actions) — committed snapshots are
      # darwin-only, so Linux CI would always write a baseline-missing
      # error on first run. The 20 fact-assertion tests are OS-agnostic
      # and run here. See `test.skip(!!process.env.CI, ...)` in
      # e2e/runtime-rail.spec.ts and the rail's header non-claims.
      - name: Run runtime visual proof rail (fact assertions only)
        run: pnpm run e2e:rail

      - name: Run Carousel interaction and motion regressions
        run: pnpm run e2e:carousel

      # Corpus-derived prop→DOM-attribute rail: regenerates its matrix from
      # the live contracts dir on every run (never a committed frozen
      # classification), then asserts every bound obligation across
      # react/vue/svelte/lit plus five frozen regression pins. Wired here so
      # the rail can never go silently dead again (it was unwired and
      # ENOENT-broken from its landing until RAIL-COVERAGE-DERIVATION-FIX-01).
      - name: Run render-binding rail (corpus-derived matrix)
        run: pnpm run e2e:render-binding

      # On rail failure, surface the test report + any screenshot diffs
      # so the PR reviewer can see what changed.
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-runtime-rail
          path: playwright-report/
          if-no-files-found: ignore

  native-compile-rail:
    name: Native compile rail (Kotlin compile-admission smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # RAIL-NATIVE-COMPILE-LANE-COMPOSE-SMOKE-03. Proves the rail can execute and
    # attribute a NON-pnpm, target-owned compile command — the first non-TS
    # toolchain lane. Smallest stable surface: a pinned JDK + a pinned Kotlin
    # compiler, NO Android emulator, NO runtime UI test. The lane runs two
    # passes: the valid fixture must compile (positive); the invalid `??` fixture
    # must FAIL to compile (negative) — that negative is the standing proof that
    # byte-stability is not compilation. Independent of `gate` (different
    # toolchain), so a JVM-provisioning issue surfaces on its own.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK (pinned)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Provision Kotlin compiler (pinned)
        env:
          KOTLIN_VERSION: 2.0.21
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/kotlinc.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q -o /tmp/kotlinc.zip -d /opt
          /opt/kotlinc/bin/kotlinc -version

      - name: Compile-admission positive (valid Kotlin must compile)
        run: node scripts/run-native-compile-lane.mjs --kotlinc /opt/kotlinc/bin/kotlinc

      - name: Compile-admission negative (invalid `??` Kotlin must fail to compile)
        run: node scripts/run-native-compile-lane.mjs --kotlinc /opt/kotlinc/bin/kotlinc --negative

      # FEAT-EXAMPLES-COMPOSE-SETTINGS-001. Escalates this job past bare
      # kotlinc fixtures: compiles the settings example lane's full Gradle
      # graph — the generated packages/ds-jetpack-compose tree consumed via
      # composite-build substitution, against the real Compose Multiplatform
      # JVM runtime. The only CI surface proving the generated Kotlin
      # package compiles when imported by a real consumer (the Compose twin
      # of the swift job's settings-lane step). First run bootstraps the
      # Gradle distribution + Maven artifacts; the setup-java gradle cache
      # absorbs both across runs.
      - name: Settings example compile (consumer lane over ds-jetpack-compose)
        run: ./examples/settings/compose/gradlew -p examples/settings/compose compileKotlin --no-daemon

      # FIX-NATIVE-TOKEN-RESOLVER-CONFORMANCE-01. Executes the shared
      # cross-native precedence fixture against the real Compose resolver;
      # compile-only admission cannot detect a valid-but-wrong arm order.
      - name: ds-jetpack-compose token runtime tests
        run: ./packages/ds-jetpack-compose/gradlew -p packages/ds-jetpack-compose :library:test --no-daemon

  native-compile-rail-swift:
    name: Native compile rail (Swift compile-admission smoke)
    runs-on: macos-latest
    timeout-minutes: 10
    # RAIL-NATIVE-COMPILE-LANE-SWIFT-SMOKE-04. The SECOND non-pnpm native compile
    # lane: proves RailTargetId carries a second compiler family (Swift) through
    # the SAME family-neutral runner — no Kotlin-vs-Swift branch. Smallest stable
    # surface: swiftc (preinstalled on the GitHub macOS runner via Xcode), NO
    # Xcode project, NO SwiftPM graph, NO simulator, NO XCUITest. Two passes: the
    # valid fixture must compile (positive); the invalid `?:` fixture (Kotlin's
    # elvis operator, invalid Swift) must FAIL (negative) — the byte-stability-is-
    # not-compilation proof for the Swift family. This is a SEPARATE job from
    # native-compile-rail (which stays on ubuntu-latest); the Kotlin lane does NOT
    # depend on macOS, and a swiftc/macOS-provisioning issue surfaces on its own.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Show Swift compiler (preinstalled via Xcode)
        run: swiftc --version

      - name: Compile-admission positive (valid Swift must compile)
        run: node scripts/run-native-compile-lane.mjs --lane swift-smoke --compiler "$(command -v swiftc)"

      - name: Compile-admission negative (invalid `?:` Swift must fail to compile)
        run: node scripts/run-native-compile-lane.mjs --lane swift-smoke --compiler "$(command -v swiftc)" --negative

      # FEAT-EXAMPLES-SWIFT-SETTINGS-01. Escalates this job past bare swiftc
      # fixtures: compiles the settings example lane's full SwiftPM graph
      # (including the committed generated packages/ds-swiftui tree) as a
      # consumed dependency. The only CI surface proving the generated Swift
      # package compiles when imported by a real consumer.
      - name: Settings example compile (consumer lane over ds-swiftui)
        run: swift build --package-path examples/settings/swift

      # FIX-SWIFTUI-TOKEN-RESOLVER-01. The resolver regression suite born
      # from the deduper consumption pilot — catches the nested-optional ??
      # trap class that compile-only admission cannot see.
      - name: ds-swiftui token runtime tests
        run: swift test --package-path packages/ds-swiftui

      # FIX-SWIFTUI-INTERACTION-TESTS-01. The parity fixture imports the
      # gitignored ds-codegen dist — building it here makes a stale local
      # build unable to produce a false divergence (the failure mode seen
      # on 2026-08-16 when main's dist lagged the merged emitter). The
      # workspace deps must be installed first: this job otherwise has no
      # node_modules, and bare `npx tsc` fetches the wrong npm package
      # (tsc@2.0.4) and fails before the fixture runs — the first CI
      # execution of this step (run 32037467561).
      - name: swift-react emission parity fixture (react vs swiftui)
        run: |
          pnpm install --frozen-lockfile
          pnpm -F @full-stack-ds/codegen run build
          node scripts/swift-parity-diff.mjs
