name: Analytical production browser proof
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  analytical-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run e2e:analytical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analytical-browser-${{ github.sha }}
          path: tmp/analytical-browser-proof/
          if-no-files-found: error
